    '<input class="field" type="datetime-local" style="max-width:260px;margin-top:10px;">' +
    '<div class="wiz-actions"><button class="btn btn-s" onclick="contentDoSchedule()">Schedule</button>' +
    '<button class="btn btn-p" onclick="contentDoPublish()">Publish now</button></div>';
}
async function contentDoPublish(){ await fakeCall('publish', {delay:900}); contentSuccess('published'); }
async function contentDoSchedule(){ await fakeCall('schedule', {delay:600}); contentSuccess('scheduled'); }
function contentSuccess(mode){
  el('p-flow').innerHTML =
    '<div style="text-align:center;padding:40px 0;"><div style="font-size:34px;">✓</div>' +
    '<h1 style="font-size:22px;margin:12px 0 6px;">'+(mode==='published'?'Published to Instagram':'Scheduled')+'</h1>' +
    '<p class="note" style="margin:0 auto;max-width:360px;">'+(mode==='published'?'Your post is live now.':'It will post automatically at the time you chose.')+'</p>' +
    '<div class="wiz-actions" style="justify-content:center;margin-top:20px;"><button class="btn btn-p" onclick="go(\'marketing\')">Back to Marketing</button></div></div>';
  toast(mode==='published'?'Published (simulated)':'Scheduled (simulated)', 'ok');
}
function contentDetail(id){
  const post = DATA.posts.find(x=>x.id===id);
  STATE.contentFormat = post.format;
  if (post.status==='draft' || post.status==='ready') { contentReview(); return; }
  el('p-flow').innerHTML =
    '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">'+esc(post.title)+'</h1><p class="note" style="margin-top:4px;">'+post.format+' \u00b7 '+post.date+'</p>' +
    '<div class="mini-grid" style="max-width:500px;margin-top:14px;">' +
      '<div class="mini"><b>412</b><span>Reach</span></div><div class="mini"><b>38</b><span>Likes</span></div>' +
      '<div class="mini"><b>6</b><span>Shares</span></div><div class="mini"><b>71%</b><span>Watch-through</span></div></div>';
}
function suggestFlow(){
  el('p-flow').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">Zen suggests</h1>' +
    zen('Video posts are getting 2\u00d7 the engagement of posters right now. I\u2019d suggest a <b>9-second transformation reel</b> for boys\u2019 haircuts \u2014 your strongest concept is starting to fatigue after 19 days.') +
    '<button class="btn btn-p" style="margin-top:14px;" onclick="contentFlow(\'Video\')">Create this</button>';
}
function scheduleFlow(){
  el('p-flow').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">Publishing schedule</h1><p class="note" style="margin-top:4px;">Tap any post to preview or change it.</p>' +
    '<div class="cal">' + Array.from({length:14},(_,i)=>{
      const has = DATA.posts.find(p=>p.date.includes(String(i+1)));
      return '<div class="cal-day"><div class="d">'+(i+1)+'</div>' + (has?'<div class="item '+(has.status==='draft'?'draft':'')+'" onclick="flow(()=>contentDetail(\''+has.id+'\'))">'+has.format+'</div>':'') + '</div>';
    }).join('') + '</div>';
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   INSIGHTS
   Category → detail → recommended action. Every card separates
   observed fact from Zen's interpretation, per the "no correlation
   presented as causation" principle.
   ═══════════════════════════════════════════════════════════════ */
async function insights(){
  STATE.lastPage='insights';
  const p = el('p-insights');
  p.innerHTML =
    '<div class="topline"><div class="pagetitle"><div class="kicker">Insights</div><h1>Ask your business, not a dashboard.</h1>' +
    '<p>Plain answers from your own data \u2014 no charts without an explanation.</p></div></div>' +
    '<div class="ask"><span class="spark">✦</span><input placeholder="Ask a question…" onkeydown="if(event.key===\'Enter\')askZen(this.value,\'insAnswer\')">' +
    '<button class="btn btn-p btn-sm" onclick="askZen(document.querySelector(\'#p-insights .ask input\').value,\'insAnswer\')">Ask</button></div>' +
    '<div id="insAnswer"></div>' +

    // Looking someone up is the single most common reason to open
    // this page, so it sits right under the ask box rather than one
    // more click away inside a "Customers" category tile.
    '<div class="sechead"><h2>Look up a customer</h2></div>' +
    '<div class="ask"><span class="spark">♙</span><input id="custSearch" placeholder="Search by name or number…" oninput="custSearch()"></div>' +
    '<div id="custResults"></div>' +
    '<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:12px;color:var(--muted);">Browse all '+money(DATA.stats.customers)+' customers</summary>' +
    '<div class="list" id="custList" style="margin-top:8px;"></div></details>' +

    '<div class="sechead"><h2>What the numbers say</h2></div>' +
    '<div class="grid2">' +
      insCat('♙','Customers','Patterns across everyone, not one person','customers') +
      insCat('💬','WhatsApp','What\u2019s working in your messages','whatsapp') +
      insCat('✦','Marketing','What content is performing','marketing') +
      insCat('⚡','Operations','How your salon is running day to day','operations') +
    '</div>' +

    '<details style="margin-top:16px;"><summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);">More business analysis</summary>' +
      '<div class="grid2" style="margin-top:10px;">' +
        insCat('\u{1F6D2}','What people buy','Service combinations and return behaviour','buy') +
        insCat('\u{1F4C8}','What Zen is learning','Which messages and suggestions actually work','learning') +
      '</div></details>';
  el('custList').innerHTML = DATA.customers.map(c => custRow(c)).join('');
}
const INS_COLORS = {customers:'#4E5FC8',whatsapp:'#175E52',marketing:'#A96118',operations:'#B8564A',buy:'#2D7A6B',learning:'#8A5A93'};
function insCat(ic,name,why,key){
  const c = INS_COLORS[key];
  return '<button class="task" onclick="flow(()=>insightCategory(\''+key+'\'))">' +
    '<div style="width:34px;height:34px;border-radius:9px;background:'+c+'22;color:'+c+';display:grid;place-items:center;font-size:15px;margin-bottom:8px;">'+ic+'</div>' +
    '<b style="display:block;font-size:13px;">'+name+'</b><span>'+why+'</span></button>';
}
async function insightCategory(key){
  if (key === 'marketing') { marketingInsights(); return; }
  if (key === 'whatsapp') { whatsappInsights(); return; }
  if (key === 'operations') { operationsInsights(); return; }
  if (key === 'customers') { customerInsights(); return; }
  if (key === 'buy') { buyInsights(); return; }
  if (key === 'learning') { learningInsights(); return; }
  const items = DATA.insights[key] || [];
  el('p-flow').innerHTML =
    '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;text-transform:capitalize;">'+key+' insights</h1>' +
    '<div class="stack" style="margin-top:12px;">' + items.map((x,i) =>
      '<div class="attn"><div class="n">◎</div><div><b>'+esc(x.title)+'</b><p>'+esc(x.why)+'</p></div>' +
      '<button class="btn btn-s btn-sm" onclick="flow(()=>insightDetail(\''+key+'\','+i+'))">Details</button></div>').join('') + '</div>';
}
// A single, reusable horizontal bar row - matches the prototype's own
// visual language (same CSS variables as everywhere else) rather than
// pulling in a separate charting library or a different design
// system's classes.
function barRow(label, value, max, fmt, warn){
  const pct = max > 0 ? Math.max(2, Math.round((value/max)*100)) : 0;
  return '<div style="display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px;">' +
    '<span style="flex:0 0 110px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(label)+'</span>' +
    '<span style="flex:1;height:8px;border-radius:99px;background:#eef0ec;overflow:hidden;display:block;">' +
      '<span style="display:block;height:100%;border-radius:99px;background:'+(warn?'#B8564A':'var(--green)')+';width:'+pct+'%;"></span></span>' +
    '<span style="flex:0 0 70px;text-align:right;font-weight:600;color:var(--ink);">'+esc(fmt!=null?fmt:value)+'</span></div>';
}
function chartCard(title, sub, body){
  return '<div style="border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;background:#fff;">' +
    '<h3 style="margin:0 0 3px;font:600 15px Sora;color:var(--ink);display:flow-root;">'+title+'</h3>' +
    (sub ? '<p style="margin:0 0 12px;font-size:11px;color:var(--muted);">'+sub+'</p>' : '') +
    body + '</div>';
}

// Real, from get_reports_data.engagement.campaigns - the same RPC and
// field names verified against the live backend, not invented.
// ── WhatsApp insights ────────────────────────────────────────────
// Stylist performance and marketing output live here, not under
// Operations - both are genuinely engagement/retention questions
// (who's at risk of leaving, what messaging actually produced), not
// day-to-day scheduling ones.
// Real, from get_message_conversion - matches the actual reference
// layout: campaigns sent and people who found their own way in, each
// split into two tables, with a genuine girls/boys breakdown (from
// the customer's own profile, not the template name), how many days
// it typically took, and revenue per person reached - not just an
// aggregate rate.
function conversionTableHTML(conversion){
  if (!conversion.ok) return chartCard('What conversations turn into', '', '<p class="note">'+esc(conversion.error)+'</p>');
  if (!conversion.groups || !conversion.groups.length) return chartCard('What conversations turn into', '', '<p class="note">Not enough messages yet to measure this.</p>');
  const sent = conversion.groups.filter(g=>g.outbound);
  const inbound = conversion.groups.filter(g=>!g.outbound);
  function genderCell(seg){
    if (!seg || !seg.people) return '\u2014';
    return (seg.rate!=null?seg.rate+'%':'\u2014') + '<div class="sub" style="font-size:10px;">'+seg.came_back+'/'+seg.people+(seg.thin?' thin':'')+'</div>';
  }
  function groupTable(groups){
    return '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">' +
      '<tr style="color:var(--muted);font-size:10px;text-align:left;">' +
        '<th style="padding:4px 6px;"></th><th style="padding:4px 6px;text-align:right;">People</th><th style="padding:4px 6px;text-align:right;">Rate</th>' +
        '<th style="padding:4px 6px;text-align:right;">Girls</th><th style="padding:4px 6px;text-align:right;">Boys</th>' +
        '<th style="padding:4px 6px;text-align:right;">After</th><th style="padding:4px 6px;text-align:right;">Revenue</th><th style="padding:4px 6px;text-align:right;">Each</th></tr>' +
      groups.map(g => '<tr style="border-top:1px solid var(--line);">' +
        '<td style="padding:5px 6px;"><b>'+esc(g.label)+'</b></td>' +
        '<td style="padding:5px 6px;text-align:right;">'+money(g.people)+'</td>' +
        '<td style="padding:5px 6px;text-align:right;">'+(g.rate!=null?g.rate+'%':'\u2014')+(g.thin?' <span style="color:#B8564A;font-size:10px;">thin</span>':'')+'</td>' +
        '<td style="padding:5px 6px;text-align:right;">'+genderCell(g.girls)+'</td>' +
        '<td style="padding:5px 6px;text-align:right;">'+genderCell(g.boys)+'</td>' +
        '<td style="padding:5px 6px;text-align:right;">'+(g.median_days!=null?g.median_days+'d':'\u2014')+'</td>' +
        '<td style="padding:5px 6px;text-align:right;">'+(g.revenue?'AED '+money(g.revenue):'\u2014')+'</td>' +
        '<td style="padding:5px 6px;text-align:right;">'+(g.revenue_per_message?'AED '+money(g.revenue_per_message):'\u2014')+'</td></tr>').join('') +
    '</table></div>';
  }
  const t = conversion.totals || {};
  return chartCard('What conversations turn into', 'Campaigns we sent and people who came to us, and whether either led to a visit within 30 days.',
    (sent.length ? '<div class="sechead" style="margin-top:0;"><h2>Campaigns we sent</h2></div>' + groupTable(sent) : '') +
    (inbound.length ? '<div class="sechead"><h2>People who came to us</h2></div>' + groupTable(inbound) : '') +
    '<p class="note" style="margin-top:10px;">'+money(t.came_back||0)+' of '+money(t.people||0)+' came in within 30 days ('+(t.rate!=null?t.rate+'%':'\u2014')+'), worth <b>AED '+money(t.revenue||0)+'</b>.</p>' +
    (conversion.caveat ? '<p class="note">'+esc(conversion.caveat)+'</p>' : ''));
}

async function whatsappInsights(){
  el('p-flow').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">WhatsApp insights</h1><div class="loading-block"><span class="spin"></span></div>';
  const [engage, conversion] = await Promise.all([
    call('get_engagement_intelligence', {days:30}),
    call('get_message_conversion', {days:90, window_days:30}),
  ]);
  let html = '';

  // What conversations turn into, first - the real question ("did any
  // of this lead anywhere") before the operational detail underneath
  // it. Campaigns sent and people who found their own way in, each
  // split by girls/boys, how quickly they came back, and what it was
  // worth - not just an aggregate rate.
  html += conversionTableHTML(conversion);

  if (engage.ok && engage.totals){
    const t = engage.totals, campaigns = engage.campaigns||[], lift = engage.lift, retention = engage.retention;
    html += '<div class="mini-grid" style="max-width:600px;">' +
      '<div class="mini" style="border-top:0;"><b>'+money(t.sent||0)+'</b><span>Sent, last '+engage.days+' days</span></div>' +
      '<div class="mini" style="border-top:0;"><b>'+money(t.delivered||0)+'</b><span>Delivered</span></div>' +
      '<div class="mini" style="border-top:0;"><b>'+money(t.read||0)+'</b><span>Read</span></div>' +
      '<div class="mini" style="border-top:0;"><b>'+money(t.failed||0)+'</b><span>Failed</span></div>' +
    '</div>';
    if (engage.receipts_available===false) html += '<p class="note">Delivery and read receipts only exist for messages sent after the webhook went live \u2014 not shown as zero, since that would look like failure.</p>';
    // The real answer to "does messaging actually work" - a holdout
    // group was deliberately left out, so this compares like with
    // like rather than assuming everyone who came back did so because
    // of the message. Rendered defensively: this card must never be
    // silently blank, whatever shape the real data comes back in.
    if (lift && lift.readable){
      html += chartCard('Did the messaging work?', 'Contacted customers compared against a group deliberately held back \u2014 the only honest way to know.',
        '<div class="mini-grid" style="max-width:520px;">' +
          '<div class="mini" style="border-top:0;"><b>'+(lift.contacted_rate!=null?lift.contacted_rate+'%':'\u2014')+'</b><span>Contacted, came back</span></div>' +
          '<div class="mini" style="border-top:0;"><b>'+(lift.holdout_rate!=null?lift.holdout_rate+'%':'\u2014')+'</b><span>Held back, came back anyway</span></div>' +
          '<div class="mini" style="border-top:0;"><b>'+(lift.lift_points!=null?(lift.lift_points>=0?'+':'')+lift.lift_points+' pts':'\u2014')+'</b><span>Real difference</span></div>' +
        '</div>' +
        (lift.extra_returns!=null ? '<p class="note" style="margin-top:8px;">About '+money(lift.extra_returns)+' extra visit(s) in this period are attributable to messaging, not chance.</p>' : ''));
    } else if (lift && (lift.contacted!=null || lift.holdout!=null)){
      html += chartCard('Did the messaging work?', '', '<p class="note">Not enough data yet in both groups to compare \u2014 needs at least '+(lift.min_arm!=null?lift.min_arm:30)+' in each. Contacted: '+(lift.contacted||0)+', held back: '+(lift.holdout||0)+'.</p>');
    } else {
      html += chartCard('Did the messaging work?', '', '<p class="note">No holdout comparison available yet \u2014 this needs some customers to have been deliberately held back from a send. Check the holdout percentage under Settings \u2192 Data.</p>');
    }
    // The full per-campaign breakdown - delivery/read rate alongside
    // return rate, with a thin-sample caveat so a rate computed from a
    // handful of sends doesn't read as a real finding.
    html += chartCard('Campaign performance', 'Sent, delivered, read, and who came back \u2014 per campaign.',
      campaigns.length ? '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">' +
        '<tr style="color:var(--muted);font-size:10.5px;text-align:left;">' +
          '<th style="padding:4px 6px;">Campaign</th><th style="padding:4px 6px;text-align:right;">Sent</th>' +
          '<th style="padding:4px 6px;text-align:right;">Delivered</th><th style="padding:4px 6px;text-align:right;">Read</th>' +
          '<th style="padding:4px 6px;text-align:right;">Failed</th><th style="padding:4px 6px;">Came back</th></tr>' +
        campaigns.map(c => {
          const del = engage.receipts_available && c.delivery_rate!=null ? c.delivery_rate+'%' : '\u2014';
          const rd = engage.receipts_available && c.read_rate!=null ? c.read_rate+'%' : '\u2014';
          const thin = (c.measurable||0) < 10;
          const ret = c.return_rate!=null
            ? c.return_rate+'% <span style="color:var(--muted);">('+(c.returned||0)+' of '+(c.measurable||0)+')</span>'+(thin?' <span style="color:#B8564A;">too few to read into</span>':'')
            : '<span style="color:var(--muted);">not measurable yet</span>';
          return '<tr style="border-top:1px solid var(--line);">' +
            '<td style="padding:5px 6px;"><b>'+esc(c.campaign)+'</b></td>' +
            '<td style="padding:5px 6px;text-align:right;">'+(c.sent||0)+'</td>' +
            '<td style="padding:5px 6px;text-align:right;">'+del+'</td>' +
            '<td style="padding:5px 6px;text-align:right;">'+rd+'</td>' +
            '<td style="padding:5px 6px;text-align:right;'+(c.failed?'color:#B8564A;':'')+'">'+(c.failed||0)+'</td>' +
            '<td style="padding:5px 6px;">'+ret+'</td></tr>';
        }).join('') + '</table></div>'
      : '<p class="note">No campaigns sent yet.</p>');

    // Why messages failed - real breakdown, not a single opaque count.
    const failures = engage.failure_reasons || [];
    if (failures.length) html += chartCard('Why messages failed', '',
      '<div class="list">' + failures.map(f => insLine(esc(f.reason), money(f.count))).join('') + '</div>');

    // A human answering a customer isn't a campaign attempt, so it's
    // shown separately rather than folded into the counts above.
    if (engage.replies && (engage.replies.sent || engage.replies.failed)){
      html += '<p class="note">Separately, '+money(engage.replies.sent||0)+' repl'+(engage.replies.sent===1?'y':'ies')+' were sent by hand from Conversations'+(engage.replies.failed?', '+money(engage.replies.failed)+' failed':'')+'. These aren\u2019t campaigns, so they\u2019re not counted above.</p>';
    }

    // Recent send activity, day by day.
    const daily = (engage.daily||[]).slice(-10).reverse();
    if (daily.length) html += chartCard('Recent days', '',
      '<div class="list">' + daily.map(d => insLine(esc(d.date),
        money(d.sent)+' sent'+(engage.receipts_available?' \u00b7 '+money(d.delivered)+' delivered \u00b7 '+money(d.read)+' read':'')+(d.failed?' \u00b7 '+money(d.failed)+' failed':''))).join('') + '</div>');

    if (retention) html += chartCard('Retention', 'Share of contacted customers who returned within '+retention.return_window_days+' days.',
      '<p class="note" style="margin-top:0;">'+money(retention.customers_returned)+' of '+money(retention.measured_messages)+' ('+(retention.return_rate!=null?retention.return_rate+'%':'\u2014')+') \u2014 evidence the message helped, not proof by itself; see the holdout comparison above for that.</p>');
  } else {
    html += '<p class="note">'+(engage.ok ? esc(engage.note||'No messages sent in this period.') : esc(engage.error))+'</p>';
  }

  el('p-flow').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">WhatsApp insights</h1>' + html;
}

// ── Marketing insights ───────────────────────────────────────────
// Generates the AI half of the diagnosis on demand - the metrics
// above are always real and available, but the findings/recommendations
// cost a real model call, so they're only produced when asked for.
async function runAdAnalysis(force){
  const btn = event.target;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Thinking\u2026';
  const j = await call('analyse_ad_spend', {lookback_days:30, force:!!force});
  if (!j.ok){ toast(j.error, 'err'); btn.disabled = false; btn.textContent = 'Regenerate insights'; return; }
  marketingInsights();
}
async function marketingInsights(lookbackDays){
  lookbackDays = lookbackDays || 30;
  el('p-flow').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">Marketing insights</h1><div class="loading-block"><span class="spin"></span></div>';

  // Split fast (pure database, always quick) from slow (a live
  // round-trip to Meta's own API, or an LLM call) so a slow ad
  // account never leaves the whole page looking like it never loaded -
  // the fast half renders immediately and the rest fills in after.
  const fast = call('get_reports_data', {});
  const slowPromise = Promise.all([
    call('list_creative_briefs', {}),
    call('get_meta_ads_summary', {lookback_days:lookbackDays}), call('get_marketing_diagnosis', {days:30}),
  ]);

  const reports = await fast;
  let fastHtml = '';
  if (reports.ok){
    const gc = (reports.marketing && reports.marketing.generation_counts) || {}, pc = (reports.marketing && reports.marketing.post_counts) || {};
    const maxOut = Math.max(1, gc.succeeded||0, gc.failed||0, pc.published||0, pc.pending_review||0);
    fastHtml += chartCard('Marketing output this period', 'What was generated and what actually got published.',
      barRow('Generated', gc.succeeded||0, maxOut, gc.succeeded||0) +
      barRow('Failed', gc.failed||0, maxOut, gc.failed||0, true) +
      barRow('Published', pc.published||0, maxOut, pc.published||0) +
      barRow('Awaiting review', pc.pending_review||0, maxOut, pc.pending_review||0));
  }

  el('p-flow').innerHTML = '<button class="btn btn-ghost btn-sm" onclick="flowBack()" style="margin-bottom:16px;">\u2190 Back</button>' +
    '<h1 style="font-size:22px;">Marketing insights</h1>' + fastHtml +
    '<div id="mktSlowBox"><div class="loading-block"><span class="spin"></span>Reading your real ad account and drafting a suggestion\u2026</div></div>';

  const [suggest, adSpend, diag] = await slowPromise;
  let html = '';

  // 1. Ad spend by campaign - the account-wide view, first.
  const campaigns = (adSpend.ok && adSpend.campaigns) || [];
  const maxSpend = Math.max(1, ...campaigns.map(c=>c.spend||0));
  html += chartCard(
    'Ad spend by campaign' +
      '<select onchange="marketingInsights(this.value)" style="float:right;font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;">' +
        [7,30,60,90].map(d => '<option value="'+d+'"'+(d===lookbackDays?' selected':'')+'>'+d+' days</option>').join('') + '</select>',
    'Meta ad spend in AED, per campaign, for the selected window.',
    campaigns.length ? campaigns.map(c => barRow(c.name, c.spend||0, maxSpend, 'AED '+money(c.spend||0))).join('') : (adSpend.ok ? '<p class="note">No ad spend in this window.</p>' : '<p class="note">'+esc(adSpend.error)+'</p>'));

  // 2. Marketing diagnosis - real diagnosis: what Zen can actually
  // attribute (its own contact count) against what Meta reports, plus
  // AI findings/recommendations if one has been generated - never
  // invented if it hasn't, and always dated so it's clear how current
  // the analysis is.
  if (diag.ok){
    const m = diag.metrics||{};

        '<div class="mini" style="border-top:0;"><b>'+money(m.meta_conversations||0)+'</b><span>Meta reports</span></div>' +

        '<div class="mini" style="border-top:0;"><b>'+money(m.visits||0)+'</b><span>Turned into a visit</span></div>' +
        '<div class="mini" style="border-top:0;"><b>'+(m.observed_roas!=null?m.observed_roas+'x':'\u2014')+'</b><span>Observed ROAS</span></div>' +
      '</div>' +
      (diag.confidence_note ? '<p class="note" style="margin-top:8px;">'+esc(diag.confidence_note)+'</p>' : '') +
      (diag.analysis && diag.analysis.findings && diag.analysis.findings.length ? '<div class="sechead" style="margin-top:12px;"><h2>Findings</h2></div><div class="list">' +
        diag.analysis.findings.slice(0,3).map(f => findingRow(esc(f.title), esc(f.detail||''))).join('') + '</div>' : '') +
      (diag.analysis && diag.analysis.recommendations && diag.analysis.recommendations.length ? '<div class="sechead" style="margin-top:10px;"><h2>Zen recommends</h2></div><div class="list">' +
        diag.analysis.recommendations.slice(0,3).map(r => findingRow(esc(r.action), esc(r.rationale||''))).join('') + '</div>' : '') +
      (diag.analysis_at ? '<p class="note" style="margin-top:6px;">Generated on '+esc(diag.analysis_at.slice(0,16).replace('T',' '))+'.</p>' : '') +
      '<button class="btn btn-s btn-sm" style="margin-top:4px;" onclick="runAdAnalysis(true)">Regenerate insights</button><div id="adAnalysisResult"></div>');
  } else {
    html += chartCard('Marketing diagnosis', '', '<p class="note">'+esc(diag.error)+'</p>');
  }

  // 3. Ads - a real, independently-refreshable table (own day/level
  // selectors), with real pause/resume and budget controls per row,
  // and a real history of what's been changed and why. Its own spend
  // total (rendered by loadAdsTable, below) is computed from these
  // exact same rows rather than a second, separate account-wide call -
  // two different fetches both labelled "last 30 days" could legitimately
  // return different numbers and that mismatch is what looked wrong.
  html += chartCard(
    'Ads' +
      '<div style="float:right;display:flex;gap:6px;">' +
        '<select id="adTableDays" style="font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;" onchange="loadAdsTable()">' +

        '<select id="adTableLevel" style="font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;" onchange="loadAdsTable()">' +

      '</div>',
    'What each ad set cost and what it produced. Pause, resume, or change budget from any row.',
    '<div id="adsTableBox"><div class="loading-block"><span class="spin"></span></div></div>' +
    '<div id="adActionsBox" style="margin-top:10px;"></div>');
  ADS_TABLE_CACHE = [];

  const briefs = suggest.ok ? (suggest.briefs||[]) : [];
  html += '<div class="sechead" style="margin-top:6px;"><h2>Zen suggests</h2><button class="btn btn-p btn-sm" id="genSuggestBtn" onclick="generateNewSuggestions()">Generate suggestions</button></div>' +
    '<div id="suggestionsBox">' +
    (briefs.length ? briefs.map(x =>
      '<div style="border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;">' +
        '<div style="display:flex;justify-content:space-between;"><b style="font-size:13px;">'+esc(x.angle||x.problem||'Idea')+'</b><span class="sub" style="font-size:10.5px;">'+esc((x.created_at||'').slice(0,10))+'</span></div>' +
        '<div class="wa-bubble" style="margin:8px 0;max-width:100%;">\u201c'+esc(x.hook||'')+'\u201d</div>' +
        (x.why ? '<p class="note" style="margin-top:4px;">'+esc(x.why)+'</p>' : '') +
      '</div>').join('')
      : '<p class="note">'+(suggest.ok ? 'Nothing suggested yet \u2014 press Generate suggestions above.' : esc(suggest.error))+'</p>') +
    '</div>';

  const box = el('mktSlowBox');
  if (box) box.innerHTML = html; // page may have navigated away while this was in flight
  loadAdsTable(); // independent of everything above - its own selectors, its own refresh
}
let ADS_TABLE_CACHE = [];
async function loadAdsTable(){
  const box = el('adsTableBox');
  if (!box) return; // navigated away before this fired
  // Read the checkbox's state before wiping the box - it lives inside
  // this same container, so clearing innerHTML first would destroy it
  // before its value could ever be read, leaving showAll stuck false.
  const showAll = !!(el('adTableShowAll') && el('adTableShowAll').checked);
  box.innerHTML = '<div class="loading-block"><span class="spin"></span></div>';
  const days = Number((el('adTableDays')||{}).value) || 30;
  const level = (el('adTableLevel')||{}).value || 'adset';
  const j = await call('get_ad_table', {days, level});
  if (!j.ok){ box.innerHTML = '<p class="note">'+esc(j.error)+'</p>'; return; }
  // Meta's own list includes anything it still calls ACTIVE or PAUSED,
  // which is not the same as "had activity in the selected window" -
  // a campaign that finished months ago stays listed with real spend
  // history, just none inside these particular days, and would sit in
  // the table showing zero for everything. Filtered by default to
  // what the selected day range is actually meant to answer; the
  // checkbox below brings back the full list, finished ones included.
  const allRows = j.rows||[];
  ADS_TABLE_CACHE = showAll ? allRows : allRows.filter(r => (r.spend||0) > 0 || (r.impressions||0) > 0);
  if (!ADS_TABLE_CACHE.length){
    box.innerHTML = '<p class="note">'+(allRows.length ? 'Nothing had real spend or impressions in this window.' : 'No ads in this window.')+'</p>' +
      (allRows.length ? '<label style="font-size:11px;color:var(--muted);"><input type="checkbox" id="adTableShowAll" onchange="loadAdsTable()"> Show all '+allRows.length+', including ones with no activity in this window</label>' : '');
    return;
  }
  // This total comes from the exact same response as the rows below
  // it, for the exact days/level currently selected - not a separate
  // account-wide call that could show a different "last N days" spend
  // than the table underneath it.
  const t = j.totals||{};
  box.innerHTML =
    (j.plain_summary ? zen(esc(j.plain_summary)) : '') +
    '<div class="mini-grid" style="max-width:520px;margin-bottom:10px;">' +
      '<div class="mini" style="border-top:0;"><b>AED '+money(t.spend||0)+'</b><span>Total spend, last '+j.days+' days</span></div>' +
      (j.result_labels||[]).slice(0,2).map(lbl => '<div class="mini" style="border-top:0;"><b>'+money(t[lbl]||0)+'</b><span>'+esc(lbl)+'</span></div>').join('') +
    '</div>' +
    '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">' +
    '<tr style="color:var(--muted);font-size:10.5px;text-align:left;">' +
      '<th style="padding:4px 6px;">Name</th><th style="padding:4px 6px;text-align:right;">Spend</th>' +
      '<th style="padding:4px 6px;text-align:right;">Impressions</th><th style="padding:4px 6px;text-align:right;">Clicks</th>' +
      '<th style="padding:4px 6px;text-align:right;">Result</th><th style="padding:4px 6px;text-align:right;">Cost/result</th>' +
      '<th style="padding:4px 6px;">Budget/day</th><th style="padding:4px 6px;"></th></tr>' +
    ADS_TABLE_CACHE.map((r,i) => '<tr style="border-top:1px solid var(--line);" id="adRow_'+i+'">' +
      '<td style="padding:5px 6px;"><b>'+esc(r.name)+'</b>'+(r.state==='finished'?' <span class="badge">finished</span>':'')+'</td>' +
      '<td style="padding:5px 6px;text-align:right;">AED '+money(r.spend||0)+'</td>' +
      '<td style="padding:5px 6px;text-align:right;">'+money(r.impressions||0)+'</td>' +
      '<td style="padding:5px 6px;text-align:right;">'+money(r.clicks||0)+'</td>' +
      '<td style="padding:5px 6px;text-align:right;">'+(r.result!=null?money(r.result)+' '+esc(r.result_label||''):'\u2014')+'</td>' +
      '<td style="padding:5px 6px;text-align:right;">'+(r.cost_per_result!=null?'AED '+r.cost_per_result:'\u2014')+'</td>' +
      '<td style="padding:5px 6px;">'+(r.daily_budget!=null?'AED '+money(r.daily_budget):'\u2014')+
        (r.budget_owner_id ? ' <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:10.5px;" onclick="changeAdBudget('+i+')">Change</button>' : '') + '</td>' +
      '<td style="padding:5px 6px;text-align:right;">' +
        (r.state!=='finished' ? '<button class="btn btn-s btn-sm" style="padding:2px 8px;font-size:10.5px;" onclick="toggleAdStatus('+i+')">'+(r.raw_status==='ACTIVE'?'Pause':'Resume')+'</button>' : '') +
      '</td></tr>').join('') +
  '</table></div>' +
  (allRows.length > ADS_TABLE_CACHE.length
    ? '<label style="font-size:11px;color:var(--muted);display:block;margin-top:8px;"><input type="checkbox" id="adTableShowAll" '+(showAll?'checked':'')+' onchange="loadAdsTable()"> Show all '+allRows.length+', including '+(allRows.length-ADS_TABLE_CACHE.length)+' with no activity in this window</label>'
    : '') +
  // Honest, not invented. Neither the real backend this prototype is
  // verified against, nor the reference console it was migrated from,
  // has an action that creates a new ad in an ad set or deletes one
  // from Meta - only pause/resume and budget exist as real controls.
  '<p class="note" style="margin-top:10px;font-size:10.5px;">Starting and stopping an ad (above) is real. Removing an ad from its ad set, or adding a new one, isn\u2019t available yet \u2014 that would need a real Meta ad-creation/deletion action, which doesn\u2019t exist in the backend this is built against.</p>';
}
// Pause/resume lives on the row itself (an ad's ACTIVE/PAUSED state
// is Meta's, read straight from the row) - budgets live on the ad
// set, so a row viewed "by ad" changes its parent, said out loud so
// nobody is surprised by it.
async function toggleAdStatus(i){
  const r = ADS_TABLE_CACHE[i];
  if (!r) return;
  const to = r.raw_status==='ACTIVE' ? 'PAUSED' : 'ACTIVE';
  const row = el('adRow_'+i);
  const btn = row.querySelector('button');
  btn.disabled = true; btn.textContent = '\u2026';
  const j = await call('set_ad_status', {entity_id:r.id, entity_name:r.name, status:to});
  if (!j.ok){ toast(j.error, 'err'); btn.disabled = false; btn.textContent = r.raw_status==='ACTIVE'?'Pause':'Resume'; return; }
  toast(to==='PAUSED' ? 'Paused' : 'Resumed', 'ok');
  setTimeout(loadAdsTable, 2500); // Meta takes a moment to reflect the change
}
async function changeAdBudget(i){
  const r = ADS_TABLE_CACHE[i];
  if (!r) return;
  const owner = r.level==='ad' ? ('its ad set ("'+(r.adset_name||'')+'")') : ('"'+r.name+'"');
  const v = prompt('Daily budget for '+owner+'\n\nCurrently '+(r.daily_budget||'not set')+' AED/day.', r.daily_budget||'');
  if (v===null) return;
  const n = Number(v);
  if (!n || n<=0){ toast('Enter a number above zero.', 'err'); return; }
  const j = await call('apply_ad_recommendation', {
    entity_id:r.budget_owner_id, entity_name:r.adset_name||r.name,
    verdict: n > (r.daily_budget||0) ? 'increase' : 'reduce', new_budget:n,
    reason:'Changed by hand from the ads table',
  });
  if (!j.ok){ toast(j.error, 'err'); return; }
  toast('Budget updated', 'ok');
  setTimeout(loadAdsTable, 2500);
}

// ── Operations insights ──────────────────────────────────────────
// Honest, not invented. Wait time, chair turnover and per-stylist
// revenue would belong here, but that data lives in a table never
// referenced anywhere in the real, confirmed backend - shown plainly
// as missing rather than guessed at against an unverified schema.
// Matches the reference exactly: label and value/percent on their own
// row, colored progress bar directly beneath - not the inline
// label-bar-value row barRow() uses elsewhere in this app.
function demoBar(label, value, total, color, sub, prefix){
  const pct = total > 0 ? Math.round((value/total)*1000)/10 : 0;
  return '<div style="margin-bottom:14px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;">' +
      '<span style="color:var(--ink);">'+label+'</span>' +
      '<span><b style="color:'+color+';">'+(prefix||'')+money(value)+'</b> <span style="color:var(--muted);font-size:11px;">('+pct+'%)</span></span>' +
    '</div>' +
    '<div style="height:8px;border-radius:99px;background:#eef0ec;overflow:hidden;">' +
      '<div style="height:100%;border-radius:99px;background:'+color+';width:'+Math.max(pct,pct>0?2:0)+'%;"></div>' +
    '</div>' +
    (sub ? '<div style="font-size:10.5px;color:var(--muted);margin-top:3px;">'+sub+'</div>' : '') +
  '</div>';
}
// Zen's own restrained, earthy palette - not the bright rainbow
// (bright blue/red/purple/green) copied from the original reference.
// Every color here is a shade within the same family as var(--green)
// and var(--warn), the two accents already used everywhere else in
// this app, so these charts look like part of Zen, not a different
// product's color scheme pasted in.
const DEMO_COLORS = ['#175e52','#a96118','#3d5c52','#8b6b3d','#4a5548','#6f756f','#2d4a42','#c17f4a'];
// Reusable calendar-month picker - last 12 real months, not a rolling
// day count. Every Operations tab that needs a time filter uses this
// same control, so switching between them feels consistent.
function monthSelect(onchange, selected){
  const opts = [];
  const now = new Date();
  for (let i=0; i<12; i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    opts.push('<option value="'+val+'"'+(val===selected?' selected':'')+'>'+d.toLocaleString('en',{month:'long',year:'numeric'})+'</option>');
  }
  return '<select onchange="'+onchange+'" style="float:right;font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;">'+opts.join('')+'</select>';
}

// Real - the exact same 400-day revenue and visit-count metrics used
// elsewhere in this build (get_daily_metric), aggregated into months
// client-side. No new backend action needed; this one was genuinely
// buildable today.
async function opsRevenueTab(){
  const box = el('opsTabBody');
  box.innerHTML = '<div class="loading-block"><span class="spin"></span></div>';
  const [rev, visits] = await Promise.all([
    call('get_daily_metric', {metric_key:'revenue', days:400}),
    call('get_daily_metric', {metric_key:'visits', days:400}),
  ]);
  if (!rev.ok || !visits.ok){ box.innerHTML = chartCard('Monthly revenue', '', '<p class="note">'+esc(rev.error||visits.error)+'</p>'); return; }
  const byMonth = {};
  (rev.rows||[]).forEach(r => { const m = r.metric_date.slice(0,7); (byMonth[m] ||= {revenue:0, visits:0}).revenue += Number(r.value)||0; });
  (visits.rows||[]).forEach(r => { const m = r.metric_date.slice(0,7); (byMonth[m] ||= {revenue:0, visits:0}).visits += Number(r.value)||0; });
  const months = Object.keys(byMonth).sort();
  const totalRevenue = months.reduce((t,m)=>t+byMonth[m].revenue,0);
  const totalVisits = months.reduce((t,m)=>t+byMonth[m].visits,0);
  box.innerHTML = chartCard('Monthly revenue (historical)', 'Every month with recorded activity, real transactions and revenue.',
    !months.length ? '<p class="note">No revenue history yet.</p>' :
    '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">' +
      '<tr style="background:var(--ink);color:#fff;font-size:10.5px;text-align:left;"><th style="padding:6px 8px;">Month</th><th style="padding:6px 8px;text-align:right;">Visits</th><th style="padding:6px 8px;text-align:right;">Revenue</th><th style="padding:6px 8px;text-align:right;">Avg</th></tr>' +
      months.map(m => {
        const d = byMonth[m], avgV = d.visits ? Math.round(d.revenue/d.visits) : 0;
        return '<tr style="border-top:1px solid var(--line);"><td style="padding:5px 8px;">'+esc(new Date(m+'-01').toLocaleString('en',{month:'short',year:'numeric'}))+'</td>' +
          '<td style="padding:5px 8px;text-align:right;">'+money(d.visits)+'</td>' +
          '<td style="padding:5px 8px;text-align:right;color:var(--green);font-weight:600;">AED '+money(Math.round(d.revenue))+'</td>' +
          '<td style="padding:5px 8px;text-align:right;color:var(--muted);">AED '+avgV+'</td></tr>';
      }).join('') +
      '<tr style="border-top:2px solid var(--ink);font-weight:700;"><td style="padding:6px 8px;">Total</td><td style="padding:6px 8px;text-align:right;">'+money(totalVisits)+'</td>' +
      '<td style="padding:6px 8px;text-align:right;color:var(--green);">AED '+money(Math.round(totalRevenue))+'</td>' +
      '<td style="padding:6px 8px;text-align:right;">AED '+(totalVisits?Math.round(totalRevenue/totalVisits):0)+'</td></tr>' +
    '</table></div>') +
    '<div id="revBreakdownBox"><div class="loading-block"><span class="spin"></span></div></div>';
  loadRevenueBreakdown(); // independent, own month filter
}

    (detail ? '<span style="text-align:left;margin-top:2px;">'+detail+'</span>' : '') +
