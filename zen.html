<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen · Clickable Prototype</title>
<script>
/* Catches literally anything that goes wrong anywhere on this page,
   from the very first moment the page starts loading - before the
   Supabase library, before the app's own code, before anything else.
   Every earlier "blank page" report has had no visible error attached
   to it, which means whatever is actually failing on that machine has
   never been seen - only guessed at. This makes the real error
   visible on the page itself, in plain text, so the next report can
   be a screenshot of the actual problem instead of another guess.
   No dependencies - this has to work even if everything else fails. */
(function(){
  var shown = false;
  function showFatal(title, detail){
    if (shown) return; shown = true;
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#fbfaf7;z-index:99999;padding:40px 24px;font-family:-apple-system,Segoe UI,sans-serif;overflow:auto;';
    box.innerHTML =
      '<div style="max-width:560px;margin:0 auto;">' +
      '<h1 style="font-size:20px;margin:0 0 8px;color:#1c201d;">Something on this page failed to run</h1>' +
      '<p style="color:#6f756f;font-size:13px;line-height:1.6;margin:0 0 18px;">'+title+'</p>' +
      '<pre style="background:#1c201d;color:#fff;padding:14px 16px;border-radius:10px;font-size:11.5px;' +
      'line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;">'+detail+'</pre>' +
      '<p style="color:#6f756f;font-size:12px;margin-top:16px;">Please copy the text above exactly as shown \u2014 that is the real cause, not a guess.</p>' +
      '<button onclick="location.reload()" style="margin-top:10px;background:#175e52;color:#fff;border:0;' +
      'border-radius:8px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;">Reload</button>' +
      '</div>';
    (document.body || document.documentElement).appendChild(box);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  window.addEventListener('error', function(e){
    var msg = e.message || 'Unknown error';
    var loc = (e.filename ? e.filename.split('/').pop() : 'unknown file') + ':' + (e.lineno||'?') + ':' + (e.colno||'?');
    var stack = e.error && e.error.stack ? e.error.stack : '(no stack available)';
    showFatal('A script error stopped the page here: ' + esc(loc), esc(msg + '\n\n' + stack));
  });
  window.addEventListener('unhandledrejection', function(e){
    var reason = e.reason;
    var msg = (reason && reason.message) ? reason.message : String(reason);
    var stack = (reason && reason.stack) ? reason.stack : '(no stack available)';
    showFatal('A background task failed without being caught.', esc(msg + '\n\n' + stack));
  });
  // If the page never leaves the loading state within a reasonable
  // time - no error thrown, just stuck - say so explicitly instead of
  // staying silent. A silent hang and a silent success look identical
  // from outside; this makes the difference visible.
  setTimeout(function(){
    var gate = document.getElementById('loginGate');
    var app = document.getElementById('app');
    var appVisible = app && getComputedStyle(app).display !== 'none';
    var gateVisible = gate && getComputedStyle(gate).display !== 'none';
    if (!appVisible && !gateVisible){
      showFatal('Nothing rendered within 6 seconds, and no error was thrown \u2014 this is a genuine hang, not a normal wait.',
        'document.readyState: ' + esc(document.readyState) + '\n' +
        'window.supabase defined: ' + (typeof window.supabase) + '\n' +
        'loginGate exists: ' + (!!gate));
    }
  }, 6000);
})();
</script>

<style>
/* ─────────────────────────────────────────────────────────────────
   ZERO backend. Every action here is simulated: fakeCall() returns
   canned data after a believable delay, nothing is sent anywhere.
   This file IS the interaction spec — every click maps to exactly
   one documented transition, nothing is left undefined.

   Visual language matches the approved design system extracted from
   the reference build: warm paper ground, deep forest green accent,
   amber reserved for one meaning only (this costs something).
   ───────────────────────────────────────────────────────────────── */
:root{
  --bg:#f7f8f6;--surface:#fff;--ink:#1c201d;--muted:#6f756f;--line:#e5e8e3;
  --green:#175e52;--green-soft:#e9f3ef;--warn:#a96118;--warn-soft:#fbf1e6;
  --shadow:0 12px 34px rgba(24,32,27,.08);--shadow-lg:0 24px 60px rgba(24,32,27,.16);
  --r:14px;--nav-w:216px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-family:Sora,sans-serif;font-weight:600;letter-spacing:-.015em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
a{color:var(--green);}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#d8dcd6;border-radius:9px;}

/* ── Prototype chrome (Figma-frame indicator — remove for real build) */
.proto-tag{position:fixed;top:10px;right:10px;background:#1c201d;color:#fff;font-size:10px;
  padding:4px 9px;border-radius:999px;z-index:999;font-weight:600;letter-spacing:.03em;opacity:.85;}

/* ── Onboarding shell ─────────────────────────────────────────────── */
#onb{min-height:100vh;display:none;flex-direction:column;}
.onb-top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;}
.onb-brand{display:flex;gap:9px;align-items:center;font:600 15px Sora;}
.onb-orb{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 12px Sora;}
.onb-skip{border:0;background:none;color:var(--muted);font-size:12.5px;}
.onb-progress{height:3px;background:var(--line);}
.onb-progress i{display:block;height:100%;background:var(--green);transition:width .3s;}
.onb-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 80px;}
.onb-card{width:100%;max-width:560px;}
.onb-kicker{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9aa19b;margin-bottom:10px;}
.onb-card h1{font-size:21px;line-height:1.25;margin-bottom:7px;}
.onb-card>p.sub{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:26px;max-width:480px;}
.onb-foot{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-top:1px solid var(--line);}

/* ── Buttons ──────────────────────────────────────────────────────── */
.btn{border:0;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;}
.btn-p{background:var(--ink);color:#fff;}
.btn-p:hover{background:#000;}
.btn-p:disabled{background:#c6cac5;cursor:not-allowed;}
.btn-g{background:var(--green);color:#fff;}
.btn-g:hover{background:#0e463d;}
.btn-s{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-s:hover{border-color:#cfd5cf;}
.btn-ghost{background:none;border:0;color:var(--muted);}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 13px;font-size:12px;}
.btn-lg{padding:13px 24px;font-size:14px;}
.btn-block{width:100%;justify-content:center;}
.btn-danger{background:#fff;border:1px solid #f0c4c4;color:#a02020;}

/* ── Choice / source cards (onboarding) ──────────────────────────── */
.src-grid{display:grid;gap:10px;}
.src{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:13px;padding:15px 16px;transition:border-color .15s,box-shadow .15s;}
.src:hover{border-color:#c9d0c9;}
.src.sel{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:var(--green-soft);}
.src-ic{width:38px;height:38px;border-radius:10px;background:#eef0ed;display:grid;place-items:center;font-size:17px;flex-shrink:0;}
.src b{display:block;font-size:13.5px;}
.src span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
.src .chev{margin-left:auto;color:#a7ada8;}

/* ── Inputs ───────────────────────────────────────────────────────── */
.field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;
  background:#fff;color:var(--ink);}
.field:focus{outline:2px solid var(--green);outline-offset:1px;}
label.lbl{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;}

/* ── Zen message bubble (used throughout: onboarding, approvals) ──── */
.zen-msg{display:flex;gap:11px;margin-bottom:18px;}
.zen-avatar{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font:600 11px Sora;flex-shrink:0;margin-top:1px;}
.zen-bubble{background:var(--green-soft);border-radius:4px 14px 14px 14px;padding:12px 14px;
  font-size:13px;line-height:1.55;max-width:440px;color:var(--ink);}
.zen-bubble b{font-weight:600;}
.zen-typing{display:inline-flex;gap:3px;padding:3px 0;}
.zen-typing i{width:5px;height:5px;border-radius:50%;background:#6f756f;animation:zt 1.1s infinite;}
.zen-typing i:nth-child(2){animation-delay:.15s;}
.zen-typing i:nth-child(3){animation-delay:.3s;}
@keyframes zt{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

/* ── App shell (post-onboarding) ─────────────────────────────────── */
#app{display:none;min-height:100vh;}
#app.on{display:flex;}
.side{width:var(--nav-w);flex:0 0 var(--nav-w);background:#fafbf9;border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.side-brand{display:flex;gap:9px;align-items:center;padding:6px 8px 20px;}
.side-brand b{font:600 14px Sora;display:block;}
.side-brand small{color:var(--muted);font-size:10px;display:block;}
.side-nav{display:flex;flex-direction:column;gap:2px;}
.side-btn{border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;font-size:13px;
  font-weight:500;color:#555d57;display:flex;align-items:center;gap:9px;width:100%;}
.side-btn span.ic{width:18px;text-align:center;color:#868c87;}
.side-btn:hover{background:#f0f2ef;}
.side-btn.active{background:#e9ece8;color:#1c201d;font-weight:600;}
.side-btn .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:9px;
  font-weight:700;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;}
.side-user{display:flex;gap:9px;align-items:center;padding:8px 10px;font-size:11.5px;}
.side-user .av{width:24px;height:24px;border-radius:50%;background:#d8dcd6;display:grid;place-items:center;font-size:10px;font-weight:700;}

.main{flex:1;min-width:0;padding:34px 42px 100px;max-width:1040px;}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;}
.kicker{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa19b;margin-bottom:6px;}
.pagetitle h1{font-size:19px;margin-bottom:5px;}
.pagetitle p{color:var(--muted);font-size:13px;max-width:560px;}

.mobile-top{display:none;}

/* ── Ask Zen bar ──────────────────────────────────────────────────── */
.ask{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:6px 6px 6px 14px;max-width:640px;margin:20px 0;}
.ask .spark{color:var(--green);}
.ask input{border:0;outline:0;flex:1;padding:8px 4px;font-size:13px;background:transparent;min-width:0;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 11px;
  color:#6c736e;font-size:11.5px;}
.chip:hover{background:#fff;border-color:#c9d0c9;}

/* ── Section headers / stacks ─────────────────────────────────────── */
.sechead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 9px;}
.sechead h2{font-size:15px;}
.sechead span{font-size:11px;color:var(--muted);}
.stack{border-top:1px solid var(--line);}
.stack>*{border-bottom:1px solid var(--line);}

/* ── Attention row ────────────────────────────────────────────────── */
.attn{display:grid;grid-template-columns:38px 1fr auto;gap:13px;align-items:center;padding:14px 2px;}
.attn .n{font:600 18px Sora;color:#2e3531;text-align:center;}
.attn b{font-size:13px;}
.attn p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.5;}
.attn .go{white-space:nowrap;}

/* ── Task / choice cards ──────────────────────────────────────────── */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.task{border:1px solid var(--line);background:#fff;border-radius:13px;padding:16px;text-align:left;
  cursor:pointer;min-height:92px;transition:border-color .15s;}
.task:hover{border-color:#c9d0c9;}
.task-top{display:flex;justify-content:space-between;gap:8px;}
.task b{display:block;font-size:13px;}
.task span{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:5px;}
.badge{font-size:9px;font-weight:700;background:#f1f2ef;border-radius:999px;padding:3px 8px;color:#737a74;}
.badge.on{background:var(--green-soft);color:var(--green);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}

/* ── Mini stat grid ───────────────────────────────────────────────── */
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);}
.mini{padding:14px 14px 14px 0;border-bottom:1px solid var(--line);}
.mini+.mini{padding-left:15px;border-left:1px solid var(--line);}
.mini b{font-size:19px;font-family:Sora;display:block;}
.mini span{display:block;color:var(--muted);font-size:10.5px;margin-top:4px;line-height:1.4;}

/* ── Wizard steps ─────────────────────────────────────────────────── */
.wiz-steps{display:flex;gap:0;margin-bottom:24px;max-width:560px;}
.wiz-step{flex:1;padding-top:9px;border-top:2px solid var(--line);font-size:10.5px;color:var(--muted);}
.wiz-step.done{border-top-color:var(--green);}
.wiz-step.now{border-top-color:var(--green);color:var(--ink);font-weight:600;}
.wiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;max-width:560px;}

/* ── Cost / cautionary callout — amber's ONLY meaning ────────────── */
.cost{background:var(--warn-soft);border-radius:12px;padding:13px 15px;margin-top:16px;
  font-size:12.5px;line-height:1.55;color:var(--warn);max-width:560px;}
.cost b{font-weight:600;}
.note{border-left:2px solid var(--line);padding-left:12px;color:var(--muted);font-size:12px;
  line-height:1.55;margin-top:14px;max-width:560px;}
.safety{background:var(--green-soft);border-radius:12px;padding:13px 15px;margin-top:18px;
  font-size:11.5px;line-height:1.55;max-width:560px;}
.safety b{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:4px;}

/* ── Message bubble preview (WhatsApp) ────────────────────────────── */
.wa-bubble{background:#dcf3d8;border-radius:13px 13px 13px 3px;padding:12px 14px;font-size:13px;
  line-height:1.5;max-width:340px;position:relative;}
.wa-meta{font-size:10.5px;color:var(--muted);margin-top:6px;}

/* ── Table-ish list ───────────────────────────────────────────────── */
.list{border-top:1px solid var(--line);}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;
  border-bottom:1px solid var(--line);gap:12px;}
.list-row b{font-size:12.5px;font-weight:600;}
.list-row .sub{color:var(--muted);font-size:11px;}

/* ── Modals / dialogs ─────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(20,25,22,.4);backdrop-filter:blur(2px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:min(480px,100%);
  max-height:86vh;overflow:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;
  border-bottom:1px solid var(--line);}
.modal-head h2{font-size:15px;}
.modal-x{border:0;background:none;font-size:18px;color:var(--muted);}
.modal-body{padding:18px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);}

/* ── Toast ────────────────────────────────────────────────────────── */
#toastHost{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;
  display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#1c201d;color:#fff;padding:11px 18px;border-radius:11px;font-size:12.5px;
  display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;}
.toast.ok{background:var(--green);}
.toast.err{background:#a02020;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── Loading / skeleton ───────────────────────────────────────────── */
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}
.skel{background:linear-gradient(90deg,#eee 25%,#f5f5f3 37%,#eee 63%);background-size:400% 100%;
  animation:sk 1.4s infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.loading-block{padding:24px 0;color:var(--muted);font-size:12.5px;}
.empty-block{text-align:center;padding:44px 20px;color:var(--muted);}
.empty-block h2{color:var(--ink);font-size:15px;margin-bottom:6px;}

/* ── Pages ────────────────────────────────────────────────────────── */
.page{display:none;}
.page.on{display:block;animation:pin .16s ease;}
@keyframes pin{from{opacity:.3;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ── Calendar / schedule grid ─────────────────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.cal-day{border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px;font-size:10px;
  background:#fff;}
.cal-day .d{color:var(--muted);font-weight:600;margin-bottom:4px;}
.cal-day .item{background:var(--green-soft);color:var(--green);border-radius:5px;padding:2px 5px;
  font-size:9px;margin-top:2px;font-weight:600;}
.cal-day .item.draft{background:#f1f2ef;color:#737a74;}
.cal-day .item.fail{background:#fbe3e3;color:#a02020;}


/* ── Visual components added for legibility: avatars, thumbnails,
   sparklines, progress rings, tooltips. Numbers alone don't read as
   "real" to someone who isn't used to reading dashboards — a face,
   a picture, or a line that moves does more work than a digit. ── */
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font:600 12px Sora;color:#fff;flex-shrink:0;}
.avatar-row{display:flex;align-items:center;}
.avatar-row .avatar{margin-left:-8px;border:2px solid #fff;}
.avatar-row .avatar:first-child{margin-left:0;}
.avatar-more{width:34px;height:34px;border-radius:50%;background:#eef0ed;color:var(--muted);
  display:grid;place-items:center;font-size:10px;font-weight:700;margin-left:-8px;border:2px solid #fff;}

.thumb{border-radius:10px;background:linear-gradient(135deg,#175E52,#0e463d);
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  font-size:16px;position:relative;overflow:hidden;}
.thumb.poster{background:linear-gradient(135deg,#2d7a6b,#175E52);}
.thumb.video{background:linear-gradient(135deg,#1c201d,#3a4540);}
.thumb.carousel{background:linear-gradient(135deg,#a96118,#c47f2e);}
.thumb-sm{width:44px;height:44px;border-radius:9px;font-size:14px;}

.spark{display:block;}
.spark-wrap{display:flex;align-items:flex-end;gap:10px;}
.spark-num{font:600 19px Sora;}
.trend{font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:2px;}
.trend.up{color:var(--green);}
.trend.down{color:var(--warn);}

.ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;}

.tip{position:relative;display:inline-flex;}
.tip-ic{width:15px;height:15px;border-radius:50%;background:#eef0ed;color:#8b908c;
  font-size:10px;font-weight:700;display:inline-grid;place-items:center;cursor:help;margin-left:5px;vertical-align:1px;}
.tip .tip-pop{display:none;position:absolute;top:22px;left:0;
  background:#1c201d;color:#fff;font-size:11px;line-height:1.5;padding:9px 11px;border-radius:9px;
  width:200px;z-index:50;box-shadow:var(--shadow-lg);font-weight:400;}
.tip.open .tip-pop{display:block;}
.tip-ic{cursor:pointer;}
.tip-pop:after{content:'';position:absolute;bottom:100%;left:9px;
  border:5px solid transparent;border-bottom-color:#1c201d;}

.empty-ic{width:56px;height:56px;border-radius:16px;background:var(--green-soft);color:var(--green);
  display:grid;place-items:center;font-size:24px;margin:0 auto 14px;}

.audience-preview{display:flex;align-items:center;gap:14px;margin:14px 0;}
.compare-bar{display:flex;flex-direction:column;gap:8px;max-width:400px;margin-top:10px;}
.compare-row{display:flex;align-items:center;gap:10px;}
.compare-label{font-size:11px;color:var(--muted);width:120px;flex-shrink:0;}
.compare-track{flex:1;height:20px;background:#f1f2ef;border-radius:6px;overflow:hidden;}
.compare-fill{height:100%;border-radius:6px;}
.compare-val{font-size:11.5px;font-weight:700;width:44px;text-align:right;}


.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:#d8dcd6;border-radius:999px;cursor:pointer;transition:.15s;}
.switch .track:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + .track{background:var(--green);}
.switch input:checked + .track:before{transform:translateX(16px);}
.switch input:focus-visible + .track{outline:2px solid var(--green);outline-offset:2px;}


.camp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.camp-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
  display:flex;flex-direction:column;justify-content:space-between;min-height:150px;transition:border-color .15s;}
.camp-card:hover{border-color:#c9d0c9;}
.camp-count{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  font-size:13px;font-weight:700;margin-bottom:10px;}
.camp-card b{display:block;font-size:13.5px;}
.camp-card p{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:4px;}
.camp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.camp-state{font-size:10.5px;color:var(--muted);display:flex;align-items:center;}

.wa-shell{display:flex;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:#fff;height:560px;max-height:70vh;}
.wa-list-pane{width:280px;flex:0 0 280px;border-right:1px solid var(--line);overflow-y:auto;}
.wa-convo{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;
  border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;}
.wa-convo:hover{background:var(--bg);}
.wa-convo.active{background:var(--green-soft);}
.wa-convo-name{font-size:12.5px;font-weight:600;}
.wa-convo-last{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:170px;}
.wa-convo-meta{margin-left:auto;text-align:right;flex-shrink:0;}
.wa-convo-time{font-size:9.5px;color:var(--muted);}
.wa-thread-pane{flex:1;display:flex;flex-direction:column;min-width:0;}
.wa-thread-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;}
.wa-thread-body{flex:1;overflow-y:auto;padding:16px;background:var(--bg);}
.wa-thread-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;}
.wa-thread-foot textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  font-size:12.5px;font-family:inherit;resize:none;min-height:38px;max-height:90px;}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 18px;}
.subtabs button{border:0;background:none;padding:9px 13px;font-size:12.5px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.subtabs button.active{color:var(--ink);border-bottom-color:var(--green);}

@media(max-width:860px){.camp-grid{grid-template-columns:1fr 1fr;}}

@media(max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(270px,84vw);
    transform:translateX(-105%);transition:.2s;z-index:150;box-shadow:16px 0 40px rgba(0,0,0,.15);}
  body.menu-open .side{transform:none;}
  body.menu-open .main:after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:120;}
  .main{padding:16px 14px 90px;max-width:none;}
  .mobile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .mobile-top button{border:0;background:none;font-size:19px;}
  .grid2,.grid3,.mini-grid{grid-template-columns:1fr;}
  .mini+.mini{border-left:0;padding-left:0;}
  .pagetitle h1{font-size:21px;}
  .onb-body{padding:24px 16px 70px;}
  .cal{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<div class="proto-tag">LIVE · REAL DATA</div>

  <nav class="side">

<script>
/* ═══════════════════════════════════════════════════════════════
   SIMULATED DATA LAYER
   Nothing here is real. fakeCall() is the only "backend" — it
   resolves with canned data after a believable delay, so every

/* ═══════════════════════════════════════════════════════════════
   REAL BACKEND
   Same Supabase project, same mw-admin function, same 229 actions
   as the production console. Nothing below is simulated.

function showBootError(msg){

  if (gate) gate.innerHTML =

// Opened as a local file (file://), some browsers throw the instant
// anything touches localStorage, because a local file has no real
// origin to anchor storage to - not slow, not blocked, an outright
// exception the moment Supabase's client tries to check for a saved
// session. That happens inside the library's own constructor, before
// any of this file's code gets a chance to run, so it doesn't matter
// how well the surrounding code is guarded, only whether the client
// is ever handed localStorage in the first place. This checks first,
// safely, and falls back to a plain in-memory store if real
// persistence is not available - remembering a login only lasts the
// tab in that case, but the app loads either way, which matters far
// more.
function safeStorage(){
  try{
    const k = '__zen_probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return window.localStorage;
  }catch(e){
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k,v) => { mem[k]=String(v); },
      removeItem: k => { delete mem[k]; },
    };
  }
}
if (typeof window.supabase === 'undefined'){
  showBootError('A required script did not load, possibly due to no internet connection or a blocked request. Reloading with a working connection usually fixes this.');
} else {
  try{
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storage: safeStorage(), persistSession: true } });
    // Supabase keeps a session in the browser by default - restore it
    // on load so a refresh doesn't force a fresh login every time.
    // Nothing custom is stored; this is Supabase's own persisted
    // session, through the safe storage above.
    //
    // A stale or expired token left over from an earlier login (which
    // this app now has plenty of, after a lot of testing) can make
    // getSession()'s internal refresh attempt hang indefinitely rather
    // than fail - confirmed directly, not assumed. No error, nothing
    // rendered, forever. A hard timeout means the worst case is asking
    // to log in again, never an indefinite silent hang.
    //

    // a stuck session after the timeout - which itself hung the same
    // way, for the same underlying reason, just moving the problem
    // instead of fixing it (confirmed directly, the same way this bug
    // was found in the first place). Nothing async touches Supabase's
    // client again once it has proven it can hang - the stored token
    // is removed directly and synchronously instead, which cannot
    // hang by construction.

    // Tried twice, with a timeout guard and then a synchronous
    // storage-clear fallback on top of that - and the exact same

    // in ways this environment cannot reliably reproduce or guarantee

  }catch(e){

}

async function call(action, args){
  const controller = new AbortController();
  // No call in this app should ever hang the page indefinitely - a
  // few of these (ad diagnostics, ad spend) make a live round-trip to
  // Meta's own API on top of the real database, and a slow or stalled
  // external call previously left the page spinning forever with no
  // way out and no error to explain why.
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try{
    const r = await fetch(SB_URL + '/functions/v1/mw-admin', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SB_KEY,
        'Authorization': 'Bearer ' + (session ? session.access_token : SB_KEY) },
      body: JSON.stringify(Object.assign({ action, tenant_id: tenant }, args || {})),
      signal: controller.signal,
    });
    const text = await r.text();
    let j; try { j = JSON.parse(text); }
    catch { return { ok:false, error:'The server sent something unreadable.' }; }
    if (j && typeof j === 'object'){ if (!('ok' in j)) j.ok = r.ok; return j; }
    return { ok:false, error:'Unexpected response.' };
  } catch(e){
    if (e && e.name === 'AbortError') return { ok:false, error:'This took too long to respond and was stopped after 20 seconds.' };
    return { ok:false, error:'Could not reach the server. ' + (e && e.message ? e.message : '') };
  } finally {
    clearTimeout(timeoutId);
  }
}

async function doRealLogin(){
  const m = document.getElementById('loginMsg');
  m.className = 'hint'; m.textContent = 'Logging in\u2026';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error){
    m.style.color = '#a02020';
    // A network-level failure (blocked request, no connection, CORS)
    // is a completely different problem from a wrong password, with a
    // completely different fix - telling someone their password is
    // wrong when the real cause is that the request never reached the
    // server sends them looking in exactly the wrong place, every time.
    if (window.supabase.isAuthRetryableFetchError(error)){
      m.textContent = 'Could not reach the login server \u2014 this is a connection problem, not your password. If this file was opened by double-clicking it, that is very likely the cause: see the note below.';
    } else {
      m.textContent = 'That email and password did not match. Check both and try again.';
    }
    return;
  }
  onLoggedIn(data.session);
}

  enterApp();
}

const AVATAR_COLORS = ['#175E52','#A96118','#4E5FC8','#B8564A','#2D7A6B','#8A5A93'];
function avatarColor(name){ let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; }
function avatar(name, size=34){
  const initial = (name||'?').trim()[0]?.toUpperCase()||'?';
  return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.36)+'px;background:'+avatarColor(name)+';">'+initial+'</span>';
}

}

// A small inline trend line — not a real chart library, but reads
// instantly as "this moved" rather than asking the reader to parse
// a table of numbers.
function sparkline(values, color){
  color = color || 'var(--green)';
  const w=100, h=28, max=Math.max(...values), min=Math.min(...values), range=(max-min)||1;
  const pts = values.map((v,i)=> (i/(values.length-1)*w) + ',' + (h - ((v-min)/range)*h) ).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="'+w+'" cy="'+(h-((values[values.length-1]-min)/range)*h)+'" r="2.6" fill="'+color+'"/></svg>';
}
function ring(percent, color){
  color = color || 'var(--green)';
  const r=22, c=2*Math.PI*r, off=c*(1-percent/100);
  return '<div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="5"/>' +
    '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>' +
    '<div class="ring-label">'+percent+'%</div></div>';
}

function ago(ts){
  if (!ts) return '';
  const m = (Date.now() - new Date(ts).getTime()) / 60000;
  if (m < 1) return 'just now';
  if (m < 60) return Math.round(m) + 'm ago';
  if (m < 1440) return Math.round(m/60) + 'h ago';
  return Math.round(m/1440) + 'd ago';
}

}

<script>

let WA_REFRESH_TIMER = null;
function go(name){
  if (WA_REFRESH_TIMER){ clearInterval(WA_REFRESH_TIMER); WA_REFRESH_TIMER = null; }
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id==='p-'+name));
  document.querySelectorAll('.side-btn').forEach(b=>b.classList.toggle('active', b.dataset.p===name));

  ({home,campaigns,zenwhatsapp,marketing,insights,settings})[name] && ({home,campaigns,zenwhatsapp,marketing,insights,settings})[name]();
}
function flow(fn){
  if (WA_REFRESH_TIMER){ clearInterval(WA_REFRESH_TIMER); WA_REFRESH_TIMER = null; }
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id==='p-flow'));
  document.querySelectorAll('.side-btn').forEach(b=>b.classList.remove('active'));
  window.scrollTo({top:0,behavior:'smooth'});
  fn();
}
function flowBack(){ go(STATE.lastPage||'home'); }
function wizSteps(list,at){

let HOME_CACHE = {};
async function home(){
  STATE.lastPage='home';
  const p = el('p-home');
  p.innerHTML =
    '<div class="topline"><div class="pagetitle"><div class="kicker">Home</div><h1>Good morning.</h1>' +
    '<p>Here\u2019s what needs you today.</p></div></div>' +
    '<div class="ask"><span class="spark">✦</span><input placeholder="Ask Zen anything about your business…" onkeydown="if(event.key===\'Enter\')askZen(this.value,\'homeAnswer\')">' +
    '<button class="btn btn-p btn-sm" onclick="askZen(document.querySelector(\'.ask input\').value,\'homeAnswer\')">Ask</button></div>' +
    '<div class="chips">' +
      '<button class="chip" onclick="askZen(\'How is business doing this month?\',\'homeAnswer\')">How is business doing?</button>' +
      '<button class="chip" onclick="go(\'campaigns\')">Who should I bring back?</button>' +
      '<button class="chip" onclick="go(\'marketing\')">Create something</button>' +
    '</div><div id="homeAnswer"></div>' +
    '<div class="sechead"><h2>Needs your attention</h2></div>' +
    '<div class="stack" id="homeAttn"><div class="loading-block"><span class="spin"></span>Checking your business\u2026</div></div>' +
    '<div class="sechead"><h2>This month</h2><span>Revenue</span></div>' +
    '<div id="homeResults"><div class="loading-block"><span class="spin"></span></div></div>';

  // The 400-day revenue fetch needed for the MTD comparison is the
  // slowest call on this page. It runs in parallel but is not
  // awaited before the rest of Home renders - attention items and nav
  // badges show as soon as the fast calls return, and the revenue
  // panel fills in a moment later rather than holding up everything
  // behind the slowest piece.
  const fast = Promise.all([
    call('get_command_center_data', {}), call('get_decision_buckets', {days:60}),
    call('list_conversations', {limit:30}),
  ]);
  const revPromise = call('get_daily_metric', {metric_key:'revenue', days:400});

  const [cc, buckets, convos] = await fast;
  HOME_CACHE = { cc, buckets, convos };
  const badge = el('navWaBadge');
  if (badge){ const n = convos.total_unhandled||0; badge.style.display = n?'flex':'none'; badge.textContent = n; }
  const campBadge = el('navCampBadge');
  if (campBadge){ const n = (buckets.counts&&buckets.counts.pending)||0; campBadge.style.display = n?'flex':'none'; campBadge.textContent = n; }

  // The people queue and unhandled messages already appear as nav
  // badges and attention cards above - repeating them under "results"
  // called a queue count a result, which it is not. This section now
  // shows only genuine outcomes.
  const attn = (cc.attention_items||[]).slice(0,4);
  el('homeAttn').innerHTML = attn.length ? attn.map((a,i)=>
    '<div class="attn"><div class="n">'+(i+1)+'</div><div><b>'+esc(a.title||'')+'</b><p>'+esc(String(a.detail||'').slice(0,150))+'</p></div>' +
    '<button class="btn btn-s btn-sm go" onclick="go(\'campaigns\')">Review</button></div>').join('')
    : '<div class="empty-block">'+emptyIcon('\u25ce')+'<h2>Nothing unusual today</h2><p>Zen is still watching.</p></div>';

  // Month-to-date, compared the way an owner actually thinks about it:
  // against the same number of days into recent months, and against
  // the same month last year - not just "the last 8 days". Built by
  // slicing one real 400-day fetch by actual calendar date, since the
  // backend only supports "days back from today", not arbitrary
  // date ranges.
  const revMetric = await revPromise;
  if (el('homeResults')) el('homeResults').innerHTML = mtdCompareHTML(revMetric);
}
function mtdCompareHTML(revMetric){
  if (!revMetric.ok || !revMetric.rows || !revMetric.rows.length) return '<p class="note">Not enough revenue history yet to compare.</p>';
  const byDate = {};
  revMetric.rows.forEach(r => { byDate[r.metric_date] = Number(r.value||0); });

  const today = new Date(); today.setUTCHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setUTCDate(yesterday.getUTCDate()-1);
  const dayOfMonth = yesterday.getUTCDate(); // "as of yesterday", per the actual request

  function mtdSum(monthsAgo){
    const end = new Date(Date.UTC(yesterday.getUTCFullYear(), yesterday.getUTCMonth()-monthsAgo, dayOfMonth));
    const start = new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth(), 1));
    let sum = 0, any = false;
    for (let d=new Date(start); d<=end; d.setUTCDate(d.getUTCDate()+1)){
      const key = d.toISOString().slice(0,10);
      if (key in byDate){ sum += byDate[key]; any = true; }
    }
    return any ? sum : null;
  }
  function mtdSumYearAgo(){
    const end = new Date(Date.UTC(yesterday.getUTCFullYear()-1, yesterday.getUTCMonth(), dayOfMonth));
    const start = new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth(), 1));
    let sum = 0, any = false;
    for (let d=new Date(start); d<=end; d.setUTCDate(d.getUTCDate()+1)){
      const key = d.toISOString().slice(0,10);
      if (key in byDate){ sum += byDate[key]; any = true; }
    }
    return any ? sum : null;
  }
  const thisMonth = mtdSum(0), last1 = mtdSum(1), last2 = mtdSum(2), last3 = mtdSum(3), yearAgo = mtdSumYearAgo();
  if (thisMonth == null) return '<p class="note">No revenue recorded yet this month.</p>';

  const monthName = yesterday.toLocaleString('en', {month:'long'});
  const vsLast = last1!=null ? Math.round(((thisMonth-last1)/(last1||1))*100) : null;
  const vsYear = yearAgo!=null ? Math.round(((thisMonth-yearAgo)/(yearAgo||1))*100) : null;

  return '<div class="mini" style="border-top:0;"><b class="spark-num">AED '+money(Math.round(thisMonth))+'</b>' +
    '<span>'+esc(monthName)+' so far, through yesterday'+(vsLast!=null?' \u00b7 <span class="trend '+(vsLast>=0?'up':'down')+'">'+(vsLast>=0?'\u2191':'\u2193')+' '+Math.abs(vsLast)+'% vs last month</span>':'')+'</span></div>' +
    '<div class="mini-grid" style="margin-top:8px;">' +
      (last1!=null ? '<div class="mini"><b>AED '+money(Math.round(last1))+'</b><span>Same days last month</span></div>' : '') +
      (last2!=null ? '<div class="mini"><b>AED '+money(Math.round(last2))+'</b><span>Two months ago</span></div>' : '') +
      (last3!=null ? '<div class="mini"><b>AED '+money(Math.round(last3))+'</b><span>Three months ago</span></div>' : '') +
      (yearAgo!=null ? '<div class="mini"><b>AED '+money(Math.round(yearAgo))+'</b><span>Same month last year'+(vsYear!=null?' \u00b7 <span class="trend '+(vsYear>=0?'up':'down')+'">'+(vsYear>=0?'\u2191':'\u2193')+' '+Math.abs(vsYear)+'%</span>':'')+'</span></div>' : '') +
    '</div>';
}
// Real question-answering: the backend writes and runs a SQL query
// against your actual data, then summarises the result. No canned
// answers, and nothing here decides in advance what a question means.
async function askZen(q,targetId){
  q=(q||'').trim(); if(!q) return;
  const out = el(targetId); if(!out) return;
  out.innerHTML = zen('<span class="zen-typing"><i></i><i></i><i></i></span>');

    : '<div class="empty-block">'+emptyIcon('\u2620')+'<h2>Could not answer that</h2><p>'+esc(j.error)+'</p></div>';
}

<script>

// One list, every campaign type together \u2014 nothing split across a
// Real campaign keys, matching mw_campaign_strategy exactly - not

// and the auto/manual state are all read from the real backend below.
const CAMP_LABELS = {
  nudge:{ name:'Nudge', why:'Due about now \u2014 a bit past their usual gap.' },

// ZenWhatsApp: the actual conversation inbox. Genuinely separate from
// Campaigns - this is where individual replies live, not audiences.

let WA_ACTIVE = null;
let WA_CACHE = [];
async function zenwhatsapp(){
  STATE.lastPage='zenwhatsapp';
  const p = el('p-zenwhatsapp');

    '<div class="topline"><div class="pagetitle"><div class="kicker">ZenWhatsApp</div><h1>Conversations.</h1>' +

  el('waChatPane').innerHTML =

  el('waListPane').innerHTML = WA_CACHE.map(c => {

    // element.
    const last = c.messages.reduce((newest, m) => (!newest || new Date(m.at||0) > new Date(newest.at||0)) ? m : newest, null);

  }).join('');
  waSelect(WA_ACTIVE); // not waRenderThread directly - also marks the initially-opened conversation as read, same as clicking any other one

  // Auto-refresh every 5 seconds while this page is open - cleared by
  // go()/flow() the moment the person navigates anywhere else, so it
  // never keeps polling in the background or errors against DOM that
  // no longer exists.
  WA_REFRESH_TIMER = setInterval(waAutoRefresh, 5000);
}
async function waAutoRefresh(){
  const p = el('p-zenwhatsapp');
  if (!p || !p.classList.contains('on')) return; // navigated away without the timer having been cleared yet
  const j = await call('list_conversations', {limit:40});
  if (!j.ok) return; // a transient failure here shouldn't surface as an error every 5 seconds
  const badge = el('navWaBadge');
  if (badge){ const n = j.total_unhandled||0; badge.style.display = n?'flex':'none'; badge.textContent = n; }

  WA_CACHE = (j.conversations||[]).slice().sort((a,b)=>(b.unhandled||0)-(a.unhandled||0));
  if (!WA_CACHE.length) return;
  if (!WA_CACHE.some(c=>c.mobile===WA_ACTIVE)) WA_ACTIVE = WA_CACHE[0].mobile;

  const listPane = el('waListPane');
  if (listPane) listPane.innerHTML = WA_CACHE.map(c => {
    const last = c.messages.reduce((newest, m) => (!newest || new Date(m.at||0) > new Date(newest.at||0)) ? m : newest, null);
    const name = c.customer_name || c.mobile;
    return '<button class="wa-convo'+(c.mobile===WA_ACTIVE?' active':'')+'" onclick="waSelect(\''+esc(c.mobile)+'\')">' +
      avatar(name,30) +
      '<div style="min-width:0;"><div class="wa-convo-name">'+esc(name)+'</div>' +
      '<div class="wa-convo-last">'+esc(String((last&&last.body)||'').slice(0,60))+'</div></div>' +
      '<div class="wa-convo-meta"><div class="wa-convo-time">'+ago(c.last_inbound_at)+'</div>' +
      (c.unhandled?'<span class="badge warn" style="margin-top:3px;">'+c.unhandled+'</span>':'') + '</div></button>';
  }).join('');

  // The thread itself only refreshes if there's no draft sitting in
  // the reply box - waRenderThread rebuilds that box from scratch, and
  // silently wiping out a reply someone is halfway through typing
  // every 5 seconds would be worse than a short delay in seeing a new
  // message arrive.
  const draftBox = el('waReplyBox');
  if (!draftBox || !draftBox.value.trim()) waSelect(WA_ACTIVE);
}

// Real per-message history, both directions - the earlier version
// only ever rendered outbound-send fields (status, template_name),
// so an inbound customer message showed as an empty, confusing row
// rather than its actual text. Filtered by real date ranges, default
// today, rather than a flat "last 100" with no way to narrow it.
const WA_HIST_FILTERS = [['today','Today'],['week','This week'],['30','30 days'],['60','60 days'],['90','90 days']];
function waHistSince(filter){
  const d = new Date();
  if (filter==='today'){ d.setHours(0,0,0,0); return d.toISOString(); }
  if (filter==='week'){ d.setDate(d.getDate()-7); return d.toISOString(); }
  d.setDate(d.getDate() - Number(filter));
  return d.toISOString();
}
async function loadChatHistoryInline(filter){

          '<span class="badge '+(inbound?'on':(failed?'warn':''))+'">'+(inbound?'Customer':esc(m.status||''))+'</span>' +

// Opening a conversation is what "reading" it means - the real
// mark_conversation_handled action already existed on the backend but
// was never called from anywhere in this build, which is the entire
// reason a read message kept sitting in the unread badge forever.
async function waSelect(mobile){
  WA_ACTIVE = mobile;
  el('waListPane').querySelectorAll('.wa-convo').forEach((b,i) => b.classList.toggle('active', WA_CACHE[i].mobile===mobile));
  waRenderThread(mobile);

  const convo = WA_CACHE.find(c => c.mobile === mobile);
  if (convo && convo.unhandled > 0){
    const j = await call('mark_conversation_handled', {to_number: mobile});
    if (j.ok){
      convo.unhandled = 0;
      const badgeEl = el('waListPane').querySelector('.wa-convo.active .badge');
      if (badgeEl) badgeEl.remove();
      const total = WA_CACHE.reduce((t,c) => t + (c.unhandled||0), 0);
      const navBadge = el('navWaBadge');
      if (navBadge){ navBadge.style.display = total ? 'flex' : 'none'; navBadge.textContent = total; }
    }
  }
}
function waRenderThread(mobile){
  const c = WA_CACHE.find(x=>x.mobile===mobile);
  const pane = el('waThreadPane');
  if (!pane || !c) return;
  const name = c.customer_name || c.mobile;
  // The real backend returns messages newest-first (it queries
  // created_at descending, then pushes each row onto the array in
  // that order) - rendered as-is, that puts the most recent message
  // at the top of the thread and the oldest at the bottom, backwards
  // from how every WhatsApp-style UI reads. Sorted here by actual
  // timestamp rather than trusting array order, so this is correct
  // regardless of which order the backend happens to send in.
  const ordered = c.messages.slice().sort((a,b) => new Date(a.at||0) - new Date(b.at||0));
  pane.innerHTML =
    '<div class="wa-thread-head">' + avatar(name,32) +
      '<div><b style="font-size:12.5px;">'+esc(name)+'</b><div class="sub" style="font-size:10.5px;">'+esc(c.mobile)+'</div></div></div>' +
    '<div class="wa-thread-body" id="waThreadBody">' + ordered.slice(-20).map(m =>
      '<div class="wa-bubble" style="'+(m.direction==='out'?'margin-left:auto;background:#fff;border:1px solid var(--line);':'')+'margin-bottom:8px;">' +
      (m.media_url ? '<img src="'+esc(m.media_url)+'" style="max-width:220px;border-radius:10px;display:block;margin-bottom:'+(m.body?'6px':'0')+';" loading="lazy">' : '') +
      (m.body ? esc(String(m.body).slice(0,500)) : '') +
      // Zen's own replies are marked, so it is visible which
      // conversations the reply assistant handled versus a person -
      // this was already returned by the backend and never shown.
      // list_conversations translates the raw DB direction values
      // ("inbound"/"outbound") into "in"/"out" for this exact
      // response - confirmed by reading that action directly, after
      // an earlier fix here wrongly assumed "outbound" based on a
      // different action's raw table values instead.
      (m.direction==='out' ? '<div class="wa-meta">'+(m.sent_by==='auto'?'\u2728 Zen replied':m.sent_by==='agent'?'Sent automatically':'You')+'</div>' : '') +
      '</div>').join('') + '</div>' +
    '<div class="wa-thread-foot">' +
      '<textarea id="waReplyBox" placeholder="Type a reply\u2026"></textarea>' +
      '<input type="file" id="waImageInput" accept="image/*" style="display:none;" onchange="waSendImage(\''+esc(mobile)+'\')">' +
      '<button class="btn btn-ghost btn-sm" title="Attach an image" onclick="el(\'waImageInput\').click()">\ud83d\udcf7</button>' +
      '<button class="btn btn-p btn-sm" onclick="waSendReply(\''+esc(mobile)+'\')">Send</button>' +
    '</div>';
  pane.querySelector('.wa-thread-body').scrollTop = 9999;
}
// Reads the chosen file as base64 and sends it as a real WhatsApp
// image message - send_whatsapp_image uploads it to permanent
// storage first, since Meta needs a real URL, not a raw file.
async function waSendImage(mobile){
  const input = el('waImageInput');
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024){ toast('That image is too large - please use one under 5MB.', 'err'); input.value = ''; return; }
  const btn = event.target.nextElementSibling; // the camera button sits right after the file input in the DOM
  const originalLabel = btn.textContent;
  btn.textContent = '\u2026'; btn.disabled = true;
  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const caption = (el('waReplyBox').value || '').trim();
    const j = await call('send_whatsapp_image', { to_number: mobile, image_base64: base64, content_type: file.type, caption: caption || undefined });
    if (!j.ok){ toast(j.error, 'err'); return; }
    el('waReplyBox').value = '';
    toast('Image sent', 'ok');
    await zenwhatsapp();
    waSubTab('chat');
  } catch (e) {
    toast('Could not read that image file.', 'err');
  } finally {
    input.value = '';
    btn.textContent = originalLabel; btn.disabled = false;
  }
}
async function waSendReply(mobile){
  const box = el('waReplyBox'), text = box.value.trim();
  if (!text) return;
  box.disabled = true;
  const j = await call('send_whatsapp_reply', { to_number: mobile, message: text });
  if (!j.ok){ box.disabled = false; toast(j.error, 'err'); return; }
  toast('Sent', 'ok');
  await zenwhatsapp(); // real refresh - pulls the message and unread count back from the server
  waSubTab('chat');
}

// Chat-driven rule editing - a plain-language instruction is turned
// into the exact structured fields that would change, shown as a
// diff for review, and nothing is written until explicitly applied.
let NL_PROPOSED_STRATEGY = null, NL_LAST_INSTRUCTION = '', NL_LAST_SUMMARY = '';
async function proposeStrategyInline(){
  const instruction = el('nlInstruction').value.trim();
  const r = el('nlResult');
  el('nlPreview').style.display = 'none';
  if (!instruction){ r.textContent = 'Type what you want first.'; r.style.color = '#B8564A'; return; }
  r.innerHTML = '<span class="spin"></span>Reading your instruction and checking it against current settings\u2026'; r.style.color = 'var(--muted)';
  const j = await call('propose_strategy_change', {instruction});
  if (!j.ok){ r.textContent = j.error; r.style.color = '#B8564A'; return; }
  r.textContent = '';
  NL_PROPOSED_STRATEGY = j.strategy; NL_LAST_INSTRUCTION = instruction; NL_LAST_SUMMARY = j.summary||'';
  const current = j.current||[];
  const changed = j.strategy.filter(s => {
    const before = current.find(c=>c.campaign_key===s.campaign_key) || {};
    return before.enabled!==s.enabled || before.offer_text!==s.offer_text || before.min_cooldown_days!==s.min_cooldown_days ||
      (before.trigger_days??null)!==(s.trigger_days??null) || before.notes!==s.notes;
  });
  el('nlPreview').innerHTML =
    (j.summary ? '<p class="note" style="margin-top:0;">'+esc(j.summary)+'</p>' : '') +
    (j.warnings && j.warnings.length ? j.warnings.map(w=>'<p class="note" style="color:#B8564A;">Warning: '+esc(w)+'</p>').join('') : '') +
    (changed.length ? changed.map(s => {
      const before = current.find(c=>c.campaign_key===s.campaign_key) || {};
      const label = CAMPAIGN_LABELS[s.campaign_key] || s.campaign_key;
      return '<div style="font-size:12px;padding:4px 0;"><b>'+esc(label)+'</b>: enabled '+before.enabled+' \u2192 '+s.enabled+
        ', cooldown '+(before.min_cooldown_days??'\u2014')+' \u2192 '+(s.min_cooldown_days??'\u2014')+'d'+
        (s.trigger_days!=null ? ', trigger '+(before.trigger_days??'none')+' \u2192 '+s.trigger_days+'d before' : '')+'</div>';
    }).join('') : '<p class="note">No changes detected in the structured settings.</p>') +
    '<div style="margin-top:10px;"><button class="btn btn-p btn-sm" onclick="applyStrategyInline()">Apply</button> <button class="btn btn-ghost btn-sm" onclick="cancelStrategyPreview()">Cancel</button></div>';
  el('nlPreview').style.display = 'block';
}
async function applyStrategyInline(){
  if (!NL_PROPOSED_STRATEGY){ toast('Nothing to apply.', 'err'); return; }
  const j = await call('apply_strategy_change', {strategy:NL_PROPOSED_STRATEGY, instruction:NL_LAST_INSTRUCTION, summary:NL_LAST_SUMMARY});
  if (!j.ok){ toast(j.error, 'err'); return; }
  el('nlInstruction').value = '';
  NL_PROPOSED_STRATEGY = null;
  toast('Applied', 'ok');
  whatsappSettingsPanel();
}
function cancelStrategyPreview(){
  NL_PROPOSED_STRATEGY = null;
  el('nlPreview').style.display = 'none';
  el('nlResult').textContent = '';
}

const CAMP_STEPS = ['Audience','Message','Test','Schedule'];
const campPlan = { key:null, size:0, holdPct:20, wave:null };

function campaignFlow(key){ campPlan.key = key; campAudience(); }

// Real, individual selection - not a fixed server-picked batch. Every
// row here is a real mw_agent_decisions id, and commit_wave accepts
// any set of ids directly, so a person can genuinely choose exactly
// who gets a message rather than only accepting or rejecting a whole
// group at once.
async function campAudience(){
  const t = CAMPAIGN_TYPES.find(x=>x.key===campPlan.key) || { name:campPlan.key, why:'', count:0 };
  el('p-flow').innerHTML = wizSteps(CAMP_STEPS,0) + '<h1 style="font-size:22px;">'+esc(t.name)+'</h1>' +
    '<div class="loading-block"><span class="spin"></span>Working out who to include\u2026</div>';

  // get_decision_buckets' pending list is capped at 300 rows shared
  // across every campaign type combined - with lapsed alone running
  // over a thousand, that cap can leave a smaller campaign like nudge
  // showing only a handful of names even though its real count is
  // higher. plan_wave queries this one campaign directly, so it is not
  // subject to that shared cap - the right source for a real,
  // complete candidate list.
  const j = await call('plan_wave', { campaign_key: campPlan.key, size: Math.min(250, t.count || 250), control_percent: 0 });
  if (!j.ok){ el('p-flow').innerHTML = wizSteps(CAMP_STEPS,0) + errBlock(j.error); return; }
  const rows = (j.wave||[]).map(w => ({ id:w.id, customer_name:w.name, mobile:w.mobile, last_visit:w.last_visit }));
  campPlan.rows = rows;
  campPlan.selected = new Set(rows.map(r=>r.id)); // everyone starts selected
  campPlan.realTotal = t.count; // for the "N of the real total" note below

  campRenderAudience();
}

// On-demand only, never for every row upfront - fetching a full

// list even renders would be the exact kind of avoidable slowness
// already flagged as a problem.
async function campShowVisits(name, mobile){
  openModal('<div class="modal-head"><h2>'+esc(name||mobile)+'</h2><button class="modal-x" onclick="closeModal()">\u00d7</button></div>' +
    '<div class="modal-body" id="campVisitsBody"><div class="loading-block"><span class="spin"></span>Looking up their visit history\u2026</div></div>');

async function campRejectAll(){

async function campMessage(){

    '<div class="loading-block"><span class="spin"></span>Reading the approved template\u2026</div>';

  // The real, WhatsApp-approved template for this campaign - not a
  // message we made up. get_decision_buckets has no message text at
  // all, so this is composed from the real mapping plus the real,
  // live template body.
  const [mapJ, tplJ] = await Promise.all([ call('list_template_mappings', {}), call('list_sendable_templates', {}) ]);
  // The real table column is type_key, not campaign_key - this
  // mismatch was the actual cause of "no template found" for every
  // campaign, regardless of what was really mapped in the database.
  const mapping = (mapJ.ok ? (mapJ.mappings||[]) : []).find(m => m.type_key === campPlan.key);
  const templates = tplJ.ok ? (tplJ.templates||[]) : [];
  const tpl = mapping ? templates.find(x => x.name === mapping.template_name) : null;

  if (!tpl){
    el('p-flow').innerHTML = wizSteps(CAMP_STEPS,1) + '<h1 style="font-size:22px;">Review the message</h1>' +
      '<div class="empty-block">'+emptyIcon('\u2620')+'<h2>No approved template found for this campaign</h2>' +
      '<p>'+esc(!tplJ.ok ? tplJ.error : 'This campaign has no template mapped in WhatsApp Manager yet.')+'</p></div>' +
      '<div class="wiz-actions"><button class="btn btn-ghost" onclick="campAudience()">Back</button></div>';
    return;
  }
  campPlan.template = tpl.name;
  el('p-flow').innerHTML =
    wizSteps(CAMP_STEPS,1) + '<h1 style="font-size:22px;">Review the message</h1>' +
    zen('This is the real, WhatsApp-approved template Zen will use. Each customer\u2019s name and details fill in the blanks.') +
    '<div class="wa-bubble" style="margin-top:12px;">'+esc(tpl.body||'')+'</div>' +

    '<div class="note">You cannot edit this here'+tip('WhatsApp checks every template in advance. Changes go through WhatsApp Manager and need re-approval before they can be used.')+' \u2014 changes go through WhatsApp Manager and need approval again.</div>' +

async function campSendTest(){

async function campSchedule(){
  el('p-flow').innerHTML = wizSteps(CAMP_STEPS,3) + '<h1 style="font-size:22px;">Ready to send</h1>' +
    '<div class="loading-block"><span class="spin"></span>Checking today\u2019s allowance\u2026</div>';
  const room = await call('list_failed_sends', {days:1});
  if (!room.ok){ el('p-flow').innerHTML = wizSteps(CAMP_STEPS,3) + errBlock('Could not check today\u2019s allowance, so this stops here. '+room.error, 'campSchedule()'); return; }
  const left = room.room_left != null ? room.room_left : 0;

  // Exactly who was checked in the audience step - not a server-side
  // re-pick. If more were selected than today allows, the excess stay
  // queued rather than silently failing at send time.
  const selectedIds = [...campPlan.selected];
  const capped = selectedIds.slice(0, Math.max(0, left));
  const overflow = selectedIds.length - capped.length;
  const held = Math.round(capped.length*campPlan.holdPct/100), sending = capped.length-held;
  campPlan.capped = capped; campPlan.held = held;

  el('p-flow').innerHTML =
    wizSteps(CAMP_STEPS,3) + '<h1 style="font-size:22px;">Ready to send</h1><p class="note" style="margin-top:4px;">Nothing has gone out yet.</p>' +
    '<div style="background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;max-width:520px;margin-top:12px;display:flex;gap:18px;align-items:center;">' +
      ring(capped.length ? Math.round(sending/capped.length*100) : 0) +
      '<div style="flex:1;">' + rowKV('You selected', money(selectedIds.length)) +
      (overflow>0 ? rowKV('Over today\u2019s allowance, stays queued'+tip('WhatsApp allows about 250 unique people a day. The rest of your selection will still be here tomorrow.'), money(overflow)) : '') +
      rowKV('Getting a message', money(sending)) +
      rowKV('Kept back to measure results'+tip('A small group is left out on purpose so you can see whether the message actually caused people to return, not just that they happened to visit anyway.'), money(held)) +
      rowKV('Today\u2019s allowance left after this', money(left-sending)) + '</div></div>' +
    '<div class="wiz-actions"><button class="btn btn-ghost" onclick="campTest()">Back</button>' +
    '<button class="btn btn-p btn-lg" id="campSendBtn" '+(sending?'':'disabled')+' onclick="campDoSend()">Send to '+money(sending)+' customers</button></div>';
}
function rowKV(k,v){ return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;"><span style="color:var(--muted);">'+k+'</span><b>'+v+'</b></div>'; }
async function campDoSend(){
  const btn = el('campSendBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Sending\u2026';
  // The exact people chosen in the audience step, split into send vs
  // held-back client-side - no server auto-pick involved once someone
  // has made a manual selection.
  const held = new Set(campPlan.capped.slice(0, campPlan.held));
  const send = campPlan.capped.filter(id => !held.has(id));
  const j = await call('commit_wave', { send_ids: send, control_ids: [...held], review_first:false });
  if (!j.ok){ btn.disabled=false; btn.innerHTML='Send'; toast(j.error, 'err'); return; }
  el('p-flow').innerHTML =
    '<div style="text-align:center;padding:40px 0;">' +
    '<div style="font-size:34px;">\u2713</div><h1 style="font-size:23px;margin:12px 0 6px;">On their way</h1>' +
    '<p class="note" style="margin:0 auto;max-width:400px;">'+money(j.queued)+' customers will hear from you shortly. '+money(j.held_back)+' were kept back on purpose.</p>' +
    '<div class="wiz-actions" style="justify-content:center;margin-top:22px;"><button class="btn btn-p" onclick="go(\'campaigns\')">Back to Campaigns</button></div></div>';

  HOME_CACHE.buckets = null;
}
