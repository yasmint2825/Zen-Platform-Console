  think.remove();
  if (!j.ok){ el('log').appendChild(errorCard(j.error || 'This plan isn\u2019t available any more.')); return; }
  (j.cards || []).forEach(c => el('log').appendChild(renderCard(c)));
  if (!(j.cards || []).length) el('log').appendChild(renderCard({ type: 'answer', title: 'Still planning', body: 'This plan isn\u2019t ready yet. I\u2019ll ring the bell when it is.' }));
}
async function openThread(id, title){
  threadId = id; el('log').innerHTML = ''; el('convoTitle').textContent = title || 'Conversation'; el('convoRename').hidden = false;
  showConvo();
  const think = addThinking(['Opening the conversation']);
  const j = await zen('get_thread', { thread_id: id }, 20000);
  think.remove();
  if (!j.ok){ el('log').appendChild(errorCard(j.error)); return; }
  (j.messages || []).forEach(m => {
    if (m.role === 'user') addYou(m.text);
    else (m.cards || []).forEach(c => el('log').appendChild(renderCard(c)));
  });
  const planned = new Set(); (j.messages || []).forEach(m => (m.cards || []).forEach(c => { if (/plan is ready|couldn.t plan/i.test(c.title || '')) planned.add(1); }));
  const lastPoll = (j.messages || []).flatMap(m => m.cards || []).filter(c => c.poll).pop();
  if (lastPoll && !planned.size) watchCampaigns([lastPoll]);
}

// ---------- sending ----------
function sendFrom(id){ const t = el(id).value.trim(); if (t){ el(id).value = ''; send(t); } }
['bigInput','dockInput'].forEach(id => el(id).addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendFrom(id); }
}));

async function send(text, opts){
  if (busy) return;
  busy = true;
  if (!threadId){ el('log').innerHTML = ''; el('convoTitle').textContent = text.length > 60 ? text.slice(0,57) + '…' : text; el('convoRename').hidden = true; }
  showConvo();
  addYou(text);
  const think = addThinking(['Understanding what you need', 'Checking your business', 'Putting it together']);
  const j = await zen('chat', { message: text, thread_id: threadId, acted_nudge_id: opts && opts.nudgeId, context: opts && opts.context }, 120000);
  think.remove();
  busy = false;
  if (!j.ok){ el('log').appendChild(errorCard(j.error, text)); return; }
  threadId = j.thread_id || threadId;
  el('convoRename').hidden = !threadId;
  (j.cards || []).forEach(c => el('log').appendChild(renderCard(c)));
  watchCampaigns(j.cards || []);
  el('dockInput').focus();
}
// A campaign being planned in the background: check quietly, and add the plan here when it's ready.
const WATCH = {};
function watchCampaigns(cards){
  cards.filter(c => c.poll && c.poll.campaign && !WATCH[c.poll.campaign]).forEach(c => {
    const ref = c.poll.campaign, tid = threadId, started = Date.now();
    const think = addThinking(['Planning the campaign', 'Checking your calendar and results', 'Planning each channel', 'Briefing the creatives', 'Putting it together']);
    WATCH[ref] = setInterval(async () => {
      const j = await zen('campaign_status', { ref }, 20000);
      const done = j.ok && (j.stage === 'ready' || j.stage === 'failed');
      if (!done && Date.now() - started < 8 * 60 * 1000) return;
      clearInterval(WATCH[ref]); think.remove();
      if (threadId === tid && el('convo').style.display === 'flex')
        (done ? j.cards : [{ type: 'answer', title: 'Still planning', body: 'This is taking longer than usual. I\u2019ll ring the bell when it\u2019s ready.' }]).forEach(x => el('log').appendChild(renderCard(x)));
      refreshBell();
    }, 6000);
  });
}

function addYou(text){
  const d = document.createElement('div'); d.className = 'you'; d.textContent = text;
  el('log').appendChild(d); d.scrollIntoView({ block:'end', behavior:'smooth' });
}
function addThinking(lines){
  const d = document.createElement('div'); d.className = 'thinking'; d.setAttribute('role','status');
  d.innerHTML = '<span class="pulse"></span><span></span>';
  const label = d.lastChild; let i = 0; label.textContent = lines[0];
  const t = setInterval(() => { i = Math.min(i + 1, lines.length - 1); label.textContent = lines[i]; }, 2200);
  const remove = d.remove.bind(d); d.remove = () => { clearInterval(t); remove(); };
  el('log').appendChild(d); d.scrollIntoView({ block:'end', behavior:'smooth' });
  return d;
}
function errorCard(msg, retryText){
  const d = document.createElement('div'); d.className = 'card err-card';
  d.innerHTML = '<h3>That didn\u2019t work</h3><div class="body">' + esc(msg || 'Something went wrong.') + '</div>' +
    (retryText ? '<div class="actions"><button class="btn btn-s" type="button">Try again</button></div>' : '');
  if (retryText) d.querySelector('button').onclick = () => { d.remove(); send(retryText); };
  return d;
}

const WA = { tab:'inbox', inbox:null, active:null, timer:null, campaigns:null };
document.querySelectorAll('[data-watab]').forEach(b => b.addEventListener('click', () => waTab(b.dataset.watab)));

function stopWaRefresh(){ if (WA.timer){ clearInterval(WA.timer); WA.timer = null; } }

function waTab(tab){
  WA.tab = tab;
  document.querySelectorAll('[data-watab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.watab === tab)));
  el('waInbox').hidden = tab !== 'inbox';
  el('waCamps').hidden = tab !== 'campaigns';
  el('waResults').hidden = tab !== 'results';
  stopWaRefresh();
  if (tab === 'inbox'){
    loadInbox(true);
    // Refresh every 30s, like ZenPro, but never while a reply is being typed.
    WA.timer = setInterval(() => { const box = el('waReply'); if (!box || !box.value.trim()) loadInbox(false); }, 30000);
  }
  if (tab === 'campaigns') loadCampaigns();
  if (tab === 'results') loadWaResults();
}

function timeLeft(iso){
  const ms = Date.parse(iso) - Date.now();
  if (ms <= 0) return null;
  const mins = Math.ceil(ms / 60000), h = Math.floor(mins / 60), m = mins % 60;
  return h ? h + 'h' + (m ? ' ' + m + 'm' : '') : m + ' min';
}
function msgTime(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
const TOPIC = { booking:['t-book','Wants to book'], price:['t-price','Asked about price'], complaint:['t-alert','May be unhappy'], stop:['t-alert','Asked to stop'] };

async function loadInbox(first){
  const box = el('waInbox');
  if (first && !WA.inbox) box.innerHTML = '<div class="empty">Loading conversations…</div>';
  const j = await zen('wa_inbox', {}, 30000);
  if (!j.ok){ if (first) box.innerHTML = '<div class="empty">' + esc(j.error) + '</div>'; return; }
  WA.inbox = j.inbox;
  const convs = WA.inbox.conversations;
  if (!convs.length){ box.innerHTML = '<div class="empty">No messages yet. When a customer messages you on WhatsApp or Instagram, it shows up here.</div>'; return; }
  if (!WA.active || !convs.some(c => c.id === WA.active)) WA.active = first && window.innerWidth <= 760 ? null : convs[0].id;
  const i = WA.inbox;
  const strip = [
    ['', i.waiting, i.waiting === 1 ? 'waiting for a reply' : 'waiting for a reply'],
    ['warn', i.closing_soon, 'reply window closing soon'],
    ['', i.ready_to_book, i.ready_to_book === 1 ? 'wants to book' : 'want to book'],
    ['', i.asked_price, 'asked about price'],
    ['', i.from_ads, 'came from an ad'],
  ].filter(x => x[1]).map(([cls, n, label]) => '<span class="pill ' + cls + '"><b>' + n + '</b> ' + esc(label) + '</span>').join('');
  const keepDraft = el('waReply') ? el('waReply').value : '';
  box.innerHTML = '<div class="strip">' + (strip || '<span class="pill">Nobody is waiting for a reply</span>') + '</div>' +
    '<div class="inbox' + (WA.active && window.innerWidth <= 760 ? ' open' : '') + '" id="waGrid"><div class="clist" id="waList" role="list"></div><div class="thread" id="waThread"></div></div>';
  el('waList').innerHTML = convs.map(c => {
    const tags = [];
    if (c.unhandled) tags.push('<span class="t t-unread">' + c.unhandled + ' new</span>');
    if (c.topic && TOPIC[c.topic]) tags.push('<span class="t ' + TOPIC[c.topic][0] + '">' + TOPIC[c.topic][1] + '</span>');
    if (c.needs_reply && c.window_open){ const left = timeLeft(c.window_closes_at); if (left && Date.parse(c.window_closes_at) - Date.now() < 6*3600000) tags.push('<span class="t t-clock">Reply within ' + left + '</span>'); }
    if (c.from_ad) tags.push('<span class="t">From an ad</span>');
    if (c.channel === 'instagram') tags.push('<span class="t">Instagram</span>');
    return '<button class="citem" role="listitem" data-conv="' + esc(c.id) + '"' + (c.id === WA.active ? ' aria-current="true"' : '') + '>' +
      '<div class="crow"><span class="cname">' + esc(c.name) + '</span><span class="ctime">' + esc(ago(c.last_at)) + '</span></div>' +
      '<div class="clast">' + esc(c.last_text) + '</div>' + (tags.length ? '<div class="ctags">' + tags.join('') + '</div>' : '') + '</button>';
  }).join('');
  el('waList').querySelectorAll('[data-conv]').forEach(b => b.onclick = () => openConversation(b.dataset.conv));
  if (WA.active) renderThread(WA.active, keepDraft);
}

async function openConversation(id){
  WA.active = id;
  el('waList').querySelectorAll('[data-conv]').forEach(b => { if (b.dataset.conv === id) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
  el('waGrid').classList.add('open'); el('waInbox').classList.add('thread-open');
  renderThread(id, '');
  const c = WA.inbox.conversations.find(x => x.id === id);
  if (c && c.unhandled){
    const j = await zen('wa_mark_read', { conversation_id: id }, 15000);
    if (j.ok){ c.unhandled = 0; c.needs_reply = false; const tag = el('waList').querySelector('[data-conv="' + CSS.escape(id) + '"] .t-unread'); if (tag) tag.remove(); }
  }
}

function renderThread(id, draft){
  const c = WA.inbox.conversations.find(x => x.id === id);
  const pane = el('waThread');
  if (!c){ pane.innerHTML = ''; return; }
  const who = m => m.direction !== 'out' ? '' : (m.sent_by === 'auto' ? ' · Zen replied' : m.sent_by === 'agent' ? ' · Sent automatically' : ' · You');
  const msgs = c.messages.map(m => '<div class="msg ' + (m.direction === 'out' ? 'out' : '') + '">' +
    (m.media_url ? '<img src="' + esc(m.media_url) + '" alt="Photo" loading="lazy">' : '') + esc(m.body) +
    '<div class="meta">' + esc(msgTime(m.at)) + esc(who(m)) + '</div></div>').join('');
  const left = c.window_open ? timeLeft(c.window_closes_at) : null;
  const channel = c.channel === 'instagram' ? 'Instagram' : 'WhatsApp';
  const foot = c.window_open
    ? '<div class="tfoot"><label class="sr" for="waReply">Reply to ' + esc(c.name) + '</label>' +
      '<textarea id="waReply" placeholder="Write a reply, or let Zen draft one"></textarea>' +
      '<div class="row"><button class="btn btn-s" type="button" id="waDraftBtn">Draft with Zen</button>' +
      '<span class="note">' + (left ? 'Reply window closes in ' + esc(left) : '') + '</span>' +
      '<button class="btn btn-p" type="button" id="waSendBtn">Send</button></div><div id="waSendNote" class="note" role="status"></div></div>'
    : '<div class="tfoot"><div class="closed"><b>The 24-hour reply window has closed</b>' + esc(channel) + ' only allows approved templates now, so a normal reply won\u2019t go through. To reach ' + esc(c.name) + ', include them in a campaign.</div>' +
      '<div class="row"><button class="btn btn-s" type="button" onclick="waTab(\'campaigns\')">See campaigns</button></div></div>';
  pane.innerHTML = '<div class="thead"><button class="btn btn-q back" type="button" aria-label="Back to conversations" onclick="el(\'waGrid\').classList.remove(\'open\');el(\'waInbox\').classList.remove(\'thread-open\')">\u2190</button>' +
    '<div><h2>' + esc(c.name) + '</h2><small>' + esc(c.handle) + ' · ' + channel + (c.from_ad ? ' · came from an ad' : '') + '</small></div></div>' +
    '<div class="tbody" id="waBody">' + (msgs || '<div class="empty">No messages to show.</div>') + '</div>' + foot;
  const body = el('waBody'); body.scrollTop = body.scrollHeight;
  if (!c.window_open) return;
  const box = el('waReply'); if (draft) box.value = draft;
  el('waDraftBtn').onclick = async () => {
    const b = el('waDraftBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Drafting…';
    const j = await zen('wa_draft_reply', { conversation_id: c.id }, 60000);
    b.disabled = false; b.textContent = 'Draft with Zen';
    if (!j.ok){ el('waSendNote').textContent = j.error; return; }
    box.value = j.draft; box.focus();
    el('waSendNote').textContent = 'Drafted from your business facts and prices. Check it, then send.';
  };
  el('waSendBtn').onclick = async () => {
    const text = box.value.trim();
    if (!text){ box.focus(); return; }
    const b = el('waSendBtn'); b.disabled = true; box.disabled = true; b.innerHTML = '<span class="spin"></span>Sending…';
    const j = await zen('wa_send_reply', { conversation_id: c.id, channel: c.channel, message: text }, 30000);
    b.disabled = false; box.disabled = false; b.textContent = 'Send';
    if (!j.ok){ el('waSendNote').textContent = j.error; return; }
    const step = ((j.cards || [])[0] || {}).steps ? j.cards[0].steps[0] : null;
    const status = step ? step.status : 'failed';
    if (status === 'failed'){ el('waSendNote').textContent = 'Not sent: ' + ((step && step.detail) || 'please try again.'); return; }
    box.value = '';
    const bubble = document.createElement('div');
    bubble.className = 'msg out' + (status === 'dry_run' ? ' pending' : '');
    bubble.innerHTML = esc(text) + '<div class="meta">' + (status === 'dry_run' ? 'Test mode: not actually sent' : 'Just now · You') + '</div>';
    el('waBody').appendChild(bubble); el('waBody').scrollTop = el('waBody').scrollHeight;
    el('waSendNote').textContent = status === 'dry_run' ? 'Test mode is on for this business, so nothing was sent. Zen recorded what would have gone out.' : 'Sent.';
    if (status === 'done') setTimeout(() => loadInbox(false), 1500);
  };
}

async function loadWaDetail(){

  const money = x => 'AED ' + n(Math.round(x || 0));
  let html = '';

  if (d.funnel){
    const f = d.funnel, max = Math.max(f.sent, 1);
    const row = (label, v, of, cls) => '<div class="frow"><span>' + label + '</span><div class="fbar"><i class="' + (cls||'') + '" style="width:' + Math.round(v / max * 100) + '%"></i></div>' +
      '<span class="fv"><b>' + n(v) + '</b>' + (of ? ' (' + Math.round(v / Math.max(of,1) * 100) + '%)' : '') + '</span></div>';
    html += '<div class="dsec"><h2>Messages in the last ' + d.days + ' days</h2><p class="lede">Every campaign message Zen sent, and how far it got.</p><div class="funnel">' +
      row('Sent', f.sent) + (d.receipts_available ? row('Delivered', f.delivered, f.sent) + row('Read', f.read, f.sent) : '') + row('Failed', f.failed, f.sent, 'bad') + '</div>' +
      (!d.receipts_available ? '<p class="note">Delivered and read counts only exist for messages sent after delivery receipts were switched on, so they\u2019re left out rather than shown as zero.</p>' : '') + '</div>';
  }
  if (d.daily.length){
    const days = d.daily.slice(-14), max = Math.max(...days.map(x => x.sent), 1);
    html += '<div class="dsec"><h2>Day by day</h2><p class="lede">Messages sent each day.</p><div class="days" role="img" aria-label="Messages sent per day">' +
      days.map(x => '<div class="day"><span class="n">' + n(x.sent) + '</span><div class="col" style="height:' + Math.max(2, Math.round(x.sent / max * 110)) + 'px"></div><small>' +
        esc(new Date(x.date + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' })) + '</small></div>').join('') + '</div></div>';
  }
  if (d.lift.length){
    html += '<div class="dsec"><h2>Did the messages cause the visits?</h2><p class="lede">Each campaign compared with a group Zen deliberately left out. Lift is only shown once both groups are big enough' +
      (d.min_group ? ' (' + d.min_group + ' people each)' : '') + ' to mean something.</p><div class="tw"><table class="dt"><thead><tr><th>Campaign</th><th>Messaged, came back</th><th>Held back, came back</th><th>Lift</th><th>Extra visits</th><th>Held back now</th></tr></thead><tbody>' +
      d.lift.map(c => '<tr><td><b>' + esc(c.name) + '</b></td><td>' + pct(c.contacted_rate) + '<small>' + c.contacted_returned + ' of ' + c.contacted + '</small></td>' +
        '<td>' + pct(c.held_back_rate) + '<small>' + c.held_back_returned + ' of ' + c.held_back + '</small></td>' +
        '<td>' + (c.readable && c.lift_points != null ? '<span class="' + (c.lift_points >= 0 ? 'good' : 'bad') + '">' + (c.lift_points > 0 ? '+' : '') + c.lift_points + ' pts</span>' : '<span class="quiet">Needs more data</span>') + '</td>' +
        '<td>' + (c.extra_visits != null ? n(c.extra_visits) : '\u2014') + '</td><td>' + n(c.holding_now) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  const sentG = d.groups.filter(g => g.outbound), inG = d.groups.filter(g => !g.outbound);
  const segText = g => g.segments.length ? '<small>' + g.segments.map(s => s.label + ' ' + pct(s.rate)).join(', ') + '</small>' : '';
  if (sentG.length){
    const tr = sentG.reduce((a,g) => a + g.revenue, 0), tc = sentG.reduce((a,g) => a + (g.cost || 0), 0);
    html += '<div class="dsec"><h2>What each campaign led to</h2><p class="lede">People messaged in the last 90 days and whether they visited within 30 days. Altogether ' + money(tr) + ' in visits for about ' + money(tc) + ' in message fees.</p>' +
      '<div class="tw"><table class="dt"><thead><tr><th>Campaign</th><th>Messaged</th><th>Came back</th><th>Days to return</th><th>Visit revenue</th><th>Message cost</th><th>Net</th></tr></thead><tbody>' +
      sentG.map(g => '<tr><td><b>' + esc(g.label) + '</b>' + segText(g) + '</td><td>' + n(g.people) + '</td><td>' + pct(g.came_back_rate) + (g.thin ? '<small>small group</small>' : '') + '</td>' +
        '<td>' + (g.median_days != null ? g.median_days + ' days' : '\u2014') + '</td><td>' + money(g.revenue) + '</td><td class="quiet">AED ' + (g.cost || 0).toFixed(2) + '</td>' +
        '<td class="' + (g.net >= 0 ? 'good' : 'bad') + '">' + money(g.net) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  if (inG.length){
    html += '<div class="dsec"><h2>People who messaged you first</h2><p class="lede">Enquiries that came to you, and whether they turned into a visit within 30 days.</p>' +
      '<div class="tw"><table class="dt"><thead><tr><th>Where from</th><th>People</th><th>Came in</th><th>Days to visit</th><th>Visit revenue</th></tr></thead><tbody>' +
      inG.map(g => '<tr><td><b>' + esc(g.label) + '</b>' + segText(g) + '</td><td>' + n(g.people) + '</td><td>' + pct(g.came_back_rate) + (g.thin ? '<small>small group</small>' : '') + '</td>' +
        '<td>' + (g.median_days != null ? g.median_days + ' days' : '\u2014') + '</td><td>' + money(g.revenue) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  if (d.delivery.length){
    html += '<div class="dsec"><h2>Delivery by campaign</h2><div class="tw"><table class="dt"><thead><tr><th>Campaign</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Failed</th></tr></thead><tbody>' +
      d.delivery.map(c => '<tr><td><b>' + esc(c.campaign) + '</b></td><td>' + n(c.sent) + '</td><td>' + (d.receipts_available ? pct(c.delivery_rate) : '\u2014') + '</td><td>' + (d.receipts_available ? pct(c.read_rate) : '\u2014') + '</td>' +
        '<td class="' + (c.failed ? 'bad' : '') + '">' + n(c.failed) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  if (d.failures.length){
    html += '<div class="dsec"><h2>Why messages failed</h2><div class="flist">' + d.failures.map(f => '<div><span>' + esc(f.reason) + '</span><b>' + n(f.count) + '</b></div>').join('') + '</div></div>';
  }
  const notes = [];
  if (d.replies && (d.replies.sent || d.replies.failed)) notes.push(n(d.replies.sent) + ' replies were sent by hand from the inbox' + (d.replies.failed ? ', and ' + n(d.replies.failed) + ' failed' : '') + '. They aren\u2019t counted as campaigns above.');
  if (d.caveat) notes.push(d.caveat);
  if (notes.length) html += '<div class="dsec">' + notes.map(t => '<p class="note">' + esc(t) + '</p>').join('') + '</div>';
  box.innerHTML = html || '<div class="empty">No detailed results yet.</div>';
}


// =====================================================================
// Gallery
// =====================================================================
const GAL = { items: null, filter: 'all', when: 'all', q: '', select: false, sel: new Set(), armed: false };
// What can be deleted: anything from Create, and ZenPro items that aren't approved, scheduled or posted yet.
const galKey = it => it.source + ':' + it.id;
const galDeletable = it => it.source === 'studio' || ['draft', 'creative_ready', 'planned'].includes(it.status);
el('galSelect').onclick = () => { GAL.select = !GAL.select; GAL.sel.clear(); GAL.armed = false; renderGallery(); };
const GAL_STATUS = { approved:'Ready to post', scheduled:'Scheduled', published:'Posted', creative_ready:'Waiting for review', planned:'Planned', draft:'Draft',
  made:'Made in Create', uploaded:'Uploaded', reference:'Reference' };
// What: everything in one place, old ZenPro content and images from Create.
const GAL_FILTERS = [
  ['all', 'All', () => true],
  ['made', 'Made in Create', it => it.status === 'made'],
  ['reference', 'References', it => it.status === 'reference'],
  ['ready', 'Ready to post', it => it.status === 'approved'],
  ['scheduled', 'Scheduled', it => it.status === 'scheduled'],
  ['posted', 'Posted', it => it.status === 'published'],
  ['draft', 'Drafts', it => it.status === 'draft' || it.status === 'creative_ready' || it.status === 'planned'],
  ['review', 'Waiting for your OK', it => it.status === 'creative_ready'],
  ['video', 'Videos', it => it.kind === 'video'],
];
// When: by the day it was made, in your own time zone.
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const GAL_WHEN = [
  ['all', 'All time', () => true],
  ['today', 'Today', it => it.created_at && new Date(it.created_at) >= startOfDay(new Date())],
  ['week', 'Last 7 days', it => it.created_at && new Date(it.created_at) >= startOfDay(Date.now() - 6 * 864e5)],
  ['month', 'This month', it => { if (!it.created_at) return false; const d = new Date(it.created_at), n = new Date(); return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth(); }],
];
el('galSearch').addEventListener('input', e => { GAL.q = e.target.value.trim().toLowerCase(); renderGallery(); });

// The selection bar: how many are chosen, select all shown, and a two-tap Delete.
function galBar(msg){
  const bar = el('galBar');
  el('galSelect').textContent = GAL.select ? 'Done' : 'Select';
  if (!GAL.select){ bar.hidden = true; return; }
  bar.hidden = false;
  const n = GAL.sel.size, can = (GAL.shown || []).filter(galDeletable);
  bar.innerHTML = '<span class="seln">' + (n ? '<b>' + n + '</b> selected' : 'Tap images to select them') + '</span>' +
    (can.length && n < can.length ? '<button class="btn btn-q" type="button" id="galAll">Select all shown (' + can.length + ')</button>' : '') +
    (n ? '<button class="btn btn-q" type="button" id="galNone">Clear</button>' : '') +
    '<button class="btn btn-del' + (GAL.armed ? ' armed' : '') + '" type="button" id="galDel"' + (n ? '' : ' disabled') + '>' + (GAL.armed ? 'Delete ' + n + ' for good?' : 'Delete') + '</button>' +
    '<button class="btn btn-q" type="button" id="galCancel">Cancel</button>' +
    (msg ? '<span class="selmsg" role="status">' + esc(msg) + '</span>' : '');
  if (el('galAll')) el('galAll').onclick = () => { can.forEach(it => GAL.sel.add(galKey(it))); GAL.armed = false; renderGallery(); };
  if (el('galNone')) el('galNone').onclick = () => { GAL.sel.clear(); GAL.armed = false; renderGallery(); };
  el('galCancel').onclick = () => { GAL.select = false; GAL.sel.clear(); GAL.armed = false; renderGallery(); };
  el('galDel').onclick = async () => {
    if (!GAL.armed){ GAL.armed = true; galBar(); setTimeout(() => { if (GAL.armed){ GAL.armed = false; galBar(); } }, 6000); return; }
    GAL.armed = false;
    const picked = GAL.items.filter(it => GAL.sel.has(galKey(it)));
    el('galDel').disabled = true; el('galDel').innerHTML = '<span class="spin"></span>Deleting\u2026';
    const done = new Set(), problems = [];
    const fromCreate = picked.filter(it => it.source === 'studio');
    if (fromCreate.length){
      const j = await studio('delete_assets', { tenant_id: tenant, ids: fromCreate.map(it => it.id) }, 60000);
      if (j.ok) (j.deleted || []).forEach(id => done.add('studio:' + id)); else problems.push(j.error);
    }
    for (const it of picked.filter(it => it.source !== 'studio')){
      const j = await zen('gallery_delete', { source: it.source, id: it.id, url: it.url }, 30000);
      if (j.ok) done.add(galKey(it)); else problems.push(it.title + ': ' + j.error);
    }
    GAL.items = GAL.items.filter(it => !done.has(galKey(it)));
    GAL.sel = new Set([...GAL.sel].filter(k => !done.has(k)));
    if (!GAL.sel.size) GAL.select = !problems.length ? false : GAL.select;
    renderGallery();
    const msg = done.size + ' deleted.' + (problems.length ? ' ' + problems.length + ' couldn\u2019t be: ' + problems.join(' ') : '');
    if (GAL.select) galBar(msg); else { el('galBody').insertAdjacentHTML('afterbegin', '<p class="note saved" role="status">' + esc(msg) + '</p>'); }
  };
}

async function loadGallery(){
  el('galBody').innerHTML = '<div class="empty">Loading your library\u2026</div>';
  // Collect any images that finished after you left Create, so nothing made is ever missing here.
  const rec = await studio('recover', { tenant_id: tenant }, 120000);
  const [old, made] = await Promise.all([zen('gallery_list', {}, 30000), studio('list_assets', { tenant_id: tenant, limit: 200 }, 30000)]);
  if (!old.ok && !made.ok){ el('galBody').innerHTML = '<div class="empty">' + esc(old.error) + '</div>'; return; }
  const fromCreate = (made.ok && Array.isArray(made.assets) ? made.assets : []).filter(a => a.kind !== 'upload').map(a => ({
    source: 'studio', id: a.id, kind: a.media === 'video' ? 'video' : 'image', url: a.url, created_at: a.created_at, poster: a.poster_url || null,
    status: a.label === 'reference' ? 'reference' : a.kind === 'generated' ? 'made' : 'uploaded',
    title: a.brief || (a.media === 'video' ? 'Video made in Create' : a.kind === 'generated' ? 'Made in Create' : 'Uploaded image'), caption: null,
    prompt: a.prompt || null, prompt_by: a.prompt_by || null, model_label: a.model_label || null, size_key: a.size_key || null, credits: a.credits,
    width: a.width, height: a.height, asset: a,
  }));
  GAL.items = [...fromCreate, ...(old.ok && Array.isArray(old.items) ? old.items : [])].sort((x, y) => String(y.created_at || '').localeCompare(String(x.created_at || '')));
  GAL.note = !made.ok ? 'Images from Create couldn\u2019t be loaded just now.' : !old.ok ? 'Older ZenPro content couldn\u2019t be loaded just now.'
    : rec.ok && rec.recovered ? rec.recovered + ' image' + (rec.recovered === 1 ? '' : 's') + ' that finished after you left Create ' + (rec.recovered === 1 ? 'was' : 'were') + ' saved and added here.'
    : rec.ok && rec.still_running ? rec.still_running + ' image' + (rec.still_running === 1 ? ' is' : 's are') + ' still being made. They\u2019ll appear here when ready.' : '';
  renderGallery();
}
// ---------- Review: one item at a time ----------
const RV = { i: 0, done: 0 };
function renderReview(){
  const list = (GAL.items || []).filter(it => it.status === 'creative_ready'), box = el('galBody');
  if (RV.i >= list.length){
    box.innerHTML = '<div class="rv-done"><b>' + (RV.done ? 'All done. ' + RV.done + ' decided.' : 'Nothing waiting for your OK.') + '</b><span>Approved posts are in Studio \u2192 Library under \u201cReady to post\u201d. Zen will bring new ones here.</span>' +
      '<div class="actions"><button class="btn btn-s" type="button" onclick="go(\'home\')">Back to Home</button></div></div>';
    loadKpis(); return;
  }
  const it = list[RV.i];
  box.innerHTML = '<div class="rv"><div class="rv-h"><b>' + (RV.i + 1) + ' of ' + list.length + '</b><button class="btn btn-q" type="button" id="rvAll">Approve all ' + (list.length - RV.i) + '</button></div>' +
    '<div class="rv-card"><div class="rv-media">' + (it.kind === 'video' ? '<video src="' + esc(it.url) + '" controls playsinline></video>' : '<img src="' + esc(it.url) + '" alt="' + esc(it.title) + '">') + '</div>' +
    '<div class="rv-info"><h2>' + esc(it.title) + '</h2>' + (it.caption ? '<div class="capt">' + esc(it.caption) + '</div>' : '<p class="note">No caption yet: Zen writes one when you post it.</p>') +
    '<div class="rv-acts"><button class="btn btn-p" type="button" id="rvOk">Approve</button><button class="btn btn-s" type="button" id="rvPost">Post to Instagram</button>' +
    '<button class="btn btn-s" type="button" id="rvNo">Not this one</button><button class="btn btn-q" type="button" id="rvSkip">Skip for now</button></div>' +
    '<p class="note" id="rvNote" role="status">Approve marks it ready to post. Nothing is posted until you choose a time and approve the post.</p></div></div></div>';
  const decide = async (d) => { el('rvNote').innerHTML = '<span class="spin"></span>Saving\u2026'; const j = await zen('review_decide', { id: it.id, decision: d }, 20000);
    if (!j.ok){ el('rvNote').textContent = j.error; return; } it.status = d === 'approve' ? 'approved' : 'draft'; RV.done++; renderReview(); };
  el('rvOk').onclick = () => decide('approve');
  el('rvNo').onclick = () => decide('reject');
  el('rvSkip').onclick = () => { RV.i++; renderReview(); };
  el('rvPost').onclick = () => openIgComposer(it);
  el('rvAll').onclick = async () => { const b = el('rvAll'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Approving\u2026';
    for (const x of list.slice(RV.i)){ const j = await zen('review_decide', { id: x.id, decision: 'approve' }, 20000); if (j.ok){ x.status = 'approved'; RV.done++; } }
    renderReview(); };
}
function renderGallery(){
  if (document.body.classList.contains('review-mode')) return renderReview();
  if (!GAL.items) return;
  const whenFn = (GAL_WHEN.find(w => w[0] === GAL.when) || GAL_WHEN[0])[2];
  const inWhen = GAL.items.filter(whenFn);
  el('galWhen').innerHTML = '<span class="flabel">When</span>' + GAL_WHEN.map(([k, label, fn]) =>
    '<button class="filter" type="button" data-gw="' + k + '" aria-pressed="' + (GAL.when === k) + '">' + label + ' ' + GAL.items.filter(fn).length + '</button>').join('');
  el('galWhen').querySelectorAll('[data-gw]').forEach(b => b.onclick = () => { GAL.when = b.dataset.gw; renderGallery(); });
  const counts = Object.fromEntries(GAL_FILTERS.map(([k,,fn]) => [k, inWhen.filter(fn).length]));
  el('galFilters').innerHTML = '<span class="flabel">Show</span>' + GAL_FILTERS.filter(([k]) => k === 'all' || counts[k] || GAL.filter === k).map(([k, label]) =>
    '<button class="filter" type="button" data-gf="' + k + '" aria-pressed="' + (GAL.filter === k) + '">' + label + ' ' + counts[k] + '</button>').join('');
  el('galFilters').querySelectorAll('[data-gf]').forEach(b => b.onclick = () => { GAL.filter = b.dataset.gf; renderGallery(); });
  const fn = (GAL_FILTERS.find(f => f[0] === GAL.filter) || GAL_FILTERS[0])[2];
  const list = inWhen.filter(fn).filter(it => !GAL.q || (it.title + ' ' + (it.caption || '') + ' ' + (it.prompt || '')).toLowerCase().includes(GAL.q));
  const note = GAL.note ? '<p class="note">' + esc(GAL.note) + '</p>' : '';
  if (!GAL.items.length){ el('galBody').innerHTML = note + '<div class="empty">Nothing here yet. Images you make in Create, and content from ZenPro, appear here automatically. Photos you upload stay in Create, under Your photos.</div>'; return; }
  GAL.shown = list;
  if (!list.length){ el('galBody').innerHTML = note + '<div class="empty">Nothing matches that. Try another filter or search.</div>'; galBar(); return; }
  el('galBody').innerHTML = note + '<div class="grid">' + list.map(it =>
    '<button class="tile' + (GAL.select ? (galDeletable(it) ? ' selmode' + (GAL.sel.has(galKey(it)) ? ' picked' : '') : ' selmode locked') : '') + '" type="button" data-gi="' + esc(it.source + ':' + it.id) + '"' +
      (GAL.select ? ' aria-pressed="' + GAL.sel.has(galKey(it)) + '"' : '') + ' aria-label="' + esc(it.title + (it.created_at ? ', ' + new Date(it.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : '')) + '" title="' + esc(it.title) + '"><div class="media">' +
      (it.kind === 'video' ? (it.poster ? '<img src="' + esc(it.poster) + '" alt="" loading="lazy">' : '<video src="' + esc(it.url) + '#t=0.5" muted preload="metadata" playsinline></video>') + '<span class="play" aria-hidden="true">\u25B6</span>'
                           : '<img src="' + esc(it.url) + '" alt="" loading="lazy">') +
      '<span class="st ' + esc(it.status) + '">' + esc(GAL_STATUS[it.status] || it.status) + '</span>' + (GAL.select ? '<span class="tick" aria-hidden="true"></span>' : '') + '</div></button>').join('') + '</div>';
  el('galBody').querySelectorAll('[data-gi]').forEach(b => b.onclick = () => {
    const key = b.dataset.gi;
    if (GAL.select){
      const it = GAL.items.find(x => galKey(x) === key);
      if (!galDeletable(it)){ galBar('Approved, scheduled and posted items can\u2019t be deleted here, so nothing already planned breaks.'); return; }
      GAL.sel.has(key) ? GAL.sel.delete(key) : GAL.sel.add(key); GAL.armed = false; renderGallery(); return;
    }
    key.startsWith('studio:') ? openStudioViewer(key.slice(7)) : openViewer(key);
  });
  galBar();
}

// An image from Create: what made it, and what you can do with it next.
function openStudioViewer(id){
  const it = GAL.items.find(x => x.source === 'studio' && x.id === id); if (!it) return;
  const v = el('viewer');
  const used = [it.model_label, it.size_key ? it.size_key.charAt(0).toUpperCase() + it.size_key.slice(1) : '', it.credits != null ? it.credits + ' credits' : ''].filter(Boolean).join(' \u00B7 ');
  const isRef = it.status === 'reference', isVid = it.kind === 'video';
  v.innerHTML = '<button class="vclose" type="button" aria-label="Close" id="vClose">\u00D7</button><div class="vgrid"><div class="vmedia">' +
    (isVid ? '<video src="' + esc(it.url) + '" controls playsinline' + (it.poster ? ' poster="' + esc(it.poster) + '"' : '') + ' aria-label="' + esc(it.title) + '"></video>' : '<img src="' + esc(it.url) + '" alt="' + esc(it.title) + '">') + '</div>' +
    '<div class="vinfo"><span class="badge" style="align-self:flex-start;margin:0">' + esc(GAL_STATUS[it.status]) + '</span><h2>' + esc(it.title) + '</h2>' +
    '<div class="note">' + esc(it.created_at ? new Date(it.created_at).toLocaleString('en-GB', { day:'numeric', month:'long', year:'numeric', hour:'numeric', minute:'2-digit' }) : '') +
      (used ? '<br>' + esc(used) : '') + (it.width ? '<br>' + it.width + ' \u00D7 ' + it.height + ' px' : '') + '</div>' +
    (it.prompt ? '<details class="prompt" style="padding:0"><summary>Prompt' + (it.prompt_by ? ' <i>written by ' + esc(it.prompt_by) + '</i>' : '') + '</summary><pre>' + esc(it.prompt) + '</pre></details>' : '') +
    (isRef ? '<p class="note">A reference is inspiration only. It shapes new images and is never posted as it is.</p>' : '') +
    (isVid ? '<div class="actions"><a class="btn btn-p" href="' + esc(it.url) + '" download target="_blank" rel="noopener">Download</a></div><p class="note">Posting videos to Instagram and using them in ads comes next.</p>'
    : '<div class="actions">' + (isRef ? '' : '<button class="btn btn-p" type="button" id="svAd">Promote as an ad</button><button class="btn btn-s" type="button" id="svVid">Make it a video</button><button class="btn btn-s" type="button" id="svUse">Use in Create</button>') +
      '<button class="btn btn-s" type="button" id="svInsp">Use as inspiration</button>' +
      '<a class="btn btn-q" href="' + esc(it.url) + '" target="_blank" rel="noopener">Full size</a></div>' +
    '<button class="btn btn-q" type="button" id="svLabel" style="align-self:flex-start">' + (isRef ? 'Make it a creative (mine to post)' : 'Make it a reference (inspiration only)') + '</button>') +
    '<p class="note" id="svNote" role="status"></p>' +
    '<p class="note">Posting images made in Create to Instagram comes next.</p>' +
    '<div class="vdel"><button class="btn btn-del" type="button" id="svDel">Delete</button></div></div></div>';
  v.showModal();
  el('vClose').onclick = () => v.close(); v.onclick = e => { if (e.target === v) v.close(); };

function openViewer(key){
  const it = GAL.items.find(x => x.source + ':' + x.id === key);
  if (!it) return;
  const v = el('viewer');
  const when = it.scheduled_date ? new Date(it.scheduled_date).toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) : '';
  let acts = '';
  if (it.status === 'approved') acts =
    '<div class="actions" id="vActs"><button class="btn btn-p" type="button" id="vPostNow">Post now</button><button class="btn btn-s" type="button" id="vSchedBtn">Schedule\u2026</button></div>' +
    '<div class="vwhen" id="vWhen" hidden><label class="sr" for="vWhenInput">When to post</label><input type="datetime-local" id="vWhenInput"><button class="btn btn-p" type="button" id="vSchedGo">Plan it</button></div>';
  else if (it.status === 'scheduled') acts = '<p class="note">Scheduled for <b>' + esc(when) + '</b>.</p>';
  else if (it.status === 'published') acts = '<p class="note">Posted. Boosting a post comes with the Marketing area.</p>';
  else acts = '<p class="note">' + (it.status === 'draft' ? 'Not part of a post yet.' : 'Not approved for posting yet.') + ' Zen can write a caption and post it for you.</p>' +
    '<div class="actions"><button class="btn btn-p" type="button" id="vToIg">Post to Instagram</button></div>';
  v.innerHTML = '<button class="vclose" type="button" aria-label="Close" id="vClose">\u00D7</button><div class="vgrid"><div class="vmedia">' +
    (it.kind === 'video' ? '<video src="' + esc(it.url) + '" controls playsinline></video>' : '<img src="' + esc(it.url) + '" alt="' + esc(it.title) + '">') +
    '</div><div class="vinfo"><span class="badge" style="align-self:flex-start;margin:0">' + esc(GAL_STATUS[it.status] || it.status) + '</span><h2>' + esc(it.title) + '</h2>' +
    (it.caption ? '<div class="capt">' + esc(it.caption) + '</div>' : '') +
    '<div class="note">' + esc(it.created_at ? 'Made ' + new Date(it.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) : '') + '</div>' +
    acts + '<a class="note" href="' + esc(it.url) + '" target="_blank" rel="noopener">Open full size</a><div id="vPlan"></div>' +
    (['draft','creative_ready','planned'].includes(it.status)
      ? '<div class="vdel"><button class="btn btn-del" type="button" id="vDel">Delete</button><span class="note" id="vDelNote" role="status"></span></div>'
      : '<p class="note vdel">' + (it.status === 'published' ? 'Posted items can\u2019t be deleted here. Deleting wouldn\u2019t remove the post from Instagram.' : 'Approved and scheduled items can\u2019t be deleted here, so nothing already planned breaks.') + '</p>') +
    '</div></div>';
  v.showModal();
  el('vClose').onclick = () => v.close();
  v.onclick = e => { if (e.target === v) v.close(); };
  v.onclose = () => { if (v.dataset.changed){ delete v.dataset.changed; loadGallery(); } };
  if (el('vToIg')) el('vToIg').onclick = () => { v.close(); openIgComposer(it); };
  if (el('vDel')){
    let armed = false, timer = null;
    el('vDel').onclick = async () => {
      const b = el('vDel');
      if (!armed){ armed = true; b.classList.add('armed'); b.textContent = 'Tap again to delete for good'; timer = setTimeout(() => { armed = false; b.classList.remove('armed'); b.textContent = 'Delete'; }, 5000); return; }
      clearTimeout(timer); b.disabled = true; b.innerHTML = '<span class="spin"></span>Deleting\u2026';
      const j = await zen('gallery_delete', { source: it.source, id: it.id, url: it.url }, 30000);
      if (!j.ok){ b.disabled = false; armed = false; b.classList.remove('armed'); b.textContent = 'Delete'; el('vDelNote').textContent = j.error; return; }
      GAL.items = GAL.items.filter(x => !(x.source === it.source && x.id === it.id));
      delete v.dataset.changed; v.close(); renderGallery();
    };
  }
  if (it.status !== 'approved') return;
  const plan = async (whenIso) => {
    el('vPlan').innerHTML = '<div class="thinking"><span class="pulse"></span><span>Preparing the plan</span></div>';
    const j = await zen('gallery_plan_publish', { id: it.id, title: it.title, when: whenIso || undefined }, 30000);
    el('vPlan').innerHTML = '';
    if (!j.ok){ el('vPlan').appendChild(errorCard(j.error)); return; }
    (j.cards || []).forEach(c => el('vPlan').appendChild(renderCard(c)));
    v.dataset.changed = '1';
    // One plan per visit: hide the buttons so a second plan can't be made by accident.
    el('vActs').hidden = true; el('vWhen').hidden = true;
  };
  el('vPostNow').onclick = () => plan(null);
  el('vSchedBtn').onclick = () => { el('vWhen').hidden = false; const d = new Date(Date.now() + 3600000); d.setMinutes(0 - d.getTimezoneOffset(), 0, 0); el('vWhenInput').value = d.toISOString().slice(0,16); el('vWhenInput').focus(); };
  el('vSchedGo').onclick = () => { const raw = el('vWhenInput').value; if (!raw) return; plan(new Date(raw).toISOString()); };
}

const FACT_CATS = [['prices','Prices'],['hours','Opening hours'],['services','Services'],['booking','Booking'],['location','Location'],['general','General']];
let BRAND = null;

async function loadBrand(){
  const box = el('brand');
  box.innerHTML = '<div class="empty">Gathering what Zen knows…</div>';

}
function renderBrand(){
  const b = BRAND, name = b.name || tenantName;
  const kv = [['Looks', b.look], ['Personality', b.personality], ['Tone', b.tone]].filter(x => x[1]);
  const catLabel = k => (FACT_CATS.find(c => c[0] === k) || [k, k])[1];
  const factRow = f => '<div class="fr" data-fact="' + esc(f.id) + '"><div class="txt"><div class="q">' + esc(f.question) + '</div><div class="a">' + esc(f.answer) + '</div><div class="tags">' +
      '<span class="t">' + esc(catLabel(f.category)) + '</span>' + (f.placeholder ? '<span class="t t-alert">Still a placeholder</span>' : '') +
      (f.auto_send_ok ? '<span class="t t-book">Zen may send this on its own</span>' : '') + '</div></div>' +
    '<div class="acts"><button class="btn btn-q" type="button" data-fedit="' + esc(f.id) + '">Edit</button><button class="btn btn-q" type="button" data-fdel="' + esc(f.id) + '">Remove</button></div></div>';
  el('brand').innerHTML =
    '<div class="page-top"><h1>Brand</h1></div>' +
    '<div class="hero"><div class="logo">' + (b.logo_url ? '<img src="' + esc(b.logo_url) + '" alt="' + esc(name) + ' logo">' : 'No logo yet') + '</div><div>' +
      '<h2>Here\u2019s what Zen knows about ' + esc(name) + '</h2>' +
      (b.colors.length ? '<div class="swatches">' + b.colors.map(c => '<span class="sw"><i style="background:' + esc(c) + '"></i>' + esc(c.toUpperCase()) + '</span>').join('') + '</div>' : '') +
      (kv.length ? '<dl class="kv2">' + kv.map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>' : '<p class="note">No brand description yet.</p>') +
    '</div></div>' +
    (b.gaps.length ? '<div class="gaps"><b>Fill these in and Zen gets better</b><ul>' + b.gaps.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div>' : '') +

    '<div id="hoursSec"></div><div id="briefSec"></div>' +
    '<div class="sec"><div class="sec-head"><div><h2>What Zen tells customers</h2><p>WhatsApp drafts and automatic replies quote only from these answers. Keep prices and hours current.</p></div>' +
      '<button class="btn btn-s" type="button" id="factAddBtn">Add an answer</button></div><div id="factForm"></div>' +
      '<div class="rows" id="factRows">' + (b.facts.length ? b.facts.map(factRow).join('') : '<div class="fr"><div class="txt quiet">No answers yet. Until you add some, Zen can only greet customers.</div></div>') + '</div></div>' +

    '<div class="sec"><div class="sec-head"><div><h2>Brand rules</h2><p>' + (b.dna_approved ? 'Checked every time Zen makes an image or video.' : 'Not set up yet. Your brand profile is created and approved in ZenPro.') + '</p></div></div>' +
      (b.rules.length ? '<div class="rows">' + b.rules.map(r => '<div class="fr"><div class="txt"><div class="q">' + esc(r.label.charAt(0).toUpperCase() + r.label.slice(1)) + '</div><div class="a">' + esc(r.value) + '</div></div>' +
        '<span class="t ' + (r.never ? 't-alert' : 't-book') + '">' + (r.never ? 'Never' : 'Always') + '</span></div>').join('') + '</div>' : '') + '</div>' +

    '<div class="sec"><div class="sec-head"><div><h2>Services and prices</h2><p>What Zen can quote when customers ask.</p></div><a class="btn btn-q" href="' + ZENPRO_URL + '" target="_blank" rel="noopener">Edit in ZenPro</a></div>' +
      '<div class="rows">' + (b.services.length ? b.services.map(x => '<div class="fr"><div class="txt"><div class="q">' + esc(x.name) + '</div>' + (x.description ? '<div class="a">' + esc(x.description) + '</div>' : '') + '</div>' +
        '<span class="' + (x.price ? '' : 'quiet') + '">' + (x.price ? 'AED ' + esc(String(x.price).replace(/^AED\s*/i, '')) : 'No price') + '</span></div>').join('') : '<div class="fr"><div class="txt quiet">No services yet.</div></div>') + '</div></div>' +

    (b.products.length ? '<div class="sec"><div class="sec-head"><div><h2>Products</h2></div></div><div class="prods">' + b.products.map(x =>
      '<div class="prod">' + (x.image_url ? '<img src="' + esc(x.image_url) + '" alt="" loading="lazy">' : '<img alt="">') + '<div><b>' + esc(x.name) + '</b>' + (x.price ? esc(x.price) : '') + '</div></div>').join('') + '</div></div>' : '');

  loadHours(); loadBrief();

      x.disabled = true;

      if (!j.ok){ x.disabled = false; x.textContent = j.error; return; }

function factForm(f){
  const box = el('factForm');
  box.innerHTML = '<div class="form"><label for="ffQ" class="note">What customers ask, in their words</label><input id="ffQ" placeholder="How much for a 4-year-old?" value="' + esc(f ? f.question : '') + '">' +
    '<label for="ffA" class="note">Your answer</label><textarea id="ffA" rows="3" placeholder="AED 75 per child, including a wash.">' + esc(f ? f.answer : '') + '</textarea>' +
    '<div class="row"><label for="ffC" class="sr">Topic</label><select id="ffC">' + FACT_CATS.map(([k, l]) => '<option value="' + k + '"' + (f && f.category === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
    '<button class="btn btn-p" type="button" id="ffSave">' + (f ? 'Save changes' : 'Add answer') + '</button><button class="btn btn-q" type="button" id="ffCancel">Cancel</button><span class="note" id="ffMsg" role="status"></span></div></div>';
  el('ffQ').focus();
  el('ffCancel').onclick = () => { box.innerHTML = ''; };
  el('ffSave').onclick = async () => {
    const args = { question: el('ffQ').value.trim(), answer: el('ffA').value.trim(), category: el('ffC').value };
    if (!args.question || !args.answer){ el('ffMsg').textContent = 'Add both the question and the answer.'; return; }
    if (f){ args.id = f.id; args.auto_send_ok = f.auto_send_ok; }   // keep its existing "send on its own" setting
    el('ffSave').disabled = true;
    const j = await zen('brand_save_fact', args, 20000);
    el('ffSave').disabled = false;
    if (!j.ok){ el('ffMsg').textContent = j.error; return; }
    box.innerHTML = ''; loadBrand();
  };
}

async function adAction(b){
  const card = b.closest('[data-ad]'), x = MKT.ads.ad_sets.find(a => a.id === card.dataset.ad), slot = card.querySelector('.slot');
  const kind = b.dataset.adact;

// Best route: start from a picture (your photo, the Library, or a result just made), so the look is fixed
// before paying for motion. Without one, Zen makes the first frame first; or skip it for a loose clip.
const V_QUALITY = { '720p': 'Standard', '1080p': 'High' };
const crVModel = () => (CR.vModels || []).find(m => m.key === CR.vKey);
function crVPlan(){
  const m = crVModel(); if (!m) return null;
  const res = m.resolutions.includes(CR.vRes) ? CR.vRes : m.resolutions[0];
  let secs = m.durations.includes(CR.vSecs) ? CR.vSecs : m.default_duration;
  if (m.hd_needs_longest && res !== m.resolutions[0]) secs = Math.max(...m.durations);
  const sound = m.sound === 'always' ? true : CR.vSound !== false;
  const aspect = m.aspects.includes(CR.aspect) ? CR.aspect : m.aspects[0];
  return { m, res, secs, sound, aspect, credits: m.credits[res + '|' + secs + '|' + (sound ? 1 : 0)] };
}
// Step 1 without a picture: an image in the video's shape, which the owner checks, then animates.
function crFirstFrame(){
  const t = (CR.text || '').trim();
  if (!t && !CR.insp){ crStatus('Say what the video should show, or choose an inspiration or a photo.', true); el('crText').focus(); return; }
  const p = crVPlan(); const shape = p ? p.aspect : '9:16';
  crStatus('Step 1 of 2: the first frame. When it looks right, press \u201cMake a video\u201d on it.');
  crCreate({ text: t, aspect: shape, noText: true });
}
async function crMakeVideo(){
  const p = crVPlan(); if (!p) return;
  const text = (CR.text || '').trim();
  const fromVersion = CR.vSrc && CR.vSrc.version_id || null, fromAsset = CR.vSrc && CR.vSrc.asset_id || (CR.image ? CR.image.id : null);
  if (!fromVersion && !fromAsset && !text){ crStatus('Say what the video should show, or choose a photo to start from.', true); el('crText').focus(); return; }
  CR.busy = true; crStatus(''); renderCreate();
  const body = { tenant_id: tenant, session_id: CR.session, text, model_key: p.m.key, seconds: p.secs, resolution: p.res, aspect_ratio: p.aspect, sound: p.sound,
    from_asset_id: fromVersion ? null : fromAsset, from_version_id: fromVersion };
  const visit = CR.visit;
  const j = await studio('make_video', body, 120000);
  if (CR.visit !== visit) return;
  CR.busy = false;
  if (!j.ok){ renderCreate(); crStatus(j.error, true); return; }
  CR.session = j.session_id; CR.text = '';
  CR.versions.unshift(j.version); renderCreate(); crShowNewest();
  crStatus('Making your video. Usually 1\u20133 minutes; you can leave and it\u2019ll be saved to your Library.');
  if (j.version.status !== 'failed') crPoll(j.version.id);
}

// One press of Generate (or "Change it", or "Generate with this prompt").
async function crCreate(extra){
  const m = crModel(); if (!m || !m.available){ crStatus('No image model is available right now. Ask your Zen admin to set one up.', true); return; }
  const text = extra.text != null ? extra.text : (CR.text || '').trim();
  if (!text && !CR.image && !CR.insp && !extra.prompt){ crStatus('Describe what you want, or add an image.', true); el('crText').focus(); return; }
  // 'Zen designs the text' never needs words; anything typed must appear exactly.
  CR.busy = true; crStatus(''); renderCreate();
  const body = {
    tenant_id: tenant, session_id: CR.session, text, aspect_ratio: extra.aspect || CR.aspect, use: [CR.use], model_key: CR.modelKey, size_key: CR.sizeKey,
    use_brand: !!CR.useBrand, brand: CR.useBrand ? CR.brand : undefined,
    image_asset_id: extra.parent_version_id ? null : (CR.image ? CR.image.id : null),
    inspiration: extra.parent_version_id ? null : CR.insp ? (CR.insp.type === 'concept' ? { concept_name: CR.insp.concept_name } : { asset_id: CR.insp.asset_id }) : null,
    parent_version_id: extra.parent_version_id || null, prompt: extra.prompt || undefined,
    text_on_image: extra.parent_version_id ? undefined : { mode: extra.noText || CR.textMode === 'none' ? 'none' : 'ad', words: (CR.hookWords || '').trim(), purpose: purposeOf()[1], business: tenantName },
  };
  const visit = CR.visit;
  const j = await studio('create', body, 120000);
  if (CR.visit !== visit) return;                            // you've started afresh since; the image will be in your Library
  CR.busy = false;
  if (!j.ok){ renderCreate(); crStatus(j.error, true); return; }
  CR.session = j.session_id; if (!extra.parent_version_id) CR.text = '';
  CR.versions.unshift(j.version); renderCreate(); crShowNewest();
  if (j.version.status !== 'failed') crPoll(j.version.id);
}

function crPoll(id, tries){
  tries = tries || 0;
  const pv = CR.versions.find(x => x.id === id);
  if (tries > (pv && pv.media === 'video' ? 220 : 120)) return;   // about 6 minutes for images, 11 for videos
  CR.timers[id] = setTimeout(async () => {
    const j = await studio('version_status', { tenant_id: tenant, version_id: id }, 90000);
    if (!el('crResults')) return;                              // left the page
    if (j.ok){
      const i = CR.versions.findIndex(v => v.id === id); if (i >= 0) CR.versions[i] = j.version;
      const stay = CR.follow || crNearBottom();
      renderCreateResults();
      if (stay && (j.version.status === 'succeeded' || j.version.status === 'failed')){
        const img = document.querySelector('#crResults .crcard:last-child img');
        // the stage is already in view
        CR.follow = false;                                     // shown; if you scroll up later, Zen won't pull you back down
      }
      if (j.version.status === 'succeeded'){ crShowUsage(); return; }
      if (j.version.status === 'failed') return;
    }
    crPoll(id, tries + 1);
  }, tries ? 3000 : 2000);
}

async function crUpload(file, label){
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)){ crStatus('Use a PNG, JPG or WebP image.', true); return; }
  if (file.size > 20 * 1024 * 1024){ crStatus('That image is over 20 MB. Use a smaller one.', true); return; }
  crStatus('Uploading\u2026');
  const dims = await new Promise(res => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res({}); i.src = URL.createObjectURL(file); });
  // mw-studio checks you belong to this business, then gives a one-time link for this one file.
  const visit = CR.visit;
  const st = await studio('upload_start', { tenant_id: tenant, label, content_type: file.type, width: dims.w, height: dims.h, bytes: file.size }, 20000);
  if (!st.ok){ crStatus(st.error, true); return; }
  const { error } = await sb.storage.from('studio-assets').uploadToSignedUrl(st.path, st.token, file, { contentType: file.type });
  if (error){ crStatus('Upload failed: ' + error.message, true); return; }
  const j = await studio('upload_done', { tenant_id: tenant, asset_id: st.asset_id, bytes: file.size }, 20000);
  if (!j.ok){ crStatus(j.error, true); return; }
  if (CR.visit !== visit) return;                            // you've started afresh since; the upload is in your Library
  if (label === 'reference') CR.insp = { type:'asset', asset_id: j.asset.id, name: 'Your reference', url: j.asset.url, asset: j.asset };
  else { CR.image = j.asset; CR.vSrc = null; }
  crStatus(j.asset.keep ? '' : 'Tick \u201cKeep for next time\u201d to save it. Otherwise it\u2019s removed in 30 days.'); renderCreate();
}

    el('pkBody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {

        const a = items[+b.dataset.rm]; b.disabled = true;

        if (CR.insp && CR.insp.asset_id === a.id) CR.insp = null;
        draw(); renderCreate();
      };

    '<dialog class="viewer" id="insDetail" aria-label="Idea"></dialog><dialog class="viewer" id="insFilter" aria-label="Filter"></dialog>';
  el('insQ').addEventListener('search', () => { if (!el('insQ').value.trim()) insClearAll(); });

function insActiveCount(){ return GROUPS.reduce((n, [k]) => n + INS.f[k].length, 0) + (INS.bundle ? 1 : 0) + (INS.trending ? 1 : 0) + INS.keywords.length; }

// OR within a group, AND across groups. "General / Cross Industry" ideas match any industry.
function insMatches(c, skipGroup){
  for (const [k] of GROUPS){
    if (k === skipGroup || !INS.f[k].length) continue;
    const have = c[k] || [];
    const ok = INS.f[k].some(v => have.includes(v)) || (k === 'industries' && have.includes(GENERAL));
    if (!ok) return false;
  }
  if (INS.bundle && skipGroup !== 'bundle' && c.primaryBundle !== INS.bundle) return false;
  if (INS.trending && !(c.trendTags || []).length) return false;
  if (INS.keywords.length && !insFiltersOn() && insKeywordHits(c) === 0) return false;   // words alone: at least one must match
  return true;
}
function insFiltersOn(){ return GROUPS.some(([k]) => INS.f[k].length) || INS.bundle || INS.trending; }
function insHay(c){ return [c.displayName, c.conceptName, c.primaryBundle, c.shortDescription, ...(c.goals||[]), ...(c.industries||[]), ...(c.businessTypes||[]), ...(c.subjectTypes||[]), ...(c.serviceTypes||[]), ...(c.styles||[]), ...(c.formats||[]), ...(c.moods||[]), ...(c.trendTags||[]), ...(c.bestFor||[])].join(' ').toLowerCase(); }
function insKeywordHits(c){ const h = insHay(c); return INS.keywords.filter(w => h.includes(w) || (w.endsWith('s') && h.includes(w.slice(0, -1)))).length; }
// Ranking: ideas most specifically about what you chose come first (the share of each idea's
// tags that you picked, weighted goal > product/service > style > industry), then word matches,
// then the library's own order. General-purpose ideas still show, just after the specific ones.
const FOCUS_W = { goals: 5, subjectTypes: 4, serviceTypes: 4, styles: 3, moods: 3, industries: 2, businessTypes: 1, formats: 1 };
function insScore(c){
  let s = insKeywordHits(c) * 3;
  for (const [k] of GROUPS){
    if (!INS.f[k].length) continue;
    const tags = (c[k] || []).filter(t => t !== GENERAL);
    if (tags.length) s += FOCUS_W[k] * INS.f[k].filter(v => tags.includes(v)).length / tags.length;
  }
  return s;
}

function insRender(){
  if (!el('insQuick')) return;                               // AI Inspiration isn't on screen any more
  // quick chips
  el('insQuick').innerHTML = QUICK.map(([label, q], i) => {
    const k0 = Object.keys(q)[0];
    const on = INS.quick === i && (q.trending ? INS.trending : q.bundle ? INS.bundle === q.bundle : INS.f[k0].includes(q[k0]));
    return '<button class="filter" type="button" data-q="' + i + '" aria-pressed="' + on + '">' + esc(label) + '</button>';
  }).join('');
  // Quick chips are one at a time: tapping another switches to it; tapping the same one turns it off.
  el('insQuick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const i = +b.dataset.q, undo = q => { if (!q) return; if (q.trending) INS.trending = false; else if (q.bundle) INS.bundle = null; else { const k = Object.keys(q)[0]; INS.f[k] = INS.f[k].filter(x => x !== q[k]); } };
    const prev = INS.quick != null ? QUICK[INS.quick][1] : null;
    undo(prev);
    if (INS.quick === i){ INS.quick = null; }
    else {
      const q = QUICK[i][1]; INS.quick = i;
      if (q.trending) INS.trending = true; else if (q.bundle) INS.bundle = q.bundle; else { const k = Object.keys(q)[0]; INS.f[k] = [q[k]]; }
    }

  });
  // filter bar: the type group follows the business type
  const bt = INS.f.businessTypes, showSvc = bt.includes('Service'), showProd = bt.includes('Product') || (!showSvc && bt.length > 0);
  const bar = [['goals'], ['industries'], ['businessTypes'], ...(showProd ? [['subjectTypes']] : []), ...(showSvc ? [['serviceTypes']] : []), ['moods'], ['styles'], ['formats']];
  el('insBar').innerHTML = '<span class="note">Filter</span>' + bar.map(([k]) => '<button class="fbtn" type="button" data-fg="' + k + '">' + GROUP_LABEL[k] +

  for (const [k, label] of GROUPS) INS.f[k].forEach(v => chips.push('<button class="achip" type="button" data-rm="' + k + '|' + esc(v) + '">' + label + ': ' + esc(v) + ' <span aria-hidden="true">\u00D7</span></button>'));

  if (INS.trending) chips.push('<button class="achip" type="button" data-rm="trending|">Trending <span aria-hidden="true">\u00D7</span></button>');

  el('insActive').innerHTML = insActiveCount() ? '<div class="achips">' + chips.join('') + '<button class="btn btn-q" type="button" id="insClear">Clear filters</button></div>' : '';
  el('insActive').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const [k, v] = b.dataset.rm.split('|');
    if (k === 'bundle') INS.bundle = null; else if (k === 'trending') INS.trending = false;
    else if (k === 'kw') INS.keywords = INS.keywords.filter(x => x !== v);
    else { INS.f[k] = INS.f[k].filter(x => x !== v); if (k === 'businessTypes'){ if (v === 'Service') INS.f.serviceTypes = []; if (v === 'Product') INS.f.subjectTypes = []; } }
    INS.summary = ''; insRender();
  });
  if (el('insClear')) el('insClear').onclick = insClearAll;
  insResults();
}

function insOptions(k){

// "More like this": how much two ideas share in each group (overlap, not raw counts, so ideas
// with long tag lists don't win by default), weighted goal > product > style > trend > industry,
// plus the same creative type.
function insSimilar(c){
  const W = [['goals', 5], ['subjectTypes', 4], ['styles', 3], ['trendTags', 2], ['industries', 2]];
  const overlap = (a, b) => { a = new Set((a || []).filter(v => v !== GENERAL)); b = new Set((b || []).filter(v => v !== GENERAL));
    const inter = [...a].filter(v => b.has(v)).length, uni = new Set([...a, ...b]).size; return uni ? inter / uni : 0; };
  return INS.concepts.filter(x => x.conceptName !== c.conceptName).map(x => {
    let s = 0;
    for (const [k, w] of W) s += w * overlap(x[k], c[k]);
    if (x.primaryBundle === c.primaryBundle) s += 1;
    return [x, s];
  }).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([x]) => x);
}

async function saveSetting(args, note){

  if (note){ note.textContent = j.ok ? 'Saved' : j.error; note.className = j.ok ? 'note saved' : 'note'; setTimeout(() => { if (note.textContent === 'Saved') note.textContent = ''; }, 2500); }

// A switch; turning ON something that acts without asking needs a second tap.
function wireSwitch(btn, confirmOn, onChange){
  let armed = false, timer = null;
  btn.onclick = async () => {
    const turningOn = btn.getAttribute('aria-checked') !== 'true';
    if (turningOn && confirmOn && !armed){
      armed = true; btn.classList.add('armed'); btn.title = 'Tap again to switch on';
      const hint = btn.parentElement.querySelector('.armhint'); if (hint) hint.textContent = confirmOn;
      timer = setTimeout(() => { armed = false; btn.classList.remove('armed'); if (hint) hint.textContent = ''; }, 5000);
      return;
    }
    clearTimeout(timer); armed = false; btn.classList.remove('armed');
    const hint = btn.parentElement.querySelector('.armhint'); if (hint) hint.textContent = '';
    btn.disabled = true;
    const ok = await onChange(turningOn);
    btn.disabled = false;
    if (ok) btn.setAttribute('aria-checked', String(turningOn));
  };
}

  const h = j.health, word = { pass:'OK', warn:'Check', fail:'Problem' };

  };
}

      () => { geo.disabled = false; geo.textContent = 'Use this device\u2019s location'; err('Location wasn\u2019t shared. Paste the coordinates instead.'); },

    const value = typed.length ? picked.filter(x => !/^nothing/i.test(x)).concat(typed) : picked;

function answerTable(t){

}
// A simple chart, only when the answer includes one (a trend that was asked for).
function answerChart(ch){
  const W = 560, H = 190, padL = 56, padR = 28, padT = 14, padB = 28;
  const vals = ch.values.map(Number), max = Math.max(1, ...vals), min = ch.kind === 'bar' ? 0 : Math.min(...vals);
  const lo = ch.kind === 'bar' ? 0 : Math.max(0, min - (max - min) * 0.15), span = Math.max(1, max - lo);
  const x = i => padL + (vals.length === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (vals.length - (ch.kind === 'bar' ? 0 : 1)));
  const yv = v => padT + (H - padT - padB) * (1 - (v - lo) / span);
  const fmt = v => v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : String(Math.round(v));
  const ticks = [lo, lo + span / 2, max].map(v => '<g><line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yv(v) + '" y2="' + yv(v) + '" class="cg"/><text x="' + (padL - 6) + '" y="' + (yv(v) + 4) + '" class="cy">' + fmt(v) + '</text></g>').join('');
  let marks = '';
  if (ch.kind === 'bar'){
    const bw = (W - padL - padR) / vals.length * 0.62;
    marks = vals.map((v, i) => { const cx = padL + (i + 0.5) * (W - padL - padR) / vals.length; return '<rect x="' + (cx - bw / 2) + '" y="' + yv(v) + '" width="' + bw + '" height="' + (H - padB - yv(v)) + '" rx="3" class="cb"><title>' + esc(ch.labels[i]) + ': ' + esc(ch.unit) + ' ' + v.toLocaleString('en-US') + '</title></rect>' +
      '<text x="' + cx + '" y="' + (H - 8) + '" class="cx">' + esc(ch.labels[i]) + '</text>'; }).join('');
  } else {
    const pts = vals.map((v, i) => x(i) + ',' + yv(v)).join(' ');
    marks = '<polyline points="' + pts + '" class="cl"/>' + vals.map((v, i) => '<circle cx="' + x(i) + '" cy="' + yv(v) + '" r="4" class="cd"><title>' + esc(ch.labels[i]) + ': ' + esc(ch.unit) + ' ' + v.toLocaleString('en-US') + '</title></circle>' +
      '<text x="' + x(i) + '" y="' + (H - 8) + '" class="cx">' + esc(ch.labels[i]) + '</text>').join('');
  }
  return '<figure class="achart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ch.caption) + '">' + ticks + marks + '</svg><figcaption>' + esc(ch.caption) + ' (' + esc(ch.unit) + ')</figcaption></figure>';
}

function planCard(d, c){
  const rows = (c.rows||[]).map(r => '<dt>' + esc(r.label) + '</dt><dd>' + esc(r.value) + '</dd>').join('');
  // Template variables ({{1}}) are filled per customer; show that in words.
  const preview = c.preview ? '<div class="bubble"' + (c.preview.channel === 'instagram' ? ' style="background:#F3F0F7"' : '') + '><small>' + (c.preview.channel === 'instagram' ? 'Your caption' : 'How customers will see it') + '</small>' + esc(c.preview.text).replace(/\{\{\s*\d+\s*\}\}/g, '[personalised]') + '</div>' : '';
  const why = c.why && c.why.length ? '<details class="why"><summary>Why this plan</summary><ul>' + c.why.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul></details>' : '';
  const test = c.dry_run ? '<div class="test"><b>Test mode.</b> Approving records what Zen would do. Nothing is sent or spent.</div>' : '';
  // The shared plan card: decisions as lines, each with reason, source and choices.
  const lines = c.lines || [];
  const lineHtml = (l, i) => {
    const tick = l.step != null && l.optional ? '<input type="checkbox" checked data-ltick="' + i + '" aria-label="Include: ' + esc(l.label + ' ' + l.value) + '">' : '';
    const opts = (l.options || []).length ? '<div class="pl-opts" hidden data-lopts="' + i + '">' + l.options.map((o, k) =>
      '<button type="button" class="chip" data-lopt="' + i + ':' + k + '" aria-pressed="' + (o.value === l.value) + '">' + esc(o.label) + '</button>').join('') + '</div>' : '';
    const acts = ((l.options || []).length ? '<button type="button" class="btn btn-q btn-sm" data-lchange="' + i + '">Change</button>' : '') +
      (l.open ? '<button type="button" class="btn btn-s btn-sm" data-zenopen="' + esc(JSON.stringify({ view: l.open.view, params: l.open.params || {} })) + '">' + esc(l.open.label) + '</button>' : '');
    return '<div class="pline" data-line="' + i + '">' + tick + '<div class="pl-main"><div class="pl-label">' + esc(l.label) + '</div>' +
      '<div class="pl-value" data-lvalue="' + i + '">' + esc(l.value) + '</div>' +
      (l.why || l.source ? '<div class="pl-why">' + esc(l.why || '') + (l.source ? '<span class="pl-src">Source: ' + esc(l.source) + '</span>' : '') + '</div>' : '') +
      (acts ? '<div class="pl-acts">' + acts + '</div>' : '') + opts + '</div></div>';
  };
  const doLines = lines.map((l, i) => [l, i]).filter(([l]) => l.step != null);
  const mainLines = lines.map((l, i) => [l, i]).filter(([l]) => l.step != null || l.group === 'plan');
  const adviceLines = lines.map((l, i) => [l, i]).filter(([l]) => l.step == null && l.group !== 'plan');
  const linesHtml = !lines.length ? '' :
    '<div class="plines">' + mainLines.map(([l, i]) => lineHtml(l, i)).join('') + '</div>' +
    (adviceLines.length ? '<div class="padvice-h">Also worth doing (not part of this approval)</div><div class="plines">' + adviceLines.map(([l, i]) => lineHtml(l, i)).join('') + '</div>' : '') +
    (c.spend ? '<div class="pspend" data-pspend></div>' : '') +
    (c.checks && c.checks.length ? '<ul class="pchecks">' + c.checks.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '');
  d.innerHTML = '<span class="badge">' + esc(c.badge) + '</span><h3>' + esc(c.title) + '</h3><div class="body">' + esc(c.summary) + '</div>' +
    (rows ? '<dl class="kv">' + rows + '</dl>' : '') + linesHtml + preview + why +
    '<div class="actions" data-planbtns><button class="btn btn-p" type="button" data-approve>' + esc(c.approve_label || 'Approve') + '</button>' +
    '<button class="btn btn-q" type="button" data-cancel>Not now</button></div>' + test;

  const approve = d.querySelector('[data-approve]'), cancel = d.querySelector('[data-cancel]');
  let armed = false, armTimer = null;
  // Ticked lines, the label on the approve button, and what daily spend becomes.
  const ticked = new Set(doLines.map(([, i]) => i));
  const money = v => (c.spend ? c.spend.currency : 'AED') + ' ' + (Math.round(v * 100) / 100).toLocaleString('en-US');
  const approveText = () => {
    if (!lines.length) return c.approve_label || 'Approve';
    const n = ticked.size;
    const noun = c.approve_noun || 'change';
    return n ? 'Approve ' + n + ' ' + noun + (n === 1 ? '' : 's') : 'Nothing ticked';
  };
  const refresh = () => {
    if (!armed){ approve.textContent = approveText(); approve.disabled = !!lines.length && !ticked.size; }
    const box = d.querySelector('[data-pspend]');
    if (box && c.spend){
      const delta = [...ticked].reduce((t, i) => t + (Number(lines[i].delta) || 0), 0);
      const after = Math.max(0, c.spend.current_daily + delta);
      box.textContent = 'Daily ad spend: ' + money(c.spend.current_daily) + ' now \u2192 ' + money(after) + ' if approved (' + (delta >= 0 ? '+' : '\u2212') + money(Math.abs(delta)) + ' a day)';
    }
  };
  d.querySelectorAll('[data-ltick]').forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.ltick; if (cb.checked) ticked.add(i); else ticked.delete(i);
    cb.closest('.pline').classList.toggle('off', !cb.checked); refresh();
  });
  d.querySelectorAll('[data-lchange]').forEach(b => b.onclick = () => {
    const box = d.querySelector('[data-lopts="' + b.dataset.lchange + '"]'); box.hidden = !box.hidden;
    b.textContent = box.hidden ? 'Change' : 'Close';
  });
  d.querySelectorAll('[data-lopt]').forEach(b => b.onclick = async () => {
    const [i, k] = b.dataset.lopt.split(':').map(Number), l = lines[i], o = l.options[k];
    if (o.prompt){ zen('cancel_plan', { plan_id: c.plan_id }); d.querySelectorAll('button,input').forEach(x => x.disabled = true); send(o.prompt, o.context ? { context: o.context } : undefined); return; }
    const was = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    const j = await zen('revise_plan_step', { plan_id: c.plan_id, step_index: l.step, patch: o.patch });
    b.disabled = false; b.textContent = was;
    if (!j.ok){ d.after(errorCard(j.error)); return; }
    l.value = o.value; l.delta = o.delta;
    d.querySelector('[data-lvalue="' + i + '"]').textContent = o.value;
    d.querySelectorAll('[data-lopts="' + i + '"] button').forEach((x, n) => x.setAttribute('aria-pressed', String(n === k)));
    refresh();
  });
  approve.onclick = async () => {
    // Two taps for anything that sends, spends or publishes.
    if (!armed){
      armed = true; approve.classList.add('btn-armed'); approve.textContent = c.dry_run ? 'Tap again to approve (test mode)' : 'Tap again to confirm';
      armTimer = setTimeout(() => { armed = false; approve.classList.remove('btn-armed'); refresh(); }, 5000);
      return;
    }
    clearTimeout(armTimer);
    approve.disabled = true; cancel.disabled = true; approve.innerHTML = '<span class="spin"></span>Working…';
    const skip = doLines.filter(([, i]) => !ticked.has(i)).map(([l]) => l.step);
    d.querySelectorAll('[data-ltick],[data-lchange],[data-lopt]').forEach(x => x.disabled = true);
    const j = await zen('approve_plan', { plan_id: c.plan_id, skip_steps: skip });
    const btns = d.querySelector('[data-planbtns]');
    if (!j.ok){ approve.disabled = false; cancel.disabled = false; armed = false; approve.classList.remove('btn-armed'); d.querySelectorAll('[data-ltick],[data-lchange],[data-lopt]').forEach(x => x.disabled = false); refresh(); d.after(errorCard(j.error)); return; }
    btns.outerHTML = '<div class="status-line">Approved</div>';
    const note = d.querySelector('.test'); if (note) note.remove();
    (j.cards || []).forEach(x => { const n = renderCard(x); d.after(n); n.scrollIntoView({ block:'nearest', behavior:'smooth' }); });
  };
  cancel.onclick = async () => {
    cancel.disabled = true; approve.disabled = true;
    const j = await zen('cancel_plan', { plan_id: c.plan_id });
    d.querySelector('[data-planbtns]').outerHTML = '<div class="status-line" style="color:var(--muted)">' + (j.ok ? 'Not sent. Ask again any time.' : esc(j.error)) + '</div>';
    const note = d.querySelector('.test'); if (note) note.remove();
    d.querySelectorAll('[data-ltick],[data-lchange],[data-lopt]').forEach(x => x.disabled = true);
  };
  refresh();
}

function resultCard(d, c){
  const word = { done:'Done', dry_run:'Test only', failed:'Failed', cancelled:'Skipped', proposed:'Waiting', running:'In progress' };
  const steps = c.steps && c.steps.length ? '<ul class="steps">' + c.steps.map(s =>
    '<li><div>' + esc(s.label) + (s.detail ? '<small>' + esc(s.detail) + '</small>' : '') + '</div><span class="st st-' + esc(s.status) + '">' + esc(word[s.status] || s.status) + '</span></li>').join('') + '</ul>' : '';
  d.innerHTML = '<h3>' + esc(c.title) + '</h3><div class="body">' + esc(c.body) + '</div>' + steps +
    (c.next ? followUps([c.next]) : '');
  wireFollowUps(d);
}
</script>
</body>
</html>
