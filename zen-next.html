<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen · new (test)</title>
<script>
/* Catches literally anything that goes wrong anywhere on this page,
   from the very first moment the page starts loading - before the
   Supabase library, before the app's own code, before anything else.
   Every earlier "blank page" report has had no visible error attached
   to it, which means whatever is actually failing on that machine has
   never been seen - only guessed at. This makes the real error
   visible on the page itself, in plain text, so the next report can
   be a screenshot of the actual problem instead of another guess.
   No dependencies - this has to work even if everything else fails. */
(function(){
  var shown = false;
  function showFatal(title, detail){
    if (shown) return; shown = true;
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#fbfaf7;z-index:99999;padding:40px 24px;font-family:-apple-system,Segoe UI,sans-serif;overflow:auto;';
    box.innerHTML =
      '<div style="max-width:560px;margin:0 auto;">' +
      '<h1 style="font-size:20px;margin:0 0 8px;color:#1c201d;">Something on this page failed to run</h1>' +
      '<p style="color:#6f756f;font-size:13px;line-height:1.6;margin:0 0 18px;">'+title+'</p>' +
      '<pre style="background:#1c201d;color:#fff;padding:14px 16px;border-radius:10px;font-size:11.5px;' +
      'line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;">'+detail+'</pre>' +
      '<p style="color:#6f756f;font-size:12px;margin-top:16px;">Please copy the text above exactly as shown \u2014 that is the real cause, not a guess.</p>' +
      '<button onclick="location.reload()" style="margin-top:10px;background:#175e52;color:#fff;border:0;' +
      'border-radius:8px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;">Reload</button>' +
      '</div>';
    (document.body || document.documentElement).appendChild(box);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  window.addEventListener('error', function(e){
    var msg = e.message || 'Unknown error';
    var loc = (e.filename ? e.filename.split('/').pop() : 'unknown file') + ':' + (e.lineno||'?') + ':' + (e.colno||'?');
    var stack = e.error && e.error.stack ? e.error.stack : '(no stack available)';
    showFatal('A script error stopped the page here: ' + esc(loc), esc(msg + '\n\n' + stack));
  });
  window.addEventListener('unhandledrejection', function(e){
    var reason = e.reason;
    var msg = (reason && reason.message) ? reason.message : String(reason);
    var stack = (reason && reason.stack) ? reason.stack : '(no stack available)';
    showFatal('A background task failed without being caught.', esc(msg + '\n\n' + stack));
  });
  // If the page never leaves the loading state within a reasonable
  // time - no error thrown, just stuck - say so explicitly instead of
  // staying silent. A silent hang and a silent success look identical
  // from outside; this makes the difference visible.
  setTimeout(function(){
    // Written before signup and forgot-password existed - it only
    // ever knew about two valid resting states. Landing correctly on
    // either of the newer ones looked identical to a genuine hang to
    // this check, and it said so - confidently, and wrongly. All five
    // real destinations now checked, hardcoded rather than reading
    // the app's own VIEWS list, since this script is deliberately
    // dependency-free and has to work even if everything else fails.
    var ids = ['app','loginGate','signupGate','forgotGate','onb'];
    var anyVisible = ids.some(function(id){
      var el = document.getElementById(id);
      return el && getComputedStyle(el).display !== 'none';
    });
    if (!anyVisible){
      var gate = document.getElementById('loginGate');
      showFatal('Nothing rendered within 6 seconds, and no error was thrown \u2014 this is a genuine hang, not a normal wait.',
        'document.readyState: ' + esc(document.readyState) + '\n' +
        'window.supabase defined: ' + (typeof window.supabase) + '\n' +
        'loginGate exists: ' + (!!gate));
    }
  }, 6000);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   zen-next.html: the NEW Zen test UI. Talks only to mw-zen.
   ZenPro.html is untouched and keeps working alongside this file.
   ===================================================================== */
:root{
  --ground:#EEF0EC;     /* page */
  --surface:#FFFFFF;    /* cards */
  --ink:#16211D;        /* text */
  --muted:#56615C;      /* secondary text (5.9:1 on white) */
  --line:#D9DDD6;       /* hairlines */
  --accent:#1F5C4E;     /* Zen green: primary actions */
  --accent-soft:#E2EDE8;
  --amber:#9A4712;      /* needs your OK, money at stake */
  --amber-soft:#F7E9DC;
  --waste:#A3361F;      /* wasting money */
  --wa:#E3F1E7;         /* WhatsApp bubble */
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Figtree', 'Segoe UI', system-ui, sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- buttons ---- */
.btn{border:0;border-radius:12px;min-height:44px;padding:10px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:#174A3E}
.btn-s{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-s:hover{border-color:#B9C0B7}
.btn-q{background:transparent;color:var(--muted);padding:10px 12px}
.btn[disabled]{opacity:.55;cursor:default}
.btn-armed{background:var(--amber)!important}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- views ---- */
#loginGate,#app{display:none}
.view-on{display:flex!important}

/* ---- login ---- */
#loginGate{min-height:100%;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-lg);padding:32px}
.mark{font:600 34px/1 var(--display);letter-spacing:-.02em}
.login p{color:var(--muted);margin:6px 0 24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:#fff}
.hint{font-size:14px;color:var(--muted);margin-top:12px;min-height:20px}
.hint.err{color:var(--waste)}
.picker{display:flex;flex-direction:column;gap:8px;margin-top:8px}

/* ---- app shell ---- */
#app{min-height:100%}
.rail{width:200px;flex-shrink:0;padding:28px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.rail .mark{font-size:28px;padding:0 12px 22px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:11px 12px;font-weight:500;color:var(--muted);text-align:left;min-height:44px}
.nav svg{width:20px;height:20px;flex-shrink:0}
.nav:hover{color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink)}
.rail-foot{padding:4px 12px 12px;font-size:13px;color:var(--muted)}
.rail-foot b{display:block;color:var(--ink);font-weight:600}
.rail-foot button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px;margin-top:4px}
main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---- home landing ---- */
.landing{width:100%;max-width:840px;margin:0 auto;padding:72px 32px 48px}
.greet{font:600 clamp(34px,5vw,52px)/1.05 var(--display);letter-spacing:-.025em;margin:0 0 28px}
.prompt{background:var(--surface);border-radius:var(--r-lg);padding:20px 20px 14px;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(22,33,29,.35)}
.prompt textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:21px;line-height:1.4;min-height:60px}
.prompt textarea::placeholder{color:#8A948F}
.prompt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.send{width:46px;height:46px;border-radius:14px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
.send svg{width:20px;height:20px}
.send[disabled]{opacity:.5}
.note{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:500;font-size:14px;min-height:40px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.block{margin-top:44px}
.block h2{font:600 19px/1.3 var(--display);margin:0 0 12px;letter-spacing:-.01em}
.nudge{background:var(--surface);border-radius:var(--r-md);padding:16px 18px;display:flex;gap:16px;align-items:center;margin-bottom:10px}
.nudge .txt{flex:1;min-width:0}
.nudge b{display:block;font-weight:600}

/* ---- conversation ---- */

.chatlist{display:flex;flex-direction:column;gap:2px}

.chatopen span{color:var(--muted);font-size:14px;flex-shrink:0}
.chatrow{display:flex;align-items:center;gap:2px;border-bottom:1px solid #EEF0EC;flex-wrap:wrap}

.histdlg{max-width:640px}
.convo-top h1{font:600 17px/1.3 var(--display);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{width:100%;max-width:780px;margin:0 auto;padding:8px 32px 180px;display:flex;flex-direction:column;gap:18px}
.you{align-self:flex-end;max-width:80%;background:var(--ink);color:#fff;padding:12px 18px;border-radius:20px 20px 6px 20px;white-space:pre-line}
.dock{position:fixed;bottom:0;right:0;left:200px;padding:14px 32px 22px;background:linear-gradient(to top,var(--ground) 70%,rgba(238,240,236,0))}
.dock .prompt{max-width:780px;margin:0 auto;padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:10px;border-radius:18px}

/* thinking: the one orchestrated motion on the page */
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:500}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}

/* ---- cards ---- */
.card{background:var(--surface);border-radius:var(--r-md);padding:22px 24px}

.verdict .v-why{font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag-working{background:var(--accent-soft);color:var(--accent)}
.tag-watch{background:#ECEEEA;color:var(--muted)}
.tag-wasting{background:#F6E1DB;color:var(--waste)}
.steps{list-style:none;margin:14px 0 0;padding:0}

.steps .st{font-weight:600;font-size:14px}
.st-done{color:var(--accent)} .st-dry_run{color:var(--amber)} .st-failed{color:var(--waste)} .st-cancelled,.st-proposed,.st-running{color:var(--muted)}
.steps small{display:block;color:var(--muted);font-size:13px}
.status-line{margin-top:14px;font-weight:600;font-size:15px}
.err-card{border:1px solid #E6C2B8}

/* ---- WhatsApp area ---- */
.wa{flex:1;display:flex;flex-direction:column;min-height:100vh;padding:28px 32px 24px;max-width:1240px;width:100%;margin:0 auto}

.crow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctime{font-size:13px;color:var(--muted);flex-shrink:0}
.clast{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.ctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.t{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:#ECEEEA;color:var(--muted)}
.t-unread{background:var(--accent);color:#fff}
.t-book{background:var(--accent-soft);color:var(--accent)}
.t-price{background:#E6ECF5;color:#2D4A73}
.t-alert{background:#F6E1DB;color:var(--waste)}
.t-clock{background:var(--amber-soft);color:var(--amber)}
.thread{background:var(--surface);border-radius:var(--r-md);display:flex;flex-direction:column;min-height:0}
.thead{padding:16px 20px;border-bottom:1px solid #EEF0EC;display:flex;align-items:center;gap:12px}

.tfoot{padding:14px 16px;border-top:1px solid #EEF0EC;display:flex;flex-direction:column;gap:10px}

.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.camp h3{font:600 18px/1.25 var(--display);margin:6px 0 0}

.camp .stats{font-size:13px;color:var(--muted);margin-top:6px}

.stat{background:var(--surface);border-radius:var(--r-md);padding:18px}

.lift{background:var(--surface);border-radius:var(--r-md);padding:16px 18px;margin-top:10px;max-width:760px}

.lift .pts.neg{color:var(--waste)}

/* ---- results detail ---- */
.more{margin-top:26px}
.dsec{margin-top:34px;max-width:980px}
.dsec h2{font:600 20px/1.3 var(--display);margin:0 0 4px}
.dsec .lede{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:680px}
.funnel{background:var(--surface);border-radius:var(--r-md);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr) 150px;gap:12px;align-items:center;font-size:15px}
.fbar{height:14px;border-radius:7px;background:#E5E9E3;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.fbar i.bad{background:var(--waste)}
.frow .fv{text-align:right;color:var(--muted)} .frow .fv b{color:var(--ink)}
.days{background:var(--surface);border-radius:var(--r-md);padding:18px 20px 12px;display:flex;align-items:flex-end;gap:6px;height:180px;overflow-x:auto}
.day{flex:1 0 28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}

table.dt{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}

.good{color:var(--accent);font-weight:600} .bad{color:var(--waste);font-weight:600} .quiet{color:var(--muted)}
.flist{background:var(--surface);border-radius:var(--r-md);padding:4px 20px}

.flist div:last-child{border-bottom:0}

/* ---- page areas (gallery, brand) ---- */
.page{flex:1;padding:28px 32px 48px;max-width:1240px;width:100%;margin:0 auto}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}

.search{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);min-width:300px}
#vPlan{display:flex;flex-direction:column;gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;min-height:40px}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{columns:4 220px;column-gap:14px}
.tile{break-inside:avoid;margin:0 0 14px;background:var(--surface);border-radius:var(--r-md);overflow:hidden;border:0;padding:0;width:100%;text-align:left;display:block}

.tile .st{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.92);color:var(--ink)}
.tile .st.approved{color:var(--accent)} .tile .st.published{background:var(--accent);color:#fff} .tile .st.scheduled{color:var(--amber)}
.tile .play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(22,33,29,.75);color:#fff;display:grid;place-items:center;font-size:13px}
.tile .cap{padding:10px 12px 12px}
.tile .cap b{display:block;font-weight:600;font-size:15px}
.tile .cap span{font-size:13px;color:var(--muted)}
dialog.viewer{border:0;border-radius:var(--r-lg);padding:0;max-width:980px;width:calc(100% - 32px);max-height:calc(100dvh - 32px)}
dialog.viewer::backdrop{background:rgba(22,33,29,.55)}
.vgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.vmedia{background:#16211D;display:flex;align-items:center;justify-content:center;min-height:320px}
.vmedia img,.vmedia video{max-width:100%;max-height:78dvh;display:block}
.vinfo{padding:24px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:calc(100dvh - 32px)}
.vinfo h2{font:600 24px/1.2 var(--display);margin:0}
.vinfo .capt{white-space:pre-line;background:#F6F7F4;border-radius:12px;padding:12px 14px;font-size:15px}
.vclose{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);border:0;width:40px;height:40px;border-radius:50%;font-size:20px}
.vwhen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st.made{background:var(--accent);color:#fff}
.st.uploaded{background:#ECEEEA;color:var(--ink)}
.st.reference{background:#EEE6F4;color:#5B3A78}
#galWhen{margin-bottom:6px}
.galtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tile.selmode .media::after{content:"";position:absolute;inset:0;background:rgba(22,33,29,.04)}
.tile .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(22,33,29,.25);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tile.picked .tick{background:var(--accent);border-color:#fff}
.tile.picked .tick::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tile.picked{box-shadow:0 0 0 3px var(--accent)}
.tile.locked{opacity:.45}
.tile.locked .tick{display:none}
.selbar{position:sticky;bottom:12px;z-index:5;margin-top:14px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px -10px rgba(22,33,29,.5)}
.selbar .btn-q{color:#fff}

.seln{font-size:15px;margin-right:auto;padding:0 6px}
.selmsg{flex-basis:100%;font-size:13px;color:#DDE5E1;padding:0 6px}
.flabel{font-size:13px;font-weight:600;color:var(--muted);min-width:44px;align-self:center}
.vdel{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-del{background:transparent;color:var(--waste);border:1px solid #E6C2B8}
.btn-del.armed{background:var(--waste);color:#fff;border-color:var(--waste)}
.vwhen input{border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.hero{background:var(--surface);border-radius:var(--r-lg);padding:26px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:start;max-width:980px}
.logo{width:120px;height:120px;border-radius:20px;background:#F1F3EF;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;text-align:center}

.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}

.kv2{display:grid;grid-template-columns:110px 1fr;gap:6px 14px}

.gaps{background:var(--amber-soft);border-radius:var(--r-md);padding:16px 20px;margin-top:16px;max-width:980px}

.rows{background:var(--surface);border-radius:var(--r-md)}

.back{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0;margin-bottom:6px;min-height:36px}
.back:hover{color:var(--ink)}

.pills{display:flex;gap:6px;flex-wrap:wrap}

.step h2{font:600 20px/1.3 var(--display);margin:0 0 4px;display:flex;gap:10px;align-items:baseline}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pick{background:var(--surface);border:2px solid transparent;border-radius:var(--r-md);padding:0;overflow:hidden;text-align:left}

.addphoto{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}

.chosen{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border-radius:var(--r-md);padding:14px;margin-top:12px}

.chosen .f{flex:1;display:flex;flex-direction:column;gap:8px}
.chosen input,.chosen textarea,.qs input,.qs textarea,.qs select,.igc input,.igc textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.look{background:var(--surface);border:2px solid transparent;border-radius:var(--r-md);padding:0;overflow:hidden;text-align:left}
.look[aria-pressed="true"]{border-color:var(--accent)}
.look .vis{height:110px;display:grid;place-items:center}
.look .vis svg{width:64px;height:64px}
.slot .card,#vPlan .card{background:#F7F8F5}
.look .txt{padding:12px 14px}
.look b{display:block;font-weight:600}
.look span{font-size:13px;color:var(--muted)}

.qs{background:var(--surface);border-radius:var(--r-md);padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.gen{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.res{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.res .box{background:#E5E9E3;display:grid;place-items:center;min-height:240px}
.res img{width:100%;display:block}
.res .acts{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}
.igwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;max-width:1040px;align-items:start}
.igimg{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.igimg img,.igimg video{width:100%;display:block}
.igc{background:var(--surface);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:10px}
.igc label{font-weight:600;font-size:14px}
.igc .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.igc input[type=datetime-local]{width:auto}

/* ---- Settings ---- */
.acct{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;margin-top:auto}
.acct:hover,.acct[aria-current="page"]{background:var(--surface)}
.acct b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.acct span{font-size:13px;color:var(--muted)}
.acctbtn{display:none}
.banner{border-radius:var(--r-md);padding:16px 20px;max-width:980px;display:flex;gap:14px;align-items:flex-start}
.banner.test{background:var(--amber-soft)} .banner.live{background:var(--accent-soft)}
.banner b{display:block;font-size:16px}
.banner.test b{color:var(--amber)} .banner.live b{color:var(--accent)}
.banner code{background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px;font-size:13px}
.srow{padding:14px 18px;border-bottom:1px solid #EEF0EC;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.srow .txt b{display:block;font-weight:600}
.srow .txt span{font-size:14px;color:var(--muted)}
.srow select,.srow input[type=number],.srow input[type=text],.srow input[type=url],.srow textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.srow input[type=number]{width:84px}
.ok{font-size:13px;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--accent-soft);color:var(--accent)}
.no{font-size:13px;font-weight:600;border-radius:999px;padding:4px 11px;background:#ECEEEA;color:var(--muted)}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:#C9CFC6;position:relative;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:25px}
.switch.armed{background:var(--amber)}
.saved{font-size:13px;color:var(--accent);font-weight:600}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.colors input[type=color]{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.colors input[type=text]{width:110px}

/* ---- setup check ---- */
.hc-sum{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.hc-area{margin-top:14px}
.hc-area h3{font:600 15px/1.3 var(--display);margin:0 0 6px;color:var(--muted)}
.hc-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #EEF0EC}
.hc-row .lab{flex-shrink:0;width:78px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 0;text-align:center}
.lab.pass{background:var(--accent-soft);color:var(--accent)} .lab.warn{background:var(--amber-soft);color:var(--amber)} .lab.fail{background:#F6E1DB;color:var(--waste)}
.hc-row b{display:block;font-weight:600;font-size:15px}
.hc-row span.d{font-size:14px;color:var(--muted)}

/* ---- Settings layout (Claude-style: sections on the left, one open on the right) ---- */
.setwrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;max-width:1040px}
.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px;align-self:start}

.setnav button:hover{color:var(--ink)}
.setnav button[aria-current="page"]{background:var(--surface);color:var(--ink)}
.setmain .sec{margin-top:0}
.spanel .back{margin-bottom:8px}
.mback{display:none}
.subrow{width:100%;text-align:left;border:0;background:transparent;cursor:pointer}
.subrow:hover{background:#F7F8F5}
.subrow > span{color:var(--muted);font-size:20px}

/* ---- Create console ---- */
.crtop{display:flex;align-items:center;gap:12px}
.crwrap{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:#F7F8F5;border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-h{display:flex;justify-content:space-between;align-items:baseline}

.slot .pills .filter{min-height:32px;padding:5px 10px;font-size:13px}
.crrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crpick{display:flex;flex-direction:column;gap:6px}
.optsum{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#F7F8F5;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;min-height:44px}

.optsum em{font-style:normal;font-weight:600;color:var(--accent);white-space:nowrap}
.crset{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px}

.brandsw b{display:block}
.brandsw span{color:var(--muted)}
.brandsw b{color:var(--ink)}
details.sent{margin-top:8px;font-size:13px}
details.sent summary{cursor:pointer;color:var(--muted);font-weight:600}
details.sent pre{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.slot-off .btn-q{padding-left:0;padding-right:0;text-align:left}
.mopts{display:grid;grid-template-columns:1fr;gap:6px}

.mopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.mopt[disabled]{opacity:.5;cursor:not-allowed}
.mopt[disabled] em{color:var(--muted)}
.szd{flex-basis:100%}
.used{font-size:12px;font-weight:600;color:var(--accent)}
.crlabel{font-weight:600;font-size:15px;margin-bottom:-6px}
#crText{border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;min-height:96px;background:#fff;font-size:16px}

.crstatus{margin:-4px 0 0;font-size:14px;color:var(--muted);min-height:20px}
.crstatus.bad{color:var(--waste)}
.crsel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:14px;margin-top:4px}
details.prompt{padding:0 12px;font-size:13px}
details.prompt summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
details.prompt summary i{font-style:normal;font-weight:500}
details.prompt pre{white-space:pre-wrap;background:#F7F8F5;border-radius:10px;padding:10px;margin:0 0 6px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:200px;overflow:auto}
.pedit{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.change{padding:8px 12px 0;display:flex;flex-direction:column;gap:6px}
.change textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.crthread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:80px;max-height:40vh}

.zenmsg .actions{margin-top:10px}
.refining{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.crcompose{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}

.crempty{background:var(--surface);border-radius:var(--r-lg);padding:48px 28px;text-align:center;color:var(--muted)}
.crempty b{display:block;color:var(--ink);font:600 20px/1.3 var(--display);margin-bottom:6px}
.crgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.crcard{background:var(--surface);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
.crcard img{width:100%;height:auto;display:block;background:#E5E9E3}
.crstate{display:grid;place-items:center;background:#EEF1EC;min-height:200px;padding:16px;text-align:center}

.crmeta{padding:10px 12px 0;display:flex;flex-direction:column;gap:2px}
.crcard .actions{padding:0 12px 12px;margin-top:8px}
.pk{padding:24px;max-height:calc(100dvh - 32px);overflow-y:auto}
.pk h2{font:600 22px/1.2 var(--display);margin:0}
.pk .search{width:100%;margin:6px 0 12px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pkcard{border:0;background:#F7F8F5;border-radius:12px;padding:0;overflow:hidden;text-align:left}
.pkcard img{width:100%;height:auto;display:block}
.pkcard .ph{aspect-ratio:1;display:grid;place-items:center;color:var(--muted)}
.pkcard span{display:block;padding:8px 10px;font-weight:600;font-size:14px}
.pkcard:hover{box-shadow:0 0 0 2px var(--accent) inset}

/* ---- AI Inspiration ---- */
.pickbar{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 10px}
.ins-hero{max-width:860px}
.ins-hero h1{font:600 clamp(30px,4vw,42px)/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 16px}
.ins-ask{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:8px 8px 8px 18px;box-shadow:0 1px 0 var(--line),0 18px 40px -30px rgba(22,33,29,.35)}

.ins-h{font:600 20px/1.3 var(--display);margin:22px 0 10px}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

<body>

<!-- ================= LOGIN ================= -->
<div id="loginGate">
  <div class="login">
    <div class="mark">Zen</div>
    <p>The new Zen, in testing. Log in with your usual Zen account.</p>
    <form id="loginForm" onsubmit="event.preventDefault();doLogin();">
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-p" id="loginBtn" type="submit" style="width:100%;justify-content:center">Log in</button>
    </form>
    <div class="hint" id="loginMsg" role="status"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <nav class="rail" aria-label="Main">
    <div class="mark">Zen</div>
    <button class="nav" data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="nav" data-go="whatsapp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.8 7L4 20l1-4.1A8 8 0 1 1 20 12Z"/></svg>WhatsApp</button>
    <button class="nav" data-go="gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="m4 16 4.5-4.5 4 4 3-3L20 16"/><circle cx="15.5" cy="9" r="1.5"/></svg>Library</button>
    <button class="nav" data-go="marketing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14V10l12-5v14L4 14Z"/><path d="M8 15v3.5a1.5 1.5 0 0 0 3 0V16"/><path d="M19 9.5v5"/></svg>Marketing</button>
    <button class="nav" data-go="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="10" r="1.2"/><circle cx="14.5" cy="9" r="1.2"/><circle cx="15.5" cy="14" r="1.2"/><path d="M11 16.5a2 2 0 0 1-2-2"/></svg>Brand</button>
    <button class="acct" type="button" id="acctBtn" data-go="settings"><b id="railTenant"></b><span>Settings</span></button>
    <div class="rail-foot"><span id="railUser"></span><br><button type="button" onclick="doLogout()">Log out</button></div>
  </nav>

  <main>
    <button class="acctbtn" type="button" id="acctBtnMobile" aria-label="Settings" onclick="go('settings')">⚙</button>
    <!-- Home: landing -->
    <section id="landing" class="landing">
      <h1 class="greet" id="greet">Good morning</h1>
      <form class="prompt" onsubmit="event.preventDefault();sendFrom('bigInput');">
        <label for="bigInput" class="sr">Tell Zen what you want</label>
        <textarea id="bigInput" rows="2" placeholder="What would you like Zen to do?"></textarea>
        <div class="prompt-row">
          <span class="note">Photos and links come in a later step.</span>
          <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </form>
      <div class="chips" id="chips"></div>
      <div class="block">
        <h2>Worth your attention</h2>
        <div id="nudges"><div class="empty">Checking your business…</div></div>
      </div>
      <div class="block" id="recentBlock" hidden>
        <div class="block-h"><h2>Pick up where you left off</h2><button class="btn btn-q" type="button" id="seeAllChats">See all</button></div>
        <div class="chatlist" id="threads"></div>
      </div>
    </section>

    <!-- Home: conversation -->
    <section id="convo" class="convo" aria-live="polite">
      <div class="convo-top">
        <button class="ctop-back" type="button" id="convoBack">← Home</button>
        <div class="ctitle"><h1 id="convoTitle">Conversation</h1><button class="iconbtn" type="button" id="convoRename" aria-label="Rename this conversation" title="Rename">✎</button></div>
        <div class="ctop-acts"><button class="btn btn-q" type="button" id="convoHistory">All chats</button><button class="btn btn-s" type="button" id="convoNew">+ New chat</button></div>
      </div>
      <div class="log" id="log"></div>
      <form class="dock" onsubmit="event.preventDefault();sendFrom('dockInput');">
        <div class="prompt">
          <label for="dockInput" class="sr">Reply to Zen</label>
          <textarea id="dockInput" rows="1" placeholder="Reply to Zen"></textarea>
          <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </form>
    </section>

    <dialog class="viewer histdlg" id="histDlg" aria-label="Your conversations"></dialog>

    <!-- WhatsApp -->
    <section id="wa" class="wa" hidden>
      <div class="wa-top">
        <h1>WhatsApp</h1>
        <div class="tabs" role="tablist" aria-label="WhatsApp">
          <button class="tab" role="tab" data-watab="inbox" aria-selected="true">Inbox</button>
          <button class="tab" role="tab" data-watab="campaigns" aria-selected="false">Campaigns</button>
          <button class="tab" role="tab" data-watab="results" aria-selected="false">Results</button>
        </div>
      </div>
      <div id="waInbox" role="tabpanel"></div>
      <div id="waCamps" role="tabpanel" hidden></div>
      <div id="waResults" role="tabpanel" hidden></div>
    </section>

    <!-- Gallery -->
    <section id="gallery" class="page" hidden>
      <div class="page-top">
        <h1>Library</h1>
        <div class="galtop"><label class="sr" for="galSearch">Search your library</label>
        <input id="galSearch" class="search" type="search" placeholder="Search titles, captions and prompts">
        <button class="btn btn-s" type="button" id="galSelect">Select</button></div>
      </div>
      <div class="filters" id="galWhen" aria-label="When"></div>
      <div class="filters" id="galFilters" aria-label="What"></div>
      <div id="galBody"></div>
      <div class="selbar" id="galBar" hidden role="region" aria-label="Selection"></div>
      <dialog class="viewer" id="viewer" aria-label="Gallery item"></dialog>
    </section>

    <!-- Marketing -->
    <section id="mkt" class="page" hidden></section>

    <!-- Settings -->
    <section id="settings" class="page" hidden></section>

    <!-- Brand -->
    <section id="brand" class="page" hidden></section>

    <!-- Other areas -->
    <section id="soon" class="soon" hidden></section>
  </main>
</div>

<script>
/* =====================================================================
   zen-next.html app logic.
   - Talks ONLY to mw-zen (plus mw-admin's my_tenants for the login
     tenant list, the same call ZenPro makes).
   - Login, tenant resolution and logout follow ZenPro's proven pattern:
     no automatic session restore at boot, no silent tenant fallback,
     a logout that can't hang.
   ===================================================================== */
const SB_URL = 'https://wtapyfgtwkjyjrjdnhkb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0YXB5Zmd0d2tqeWpyamRuaGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDc3ODEsImV4cCI6MjA5NTAyMzc4MX0.y_-iPfb8Pcg9zh42h6RGVBsUVZm80LcA9sPlz_Gl_fA';
const ZEN_FN = SB_URL + '/functions/v1/mw-zen';
const STUDIO_FN = SB_URL + '/functions/v1/mw-studio';       // the new image service (concept library first)
const ZENPRO_URL = 'ZenPro.html';          // where "Open in ZenPro" goes
const CARD_SCHEMA_VERSION = 1;              // must match mw-zen

let sb = null, session = null, tenant = null, tenantName = '', myTenantList = [];
let threadId = null, busy = false;
const PROPOSALS = new Map();                // button id -> {tool, input}
let proposalSeq = 0;

const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showView(name){
  ['loginGate','app'].forEach(v => el(v).classList.toggle('view-on', v === name));
}
function showBootError(msg){
  el('loginGate').innerHTML = '<div class="login"><div class="mark">Zen</div><p>' + msg + '</p><button class="btn btn-p" onclick="location.reload()">Try again</button></div>';
  showView('loginGate');
}
function safeStorage(){
  try{ const k='__zen_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; }
}

// ---------- boot (no automatic session restore, same as ZenPro) ----------
if (typeof window.supabase === 'undefined'){
  showBootError('The login library did not load. Reload the page to try again.');
} else {
  try{
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storage: safeStorage(), persistSession: true, autoRefreshToken: true } });
    // Keep the token fresh during a session that started with a login on THIS visit.
    sb.auth.onAuthStateChange((_event, s) => { if (session && s) session = s; });
    showView('loginGate');
  }catch(e){ showBootError('The login library did not start. ' + esc(e && e.message)); }
}

// ---------- transport ----------
async function zen(action, args, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 90000);
  try{
    const r = await fetch(ZEN_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + (session ? session.access_token : SB_KEY) },
      body: JSON.stringify(Object.assign({ action, tenant_id: tenant, card_schema_version: CARD_SCHEMA_VERSION }, args || {})),
      signal: controller.signal,
    });
    let j; try { j = await r.json(); } catch { return { ok:false, error:'Zen sent something unreadable.' }; }
    if (r.status === 401) j.error = 'Your login has expired. Log out and in again.';
    return j;
  }catch(e){
    if (e && e.name === 'AbortError') return { ok:false, error:'Zen took too long to answer, so the request was stopped. Try again.' };
    return { ok:false, error:'Could not reach Zen. Check your connection and try again.' };
  }finally{ clearTimeout(timer); }
}

// mw-studio: the new image service. Same login, no tenant needed for the shared library.
async function studio(action, args, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 60000);
  try{
    const r = await fetch(STUDIO_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + (session ? session.access_token : SB_KEY) },
      body: JSON.stringify(Object.assign({ action }, args || {})),
      signal: controller.signal,
    });
    let j; try { j = await r.json(); } catch { return { ok:false, error:'The studio sent something unreadable. Is mw-studio deployed?' }; }
    return j;
  }catch(e){
    if (e && e.name === 'AbortError') return { ok:false, error:'The studio took too long to answer.' };
    return { ok:false, error:'Could not reach the studio. Is mw-studio deployed?' };
  }finally{ clearTimeout(timer); }
}

// my_tenants lives in mw-admin; same call ZenPro makes at login.
async function mwAdmin(action, args, sess){
  try{
    const r = await fetch(SB_URL + '/functions/v1/mw-admin', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + sess.access_token },
      body: JSON.stringify(Object.assign({ action }, args || {})),
    });
    return await r.json();
  }catch(e){ return { ok:false, error:'Could not reach the server.' }; }
}

// ---------- login ----------
async function doLogin(){
  const m = el('loginMsg'), btn = el('loginBtn');
  m.className = 'hint'; m.textContent = 'Logging in…'; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email: el('loginEmail').value.trim(), password: el('loginPass').value });
  btn.disabled = false;
  if (error){
    m.className = 'hint err';
    m.textContent = window.supabase.isAuthRetryableFetchError && window.supabase.isAuthRetryableFetchError(error)
      ? 'Could not reach the login server. This is a connection problem, not your password.'
      : 'That email and password did not match. Check both and try again.';
    return;
  }
  session = data.session;
  const j = await mwAdmin('my_tenants', {}, session);
  if (!j.ok){ m.className = 'hint err'; m.textContent = 'Logged in, but could not load your business: ' + (j.error || ''); return; }
  myTenantList = j.tenants || [];
  if (!myTenantList.length){ m.className = 'hint err'; m.textContent = 'This login has no business yet. Finish setup in ZenPro first.'; return; }
  if (myTenantList.length > 1){
    el('loginForm').style.display = 'none';
    m.className = 'hint';
    m.innerHTML = '<b>Which business?</b><div class="picker">' + myTenantList.map((t,i) =>
      '<button class="btn btn-s" onclick="selectTenant(' + i + ')">' + esc((t.mw_tenants && t.mw_tenants.name) || t.tenant_id) + '</button>').join('') + '</div>';
    return;
  }
  selectTenant(0);
}

function selectTenant(i){
  const t = myTenantList[i];
  tenant = t.tenant_id;
  tenantName = (t.mw_tenants && t.mw_tenants.name) || t.tenant_id;
  el('railTenant').textContent = tenantName;
  el('railUser').textContent = (session.user && session.user.email) || '';
  el('loginForm').style.display = '';
  el('loginMsg').textContent = '';
  showView('app');
  go('home');
}

// Deliberately does NOT call sb.auth.signOut(): it can hang (see ZenPro).
function doLogout(){
  if (!confirm('Log out?')) return;
  try { localStorage.removeItem('sb-' + new URL(SB_URL).hostname.split('.')[0] + '-auth-token'); } catch(e){}
  session = null; tenant = null; tenantName = ''; myTenantList = []; threadId = null;
  el('log').innerHTML = ''; el('loginEmail').value = ''; el('loginPass').value = '';
  showView('loginGate');
}

// ---------- navigation ----------
const AREAS = {
};
document.querySelectorAll('.nav').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
el('acctBtn').addEventListener('click', () => go('settings'));

function go(area){
  document.querySelectorAll('.nav').forEach(b => { if (b.dataset.go === area) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const soon = el('soon');
  stopWaRefresh();
  if (area !== 'marketing' && typeof stopCreatePolling === 'function') stopCreatePolling();
  el('wa').hidden = area !== 'whatsapp';
  el('gallery').hidden = area !== 'gallery';
  el('brand').hidden = area !== 'brand';
  el('mkt').hidden = area !== 'marketing';
  el('settings').hidden = area !== 'settings';
  if (area === 'settings') el('acctBtn').setAttribute('aria-current','page'); else el('acctBtn').removeAttribute('aria-current');
  if (area === 'settings'){
    soon.hidden = true; el('landing').style.display = 'none'; el('convo').style.display = 'none';
    loadSettings();
    return;
  }
  if (area === 'marketing'){
    soon.hidden = true; el('landing').style.display = 'none'; el('convo').style.display = 'none';
    if (MKT.pending !== 'keep') mktView(MKT.pending || 'home');
    MKT.pending = null;
    return;
  }
  if (area === 'whatsapp' || area === 'gallery' || area === 'brand'){
    soon.hidden = true; el('landing').style.display = 'none'; el('convo').style.display = 'none';
    if (area === 'whatsapp') waTab(WA.tab || 'inbox');
    if (area === 'gallery') loadGallery();
    if (area === 'brand') loadBrand();
    return;
  }
  if (area === 'home'){
    soon.hidden = true;
    goHome();                                                  // always the main screen; the conversation is kept in history
    return;
  }
  el('landing').style.display = 'none'; el('convo').style.display = 'none';
  const [title, text] = AREAS[area];
  soon.innerHTML = '<h1>' + esc(title) + '</h1><p>' + esc(text) + ' It comes in a later build step. For now, use ZenPro, or ask Zen on Home.</p>' +
    '<a class="btn btn-s" href="' + ZENPRO_URL + '" target="_blank" rel="noopener">Open ZenPro</a>';
  soon.hidden = false;
}

// ---------- home ----------
const CHIPS = [
  ['How am I doing?', 'How am I doing this week?'],
  ['Check my ads', 'How are my ads doing?'],
  ['Win back customers', "Message customers who haven't visited recently"],
  ['Who needs a reply?', 'Which conversations need a reply?'],
  ['Get more bookings', 'Get me more bookings this weekend'],
  ['Ask a question', null],
];
function showLanding(){
  el('convo').style.display = 'none';
  el('landing').style.display = 'block';
  const h = new Date().getHours();
  el('greet').textContent = (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', ' + tenantName;
  el('chips').innerHTML = CHIPS.map(([label], i) => '<button class="chip" type="button" data-chip="' + i + '">' + esc(label) + '</button>').join('');
  el('chips').querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    const p = CHIPS[+b.dataset.chip][1];
    if (p) send(p); else { el('bigInput').focus(); el('bigInput').placeholder = 'Ask anything about your business…'; }
  });
  loadNudges(); loadThreads();
  setTimeout(() => el('bigInput').focus(), 50);
}
function showConvo(){
  el('landing').style.display = 'none';
  el('convo').style.display = 'flex';
  if (!(history.state && history.state.zen === 'convo')) history.pushState({ zen: 'convo' }, '');
}
// Back to the main screen. The conversation is kept and listed under "Pick up where you left off".
function goHome(){ threadId = null; el('log').innerHTML = ''; showLanding(); }
function newConversation(){ goHome(); }

// The phone's back gesture and the browser's back button work inside Home:
// conversation -> main screen, history panel -> where you were.
window.addEventListener('popstate', () => {
  const h = el('histDlg');
  if (h && h.open){ h.dataset.fromPop = '1'; h.close(); return; }
  if (el('convo').style.display !== 'none' && !el('convo').closest('[hidden]')) goHome();
});
function leaveConvo(){ if (history.state && history.state.zen === 'convo') history.back(); else goHome(); }
el('convoBack').onclick = leaveConvo;
el('convoNew').onclick = leaveConvo;
el('convoHistory').onclick = () => openHistory();
el('seeAllChats').onclick = () => openHistory();

// Rename the open conversation in place.
el('convoRename').onclick = () => {
  if (!threadId){ return; }
  const h = el('convoTitle'), old = h.textContent;
  const inp = document.createElement('input'); inp.className = 'ctitle-in'; inp.value = old; inp.maxLength = 120; inp.setAttribute('aria-label', 'Conversation name');
  h.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    const t = inp.value.trim(); const nh = document.createElement('h1'); nh.id = 'convoTitle'; nh.textContent = save && t ? t : old; inp.replaceWith(nh);
    if (save && t && t !== old){ const j = await zen('rename_thread', { thread_id: threadId, title: t }, 15000); if (!j.ok) el('convoTitle').textContent = old; }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); finish(true); } if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
};

// All conversations: search, open, rename, delete (two taps).
async function openHistory(){
  const d = el('histDlg');
  d.innerHTML = '<button class="vclose" type="button" aria-label="Close" id="hX">\u00D7</button><div class="pk"><h2>Your conversations</h2>' +
    '<label class="sr" for="hQ">Search your conversations</label><input id="hQ" class="search" type="search" placeholder="Search by title">' +
    '<div id="hList" class="chatlist"><div class="thinking"><span class="pulse"></span><span>Loading</span></div></div></div>';
  if (!d.open) d.showModal();
  if (!(history.state && history.state.zen === 'history')) history.pushState({ zen: 'history' }, '');
  const close = () => { if (history.state && history.state.zen === 'history') history.back(); else d.close(); };
  el('hX').onclick = close; d.onclick = e => { if (e.target === d) close(); };
  d.onclose = () => { delete d.dataset.fromPop; };
  d.oncancel = e => { e.preventDefault(); close(); };           // Escape closes it the same way as ×
  let timer = null;
  el('hQ').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => loadHistory(el('hQ').value.trim()), 250); });
  loadHistory('');
  setTimeout(() => el('hQ').focus(), 50);
}
async function loadHistory(q){
  const box = el('hList'); if (!box) return;
  const j = await zen('list_threads', { q, limit: 100 }, 20000);
  if (!el('hList')) return;
  const list = (j.ok && j.threads) || [];
  if (!j.ok){ box.innerHTML = '<p class="note bad">' + esc(j.error) + '</p>'; return; }
  if (!list.length){ box.innerHTML = '<p class="note">' + (q ? 'No conversations match \u201c' + esc(q) + '\u201d.' : 'No conversations yet. Ask Zen anything on Home.') + '</p>'; return; }
  box.innerHTML = list.map(t => '<div class="chatrow" data-id="' + esc(t.id) + '">' +
    '<button class="chatopen" type="button"><b>' + esc(t.title || 'Conversation') + '</b><span>' + esc(ago(t.updated_at)) + '</span></button>' +
    '<button class="iconbtn" type="button" data-ren aria-label="Rename" title="Rename">\u270E</button>' +
    '<button class="iconbtn del" type="button" data-del aria-label="Delete" title="Delete">\u2715</button></div>').join('');
  box.querySelectorAll('.chatrow').forEach(row => {
    const id = row.dataset.id, t = list.find(x => x.id === id);
    row.querySelector('.chatopen').onclick = () => {
      // The history step becomes the conversation step, so Back then returns to the main screen.
      if (history.state && history.state.zen === 'history') history.replaceState({ zen: 'convo' }, '');
      el('histDlg').close(); openThread(id, t.title);
    };
    row.querySelector('[data-ren]').onclick = () => {
      const b = row.querySelector('.chatopen b'), inp = document.createElement('input'); inp.className = 'ctitle-in'; inp.value = t.title || ''; inp.maxLength = 120; inp.setAttribute('aria-label', 'Conversation name');
      b.replaceWith(inp); inp.focus(); inp.select();
      let done = false;
      const finish = async save => {
        if (done) return; done = true;
        const v = inp.value.trim(), nb = document.createElement('b'); nb.textContent = save && v ? v : (t.title || 'Conversation'); inp.replaceWith(nb);
        if (save && v && v !== t.title){ const j = await zen('rename_thread', { thread_id: id, title: v }, 15000); if (j.ok){ t.title = v; if (id === threadId) el('convoTitle').textContent = v; } else nb.textContent = t.title; }
      };
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); finish(true); } if (e.key === 'Escape') finish(false); });
      inp.addEventListener('blur', () => finish(true));
    };
    const del = row.querySelector('[data-del]'); let armed = false;
    del.onclick = async () => {
      if (!armed){ armed = true; del.classList.add('armed'); del.textContent = 'Delete?'; setTimeout(() => { if (armed){ armed = false; del.classList.remove('armed'); del.textContent = '\u2715'; } }, 4000); return; }
      del.disabled = true;
      const j = await zen('delete_thread', { thread_id: id }, 15000);
      if (!j.ok){ del.disabled = false; armed = false; del.classList.remove('armed'); del.textContent = '\u2715'; row.insertAdjacentHTML('beforeend', '<p class="note bad">' + esc(j.error) + '</p>'); return; }
      row.remove(); if (id === threadId) goHome();
      if (!el('hList').querySelector('.chatrow')) el('hList').innerHTML = '<p class="note">No conversations yet.</p>';
    };
  });
}

function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s/60)) + ' min ago';
  if (s < 86400) return Math.round(s/3600) + ' h ago';
  return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

async function openThread(id, title){
  threadId = id; el('log').innerHTML = ''; el('convoTitle').textContent = title || 'Conversation'; el('convoRename').hidden = false;
  showConvo();
  const think = addThinking(['Opening the conversation']);
  const j = await zen('get_thread', { thread_id: id }, 20000);
  think.remove();
  if (!j.ok){ el('log').appendChild(errorCard(j.error)); return; }
  (j.messages || []).forEach(m => {
    if (m.role === 'user') addYou(m.text);
    else (m.cards || []).forEach(c => el('log').appendChild(renderCard(c)));
  });
}

// ---------- sending ----------
function sendFrom(id){ const t = el(id).value.trim(); if (t){ el(id).value = ''; send(t); } }
['bigInput','dockInput'].forEach(id => el(id).addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendFrom(id); }
}));

async function send(text, opts){
  if (busy) return;
  busy = true;
  if (!threadId){ el('log').innerHTML = ''; el('convoTitle').textContent = text.length > 60 ? text.slice(0,57) + '…' : text; el('convoRename').hidden = true; }
  showConvo();
  addYou(text);
  const think = addThinking(['Understanding what you need', 'Checking your business', 'Putting it together']);
  const j = await zen('chat', { message: text, thread_id: threadId, acted_nudge_id: opts && opts.nudgeId }, 120000);
  think.remove();
  busy = false;
  if (!j.ok){ el('log').appendChild(errorCard(j.error, text)); return; }
  threadId = j.thread_id || threadId;
  el('convoRename').hidden = !threadId;
  (j.cards || []).forEach(c => el('log').appendChild(renderCard(c)));
  el('dockInput').focus();
}

function addYou(text){
  const d = document.createElement('div'); d.className = 'you'; d.textContent = text;
  el('log').appendChild(d); d.scrollIntoView({ block:'end', behavior:'smooth' });
}
function addThinking(lines){
  const d = document.createElement('div'); d.className = 'thinking'; d.setAttribute('role','status');
  d.innerHTML = '<span class="pulse"></span><span></span>';
  const label = d.lastChild; let i = 0; label.textContent = lines[0];
  const t = setInterval(() => { i = Math.min(i + 1, lines.length - 1); label.textContent = lines[i]; }, 2200);
  const remove = d.remove.bind(d); d.remove = () => { clearInterval(t); remove(); };
  el('log').appendChild(d); d.scrollIntoView({ block:'end', behavior:'smooth' });
  return d;
}
function errorCard(msg, retryText){
  const d = document.createElement('div'); d.className = 'card err-card';
  d.innerHTML = '<h3>That didn\u2019t work</h3><div class="body">' + esc(msg || 'Something went wrong.') + '</div>' +
    (retryText ? '<div class="actions"><button class="btn btn-s" type="button">Try again</button></div>' : '');
  if (retryText) d.querySelector('button').onclick = () => { d.remove(); send(retryText); };
  return d;
}


// =====================================================================
// WhatsApp area: Inbox · Campaigns · Results (all data from mw-zen)
// =====================================================================
const WA = { tab:'inbox', inbox:null, active:null, timer:null, campaigns:null };
document.querySelectorAll('[data-watab]').forEach(b => b.addEventListener('click', () => waTab(b.dataset.watab)));

function stopWaRefresh(){ if (WA.timer){ clearInterval(WA.timer); WA.timer = null; } }

function waTab(tab){
  WA.tab = tab;
  document.querySelectorAll('[data-watab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.watab === tab)));
  el('waInbox').hidden = tab !== 'inbox';
  el('waCamps').hidden = tab !== 'campaigns';
  el('waResults').hidden = tab !== 'results';
  stopWaRefresh();
  if (tab === 'inbox'){
    loadInbox(true);
    // Refresh every 30s, like ZenPro, but never while a reply is being typed.
    WA.timer = setInterval(() => { const box = el('waReply'); if (!box || !box.value.trim()) loadInbox(false); }, 30000);
  }
  if (tab === 'campaigns') loadCampaigns();
  if (tab === 'results') loadWaResults();
}

function timeLeft(iso){
  const ms = Date.parse(iso) - Date.now();
  if (ms <= 0) return null;
  const mins = Math.ceil(ms / 60000), h = Math.floor(mins / 60), m = mins % 60;
  return h ? h + 'h' + (m ? ' ' + m + 'm' : '') : m + ' min';
}
function msgTime(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
const TOPIC = { booking:['t-book','Wants to book'], price:['t-price','Asked about price'], complaint:['t-alert','May be unhappy'], stop:['t-alert','Asked to stop'] };

async function loadInbox(first){
  const box = el('waInbox');
  if (first && !WA.inbox) box.innerHTML = '<div class="empty">Loading conversations…</div>';
  const j = await zen('wa_inbox', {}, 30000);
  if (!j.ok){ if (first) box.innerHTML = '<div class="empty">' + esc(j.error) + '</div>'; return; }
  WA.inbox = j.inbox;
  const convs = WA.inbox.conversations;
  if (!convs.length){ box.innerHTML = '<div class="empty">No messages yet. When a customer messages you on WhatsApp or Instagram, it shows up here.</div>'; return; }
  if (!WA.active || !convs.some(c => c.id === WA.active)) WA.active = first && window.innerWidth <= 760 ? null : convs[0].id;
  const i = WA.inbox;
  const strip = [
    ['', i.waiting, i.waiting === 1 ? 'waiting for a reply' : 'waiting for a reply'],
    ['warn', i.closing_soon, 'reply window closing soon'],
    ['', i.ready_to_book, i.ready_to_book === 1 ? 'wants to book' : 'want to book'],
    ['', i.asked_price, 'asked about price'],
    ['', i.from_ads, 'came from an ad'],
  ].filter(x => x[1]).map(([cls, n, label]) => '<span class="pill ' + cls + '"><b>' + n + '</b> ' + esc(label) + '</span>').join('');
  const keepDraft = el('waReply') ? el('waReply').value : '';
  box.innerHTML = '<div class="strip">' + (strip || '<span class="pill">Nobody is waiting for a reply</span>') + '</div>' +
    '<div class="inbox' + (WA.active && window.innerWidth <= 760 ? ' open' : '') + '" id="waGrid"><div class="clist" id="waList" role="list"></div><div class="thread" id="waThread"></div></div>';
  el('waList').innerHTML = convs.map(c => {
    const tags = [];
    if (c.unhandled) tags.push('<span class="t t-unread">' + c.unhandled + ' new</span>');
    if (c.topic && TOPIC[c.topic]) tags.push('<span class="t ' + TOPIC[c.topic][0] + '">' + TOPIC[c.topic][1] + '</span>');
    if (c.needs_reply && c.window_open){ const left = timeLeft(c.window_closes_at); if (left && Date.parse(c.window_closes_at) - Date.now() < 6*3600000) tags.push('<span class="t t-clock">Reply within ' + left + '</span>'); }
    if (c.from_ad) tags.push('<span class="t">From an ad</span>');
    if (c.channel === 'instagram') tags.push('<span class="t">Instagram</span>');
    return '<button class="citem" role="listitem" data-conv="' + esc(c.id) + '"' + (c.id === WA.active ? ' aria-current="true"' : '') + '>' +
      '<div class="crow"><span class="cname">' + esc(c.name) + '</span><span class="ctime">' + esc(ago(c.last_at)) + '</span></div>' +
      '<div class="clast">' + esc(c.last_text) + '</div>' + (tags.length ? '<div class="ctags">' + tags.join('') + '</div>' : '') + '</button>';
  }).join('');
  el('waList').querySelectorAll('[data-conv]').forEach(b => b.onclick = () => openConversation(b.dataset.conv));
  if (WA.active) renderThread(WA.active, keepDraft);
}

async function openConversation(id){
  WA.active = id;
  el('waList').querySelectorAll('[data-conv]').forEach(b => { if (b.dataset.conv === id) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
  el('waGrid').classList.add('open'); el('waInbox').classList.add('thread-open');
  renderThread(id, '');
  const c = WA.inbox.conversations.find(x => x.id === id);
  if (c && c.unhandled){
    const j = await zen('wa_mark_read', { conversation_id: id }, 15000);
    if (j.ok){ c.unhandled = 0; c.needs_reply = false; const tag = el('waList').querySelector('[data-conv="' + CSS.escape(id) + '"] .t-unread'); if (tag) tag.remove(); }
  }
}

function renderThread(id, draft){
  const c = WA.inbox.conversations.find(x => x.id === id);
  const pane = el('waThread');
  if (!c){ pane.innerHTML = ''; return; }
  const who = m => m.direction !== 'out' ? '' : (m.sent_by === 'auto' ? ' · Zen replied' : m.sent_by === 'agent' ? ' · Sent automatically' : ' · You');
  const msgs = c.messages.map(m => '<div class="msg ' + (m.direction === 'out' ? 'out' : '') + '">' +
    (m.media_url ? '<img src="' + esc(m.media_url) + '" alt="Photo" loading="lazy">' : '') + esc(m.body) +
    '<div class="meta">' + esc(msgTime(m.at)) + esc(who(m)) + '</div></div>').join('');
  const left = c.window_open ? timeLeft(c.window_closes_at) : null;
  const channel = c.channel === 'instagram' ? 'Instagram' : 'WhatsApp';
  const foot = c.window_open
    ? '<div class="tfoot"><label class="sr" for="waReply">Reply to ' + esc(c.name) + '</label>' +
      '<textarea id="waReply" placeholder="Write a reply, or let Zen draft one"></textarea>' +
      '<div class="row"><button class="btn btn-s" type="button" id="waDraftBtn">Draft with Zen</button>' +
      '<span class="note">' + (left ? 'Reply window closes in ' + esc(left) : '') + '</span>' +
      '<button class="btn btn-p" type="button" id="waSendBtn">Send</button></div><div id="waSendNote" class="note" role="status"></div></div>'
    : '<div class="tfoot"><div class="closed"><b>The 24-hour reply window has closed</b>' + esc(channel) + ' only allows approved templates now, so a normal reply won\u2019t go through. To reach ' + esc(c.name) + ', include them in a campaign.</div>' +
      '<div class="row"><button class="btn btn-s" type="button" onclick="waTab(\'campaigns\')">See campaigns</button></div></div>';
  pane.innerHTML = '<div class="thead"><button class="btn btn-q back" type="button" aria-label="Back to conversations" onclick="el(\'waGrid\').classList.remove(\'open\');el(\'waInbox\').classList.remove(\'thread-open\')">\u2190</button>' +
    '<div><h2>' + esc(c.name) + '</h2><small>' + esc(c.handle) + ' · ' + channel + (c.from_ad ? ' · came from an ad' : '') + '</small></div></div>' +
    '<div class="tbody" id="waBody">' + (msgs || '<div class="empty">No messages to show.</div>') + '</div>' + foot;
  const body = el('waBody'); body.scrollTop = body.scrollHeight;
  if (!c.window_open) return;
  const box = el('waReply'); if (draft) box.value = draft;
  el('waDraftBtn').onclick = async () => {
    const b = el('waDraftBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Drafting…';
    const j = await zen('wa_draft_reply', { conversation_id: c.id }, 60000);
    b.disabled = false; b.textContent = 'Draft with Zen';
    if (!j.ok){ el('waSendNote').textContent = j.error; return; }
    box.value = j.draft; box.focus();
    el('waSendNote').textContent = 'Drafted from your business facts and prices. Check it, then send.';
  };
  el('waSendBtn').onclick = async () => {
    const text = box.value.trim();
    if (!text){ box.focus(); return; }
    const b = el('waSendBtn'); b.disabled = true; box.disabled = true; b.innerHTML = '<span class="spin"></span>Sending…';
    const j = await zen('wa_send_reply', { conversation_id: c.id, channel: c.channel, message: text }, 30000);
    b.disabled = false; box.disabled = false; b.textContent = 'Send';
    if (!j.ok){ el('waSendNote').textContent = j.error; return; }
    const step = ((j.cards || [])[0] || {}).steps ? j.cards[0].steps[0] : null;
    const status = step ? step.status : 'failed';
    if (status === 'failed'){ el('waSendNote').textContent = 'Not sent: ' + ((step && step.detail) || 'please try again.'); return; }
    box.value = '';
    const bubble = document.createElement('div');
    bubble.className = 'msg out' + (status === 'dry_run' ? ' pending' : '');
    bubble.innerHTML = esc(text) + '<div class="meta">' + (status === 'dry_run' ? 'Test mode: not actually sent' : 'Just now · You') + '</div>';
    el('waBody').appendChild(bubble); el('waBody').scrollTop = el('waBody').scrollHeight;
    el('waSendNote').textContent = status === 'dry_run' ? 'Test mode is on for this business, so nothing was sent. Zen recorded what would have gone out.' : 'Sent.';
    if (status === 'done') setTimeout(() => loadInbox(false), 1500);
  };
}
