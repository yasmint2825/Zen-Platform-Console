name: Metric learnings
# Daily, by request - overriding the original weekly cadence. Worth
# knowing: running nightly re-tests all 153 metric-pair hypotheses
# every day instead of once a week, which raises the chance that a
# spurious pattern appears at least once and gets mistaken for real.
# The Benjamini-Hochberg correction in the script still holds within
# each run - this just means more runs, and more chances for a false
# positive to slip through.
on:
  schedule:
    - cron: '15 5 * * *'   # daily, 05:15 UTC - after mw-refresh-daily-metrics (04:55 UTC), so it reads that day's fresh data
  workflow_dispatch: {}
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install psycopg2-binary==2.9.12
      - name: Find patterns in the daily metrics
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          TENANT_ID: minicuts
        run: python3 ml_pipeline/metric_learnings.py
      - name: Report failure
        if: failure()
        run: echo "::error::Metric learnings failed. The existing learnings are unchanged."
