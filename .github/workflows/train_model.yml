name: Train return-probability model

on:
  schedule:
    # Weekly, Sunday 03:00 UTC — before the daily sync/agent cycle starts
    # its week, giving fresh predictions in place before Monday.
    - cron: '0 3 * * 0'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab, useful while testing

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ml_pipeline/requirements.txt

      - name: Train and score
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          TENANT_ID: minicuts
        run: python3 ml_pipeline/train_and_score.py
